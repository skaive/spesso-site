<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Cardápio · Spesso Cucina</title>
<meta name="description" content="Cardápio do Spesso Cucina — entradas, insalate, piatti principali, pizze e sobremesas. Edifício Argentina, Praia de Botafogo 228."/>
<meta property="og:title" content="Cardápio · Spesso Cucina"/>
<meta property="og:description" content="Spesso apresenta: Resumo do Mostarda. Entradas, massas, risotos, pizze e sobremesas."/>
<meta property="og:image" content="https://spesso.com.br/cardapioevento/img/pizza-mostarda.jpg"/>
<meta name="theme-color" content="#1C2749"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍋</text></svg>"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --navy:#1C2749; --navy-deep:#12172E; --paper:#F6F0E1; --paper-hi:#FBF7EC; --cream:#EFE6CE;
  --ink:#1B2437; --sub:#5C6373; --line:#E3D9C0;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;scroll-padding-top:64px;-webkit-text-size-adjust:100%;}
body{font-family:'Montserrat',sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;-webkit-tap-highlight-color:transparent;}
a{color:inherit;}
img{display:block;max-width:100%;}

/* barra de cima */
.top{background:var(--navy);color:var(--cream);font-size:12.5px;font-weight:600;letter-spacing:.04em;}
.top .in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.top .loc{display:flex;gap:6px;align-items:center;opacity:.9;}
.top a.ig{display:flex;align-items:center;gap:6px;text-decoration:none;opacity:.9;}
.top svg{width:15px;height:15px;flex:none;}

/* hero */
.hero{background:var(--navy);color:var(--cream);text-align:center;padding:28px 16px 44px;border-top:1px solid rgba(239,230,206,.12);}
.hero .logo{width:130px;margin:0 auto 18px;opacity:.95;}
.hero .selo{width:min(760px,100%);height:auto;margin:0 auto;}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* abas das categorias */
.tabs{position:sticky;top:0;z-index:20;background:rgba(246,240,225,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
.tabs .in{max-width:1120px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;}
.tabs .in::-webkit-scrollbar{display:none;}
.tabs a{flex:none;text-decoration:none;font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;color:var(--navy);border:1px solid transparent;white-space:nowrap;transition:background .15s ease,color .15s ease;}
.tabs a.on{background:var(--navy);color:var(--cream);}
@media(hover:hover){.tabs a:not(.on):hover{border-color:var(--navy);}}

/* seções */
main{max-width:1120px;margin:0 auto;padding:8px 16px 40px;}
section{padding-top:36px;}
section h2{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(26px,4vw,34px);color:var(--navy);text-align:center;}
section h2::after{content:"";display:block;width:40px;height:3px;background:var(--navy);margin:10px auto 0;border-radius:2px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:24px;}
@media(max-width:360px){.grid{grid-template-columns:1fr;}}
.card{background:var(--paper-hi);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;}
.card .ph{aspect-ratio:800/637;background:var(--cream);overflow:hidden;}
.card .ph img{width:100%;height:100%;object-fit:cover;}
img[width]{height:auto;}
.card .tx{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;}
.card .hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
.card h3{font-family:'Playfair Display',serif;font-weight:600;font-size:18px;line-height:1.25;color:var(--navy);}
.card .pr{flex:none;font-weight:700;font-size:15px;color:var(--navy);font-variant-numeric:tabular-nums;white-space:nowrap;}
.card p{font-size:13.5px;color:var(--sub);}

/* rodapé */
footer{background:var(--navy);color:var(--cream);text-align:center;padding:36px 16px calc(28px + env(safe-area-inset-bottom));font-size:14px;}
footer .logo{width:120px;margin:0 auto 18px;}
footer .info{display:flex;flex-direction:column;gap:8px;align-items:center;}
footer a{text-decoration:none;opacity:.9;}
footer .ver{margin-top:22px;font-size:11px;opacity:.45;}
</style>
</head>
<body>

<div class="top"><div class="in">
  <span class="loc"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>Spesso Cucina · Botafogo</span>
  <a class="ig" href="https://www.instagram.com/spesso.rio/" target="_blank" rel="noopener" aria-label="Instagram do Spesso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>@spesso.rio</a>
</div></div>

<header class="hero">
  <img class="logo" src="/logo-cream.png" alt="Spesso"/>
  <h1 class="vh">Spesso apresenta: Resumo do Mostarda</h1>
  <img class="selo" src="img/mostarda.png" alt="Spesso apresenta: Resumo do Mostarda 2000 · 90 + 80" width="800" height="374"/>
</header>

<nav class="tabs" aria-label="Categorias"><div class="in" id="abas"></div></nav>

<main id="cardapio"></main>

<footer>
  <img class="logo" src="/logo-cream.png" alt="Spesso" loading="lazy"/>
  <div class="info">
    <span>Edifício Argentina · Praia de Botafogo, 228</span>
    <a href="tel:+5521968831580">+55 (21) 96883-1580</a>
    <a href="mailto:contato@spesso.com.br">contato@spesso.com.br</a>
    <a href="https://www.instagram.com/spesso.rio/" target="_blank" rel="noopener">@spesso.rio</a>
  </div>
  <div class="ver">skv-versao cardapioevento-v1 07/11/2026</div>
</footer>

<script>
const CARDAPIO = [
  { cat:'Entradas', itens:[
    ['arancini','Coppia di Arancini',36.90,'Cada porção vem com dois arancini do mesmo sabor. Escolha: recheados com fior di latte, acompanhados de geleia de mel e mostarda, ou recheados com rabada, acompanhados de molho de pomodoro pelati levemente picante.'],
    ['pizzette','Giro delle Pizzette',49.90,'Quarteto de pizzette: Maiale Reale, Resumo do Mostarda, Calabresa e 4 Formaggi.'],
    ['ciabatta','Sanduíche Ciabatta di Coppa',42.90,'Pão ciabatta artesanal recheado com lombo desfiado, cebola roxa, aioli defumado, parmesão e salada de repolho roxo.'],
    ['bruschette','Tris di Bruschette',39.90,'Trio de bruschettas: tradicional, funghi e caponata.'],
    ['sardella','Sardella con Caponata di Melanzane',39.90,'Sardela com caponata de berinjela, cebola roxa, alho, pimentões, maracujá, alcaparras e passas. Acompanha cesta de pães.'],
    ['carpaccio','Carpaccio di Salmone Affumicato',59.90,'Carpaccio de salmão defumado, azeite extravirgem e alcaparras.'],
  ]},
  { cat:'Insalate', itens:[
    ['insalata-foglie','Insalata di Foglie, Rucola, Pere, Gorgonzola e Noci',54.90,'Salada de folhas, rúcula, pera, gorgonzola e nozes.'],
    ['insalata-salmone','Insalata di Salmone Affumicato',68.00,'Salada com lascas de salmão defumado, folhas verdes, tomates-cereja, cebola roxa e molho de limão-siciliano.'],
    ['insalata-polvo','Insalata di Polvo, Patate e Limone Siciliano',79.00,'Salada de polvo macio com batatas, tomates confit, azeitonas azapa, pesto fresco, limão-siciliano, dill e salsinha.'],
  ]},
  { cat:'Piatti Principali', itens:[
    ['rosetta','Rosetta di Ricotta e Spinaci al Burro e Salvia',69.90,'Rosetta de ricota e espinafre com molho de manteiga e sálvia.'],
    ['gnocchi','Gnocchi della Fortuna',69.00,'Nhoque com linguiça, mix de cogumelos e tomates pelati.'],
    ['fettuccine-fiorentina','Fettuccine alla Fiorentina',78.90,'Fettuccine com molho roti, iscas de filé mignon e espinafre.'],
    ['fettuccine-neri','Fettuccine Neri al Polvo Mediterraneo',89.00,'Massa fresca de tinta de lula com polvo macio, limão-siciliano e pesto.'],
    ['risotto-gamberi','Risotto ai Gamberi con Peperoncino',89.00,'Risoto de camarões salteados, pimenta dedo-de-moça e vinho branco.'],
    ['risotto-coda','Risotto di Coda alla Vaccinara con Crescione',87.90,'Risoto de rabada com agrião.'],
    ['risotto-baccala','Risotto di Baccalà e Arancia Cristallizzata',86.90,'Risoto de bacalhau com laranja cristalizada.'],
  ]},
  { cat:'Pizze', itens:[
    ['pizza-mostarda','Resumo do Mostarda',74.92,'Fior di latte, gorgonzola dolce, pera caramelizada, nozes quebradas, mel, mostarda e parmesão.'],
    ['pizza-maiale','Maiale Reale',76.90,'Lombo suíno desfiado lentamente, picles de cebola roxa, parmesão, repolho roxo, aioli defumado e finalização de mostarda antiga.'],
    ['pizza-margherita','Margherita Speciale',52.90,'Massa madre, tomate pelati italiano, mussarela e manjericão fresco.'],
    ['pizza-parma','Parma e Rúcula',64.90,'Mussarela, parma, rúcula fresca e creme balsâmico.'],
    ['pizza-calabresa','Calabresa',62.90,'Mussarela, calabresa curada fatiada e tapenade de azeitonas.'],
    ['pizza-4formaggi','Pizza 4 Formaggi',67.90,'Mussarela, gorgonzola, grana padano, mel trufado e borda recheada com cream cheese.'],
  ]},
  { cat:'Sobremesas', itens:[
    ['tiramisu','Tiramisù Tradizionale',34.90,'Tiramisu tradicional.'],
    ['panna-cotta','Panna Cotta ai Frutti di Bosco',29.90,'Panna cotta com frutas do bosque.'],
    ['semifreddo','Semifreddo',34.90,'Sobremesa gelada com doce de leite, castanhas caramelizadas e caramelo salgado.'],
  ]},
];

const brl = v => 'R$ ' + v.toFixed(2).replace('.', ',');
const slug = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,'-');
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

document.getElementById('cardapio').innerHTML = CARDAPIO.map(s => `
  <section id="${slug(s.cat)}">
    <h2>${esc(s.cat)}</h2>
    <div class="grid">${s.itens.map(([img,nome,preco,desc]) => `
      <article class="card">
        <div class="ph"><img src="img/${img}.jpg" alt="${esc(nome)}" loading="lazy" width="800" height="637"/></div>
        <div class="tx">
          <div class="hd"><h3>${esc(nome)}</h3><span class="pr">${brl(preco)}</span></div>
          <p>${esc(desc)}</p>
        </div>
      </article>`).join('')}
    </div>
  </section>`).join('');

const abas = document.getElementById('abas');
abas.innerHTML = CARDAPIO.map(s => `<a href="#${slug(s.cat)}">${esc(s.cat)}</a>`).join('');
const links = [...abas.querySelectorAll('a')];
const marcar = id => links.forEach(a => {
  const on = a.getAttribute('href') === '#' + id;
  a.classList.toggle('on', on);
  if (on) abas.scrollTo({left: a.offsetLeft - (abas.clientWidth - a.offsetWidth) / 2, behavior:'smooth'});
});
const io = new IntersectionObserver(es => {
  es.filter(e => e.isIntersecting).forEach(e => marcar(e.target.id));
}, {rootMargin:'-70px 0px -65% 0px'});
document.querySelectorAll('main section').forEach(s => io.observe(s));
marcar('entradas');
</script>
</body>
</html>
