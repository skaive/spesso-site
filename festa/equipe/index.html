<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Equipe · Jardim do Éder</title>
<meta name="theme-color" content="#0B2216"/>
<meta name="color-scheme" content="dark"/>
<meta name="robots" content="noindex"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@500;700;800&family=Kaushan+Script&display=swap" rel="stylesheet"/>
<style>
:root{--selva:#0B2216;--selva-2:#113021;--selva-3:#18402C;--linha:#2A5A40;--creme:#F4E8CB;--tinta:#3A2312;
  --ouro:#E0A93F;--ouro-2:#F3C766;--texto:#F4EBD6;--texto-2:#BFD0BF;--ok:#3FB96B;--erro:#FF7A57;--sab:env(safe-area-inset-bottom,0px);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--selva);}
body{font-family:'Alegreya Sans',system-ui,sans-serif;color:var(--texto);font-size:17px;line-height:1.35;min-height:100dvh;overscroll-behavior-y:none;}
button,input{font:inherit;color:inherit;}
button{border:0;background:none;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;}
.oculto{display:none!important;}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
  border-bottom:1px solid var(--linha);position:sticky;top:0;background:rgba(11,34,22,.96);z-index:10;}
header h1{font-family:'Kaushan Script',cursive;font-weight:400;font-size:22px;color:var(--creme);}
header .quem{font-size:14px;color:var(--texto-2);text-align:right;}
header .quem b{color:var(--ouro-2);display:block;font-size:15px;}
.wrap{padding:16px 16px calc(120px + var(--sab));max-width:560px;margin:0 auto;}
.bt{border-radius:14px;padding:14px 16px;font-weight:800;font-size:17px;}
.bt.ouro{background:var(--ouro);color:var(--tinta);} .bt.ok{background:var(--ok);color:#06200F;}
.bt.linha{border:1px solid var(--linha);color:var(--creme);} .bt.creme{background:var(--creme);color:var(--tinta);}
.bt.perigo{border:1px solid var(--erro);color:var(--erro);}
.bt:active{transform:scale(.97);} .bt:disabled{opacity:.5;}
.grande{width:100%;padding:20px;font-size:21px;}
h2{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--texto-2);margin:22px 0 10px;}
.card{background:var(--selva-2);border:1px solid var(--linha);border-radius:16px;padding:14px;margin-bottom:10px;}
.lin{display:flex;justify-content:space-between;gap:10px;align-items:center;}
.puls{background:var(--ouro);color:var(--tinta);font-weight:800;border-radius:12px;min-width:56px;padding:6px 8px;text-align:center;font-size:26px;line-height:1;}
.puls small{display:block;font-size:10px;letter-spacing:.1em;}
.mut{color:var(--texto-2);font-size:14px;}
.tag{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--selva-3);color:var(--texto-2);}
.tag.erro{background:rgba(255,122,87,.15);color:var(--erro);} .tag.ok{background:rgba(63,185,107,.18);color:#8EE6AE;}
.tag.vivo{background:rgba(224,169,63,.16);color:var(--ouro-2);}
.res{border-width:2px;}
.res.bom{border-color:var(--ok);} .res.ruim{border-color:var(--erro);}
.res .grande-txt{font-size:24px;font-weight:800;color:var(--creme);line-height:1.15;}
.acoes{display:grid;gap:8px;margin-top:12px;}
.formas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.formas .bt.on{background:var(--creme);color:var(--tinta);}
.aviso{border-radius:12px;padding:10px 12px;margin-top:10px;font-size:15px;background:rgba(255,122,87,.12);color:var(--erro);}
.aviso.ok{background:rgba(63,185,107,.14);color:#8EE6AE;}
.campo{width:100%;padding:14px;border-radius:12px;border:1px solid var(--linha);background:var(--selva);font-size:18px;margin-top:8px;}
.pin{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
.pin button{height:64px;border-radius:14px;background:var(--selva-2);border:1px solid var(--linha);font-size:26px;font-weight:800;}
.bolinhas{display:flex;gap:12px;justify-content:center;margin:16px 0 4px;}
.bolinhas i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ouro);} .bolinhas i.on{background:var(--ouro);}
.nomes{display:grid;gap:8px;}
.nomes button{text-align:left;padding:14px;border-radius:14px;background:var(--selva-2);border:1px solid var(--linha);display:flex;justify-content:space-between;}
.nomes button span{color:var(--texto-2);font-size:14px;}
.scan{position:fixed;inset:0;z-index:30;background:#000;display:flex;flex-direction:column;}
.scan video{flex:1;width:100%;object-fit:cover;}
.scan .mira{position:absolute;left:50%;top:42%;width:66vw;max-width:300px;aspect-ratio:1;transform:translate(-50%,-50%);
  border:3px solid var(--ouro);border-radius:22px;box-shadow:0 0 0 999px rgba(0,0,0,.35);}
.scan .baixo{position:absolute;left:0;right:0;bottom:0;padding:14px 16px calc(16px + var(--sab));display:grid;gap:8px;background:linear-gradient(transparent,rgba(0,0,0,.8));}
.barra{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(10px + var(--sab));background:rgba(9,27,17,.97);border-top:1px solid var(--linha);}
.barra .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:8px;}
.resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.resumo div{background:var(--selva-2);border:1px solid var(--linha);border-radius:14px;padding:10px;text-align:center;}
.resumo b{display:block;font-size:20px;color:var(--creme);}
.resumo span{font-size:12.5px;color:var(--texto-2);}
.qrbox{background:#fff;border-radius:16px;padding:12px;width:min(70vw,260px);margin:12px auto;}
.qrbox svg{width:100%;height:auto;display:block;}
</style>
</head>
<body>
<header><h1>Jardim do Éder · equipe</h1><div class="quem" id="quem"></div></header>
<div class="wrap" id="app"></div>
<div class="barra oculto" id="barra"><div class="in">
  <button class="bt ouro grande" id="ler">Ler QR</button>
  <button class="bt linha" id="digitar" aria-label="Digitar código">⌨︎</button>
</div></div>
<div class="scan oculto" id="scan">
  <video id="video" playsinline muted></video><div class="mira"></div>
  <div class="baixo"><div class="mut" id="scan-msg" style="text-align:center;color:#fff">Aponte para o QR do voucher ou da conta</div>
  <button class="bt linha" style="background:rgba(0,0,0,.5)" id="scan-fechar">Fechar câmera</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
const SB='https://ujxdbktmbowtokrxxylb.supabase.co', K='sb_publishable_esAA71xiJkVOowMYoH0iEg_PPcb6xiP';
const VER='festa-equipe-v1 24/11/2026';
const SLUG = new URLSearchParams(location.search).get('e') || 'jardim-eder';
const CLIENTE = 'https://spesso.com.br/festa/?t=';
const $=s=>document.querySelector(s);
const brl=v=>'R$ '+Number(v||0).toFixed(2).replace('.',',');
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const hora=t=>t?new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';
const minutos=t=>t?Math.max(0,Math.round((Date.now()-new Date(t))/60000)):0;
async function rpc(n,a){
  const r=await fetch(`${SB}/rest/v1/rpc/${n}`,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(a)});
  const t=await r.text(); let j=null; try{j=t?JSON.parse(t):null}catch{}
  if(!r.ok){const e=new Error((j&&j.message)||'erro'); e.codigo=j&&j.message; throw e;} return j;
}
const MSG={sessao_invalida:'Sua sessão acabou. Entre de novo.',pin_errado:'PIN errado.',sem_alcada:'Só o caixa ou a gestão pode fazer isso.',
  voucher_invalido:'Voucher não encontrado.',voucher_cancelado:'Esse voucher foi CANCELADO.',conta_nao_encontrada_ou_ja_paga:'Essa conta não existe ou já foi paga.'};
const msgErro=e=>MSG[e.codigo]||'Falhou. Confira a internet e tente de novo.';

let S=null; try{S=JSON.parse(localStorage.getItem('festa_eq_'+SLUG)||'null')}catch{}
let P=null, ultimoCodigo=null, timer=null;

/* ---------------------------------------------------------------- login */
async function telaLogin(){
  $('#barra').classList.add('oculto'); $('#quem').innerHTML='';
  $('#app').innerHTML='<p class="mut">Carregando…</p>';
  let nomes=[]; try{nomes=await rpc('ev_equipe_nomes',{p_slug:SLUG})}catch{}
  const PAP={bar:'bar',garcom:'garçom',caixa:'caixa',porta:'porta',gestao:'gestão'};
  $('#app').innerHTML=`<h2>Quem é você?</h2><div class="nomes">${nomes.map(n=>`<button data-n="${esc(n.nome)}">${esc(n.nome)}<span>${PAP[n.papel]}</span></button>`).join('')||'<p class="mut">Ninguém cadastrado neste evento.</p>'}</div>`;
  document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>telaPin(b.dataset.n));
}
function telaPin(nome){
  let pin='';
  const pintar=(erro)=>{
    $('#app').innerHTML=`<h2>${esc(nome)}</h2><p class="mut">Digite seu PIN</p>
      <div class="bolinhas">${[0,1,2,3].map(i=>`<i class="${i<pin.length?'on':''}"></i>`).join('')}</div>
      ${erro?`<div class="aviso">${esc(erro)}</div>`:''}
      <div class="pin">${[1,2,3,4,5,6,7,8,9,'←',0,'ok'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div>
      <p style="margin-top:14px"><button class="bt linha" id="volta">Não sou eu</button></p>`;
    document.querySelectorAll('[data-k]').forEach(b=>b.onclick=async()=>{
      const k=b.dataset.k;
      if(k==='←'){pin=pin.slice(0,-1);return pintar();}
      if(k!=='ok'){ if(pin.length<4) pin+=k; pintar(); }
      if(pin.length<4) return;   // com 4 dígitos entra sozinho
      try{ S=await rpc('ev_equipe_entrar',{p_slug:SLUG,p_nome:nome,p_pin:pin}); localStorage.setItem('festa_eq_'+SLUG,JSON.stringify(S)); iniciar(); }
      catch(e){ pin=''; pintar(msgErro(e)); }
    });
    $('#volta').onclick=telaLogin;
  };
  pintar();
}

/* ---------------------------------------------------------------- painel */
function iniciar(){
  $('#quem').innerHTML=`<b>${esc(S.nome)}</b>${esc({bar:'bar',garcom:'garçom',caixa:'caixa',porta:'porta',gestao:'gestão'}[S.papel])} · <a href="#" id="sair" style="color:inherit">sair</a>`;
  $('#sair').onclick=e=>{e.preventDefault(); localStorage.removeItem('festa_eq_'+SLUG); S=null; telaLogin();};
  $('#barra').classList.remove('oculto');
  atualizar(); clearInterval(timer); timer=setInterval(()=>{ if(!document.hidden && !$('#res')) atualizar(); },8000);
  const h=location.hash.slice(1); if(h){ history.replaceState(null,'',location.pathname+location.search); ler(h); }
}
async function atualizar(){
  try{ P=await rpc('ev_painel',{p_sessao:S.sessao}); desenhar(); }
  catch(e){ if(e.codigo==='sessao_invalida'){ localStorage.removeItem('festa_eq_'+SLUG); S=null; return telaLogin(); } }
}
function pedidoCard(p){
  const st = p.status==='erro' ? '<span class="tag erro">NÃO entrou no Frest</span>'
    : (p.status==='pedido'||p.status==='lancando') ? '<span class="tag vivo">indo pro Frest</span>'
    : p.pronto ? '<span class="tag ok">pronto na cozinha</span>' : '<span class="tag">no Frest</span>';
  return `<div class="card"><div class="lin"><div><b>${p.qtd}× ${esc(p.nome)}</b>
    <div class="mut">${esc(p.cliente)} · mesa ${p.mesa}${p.local?' · '+esc(p.local):''} · há ${minutos(p.criado_em)} min</div>
    <div style="margin-top:4px">${st}${p.garcom?` <span class="tag">${esc(p.garcom)}</span>`:''}</div>
    ${p.status==='erro'&&p.erro?`<div class="mut" style="margin-top:4px">${esc(p.erro)}</div>`:''}</div>
    <div class="puls"><small>PULS.</small>${p.pulseira}</div></div>
    ${p.status==='erro'&&(S.papel==='gestao'||S.papel==='caixa')?`<div class="acoes"><button class="bt linha" data-relancar="${p.voucher}">Conferi no Frest: não está lá. Lançar de novo</button></div>`:''}
  </div>`;
}
function desenhar(){
  if($('#res')) return;
  const pend=P.pendentes||[];
  let h='';
  if(P.resumo){ const r=P.resumo;
    h+=`<div class="resumo"><div><b>${brl(r.vendido).replace('R$ ','')}</b><span>vendido (R$)</span></div>
      <div><b>${r.convidadas}</b><span>pulseiras · ${r.pagas} pagas</span></div>
      <div><b style="color:${r.erros?'var(--erro)':'inherit'}">${r.erros}</b><span>sem Frest · ${r.na_fila} na fila</span></div></div>`; }
  if(P.contas&&P.contas.length){
    h+=`<h2>Pediram a conta (${P.contas.length})</h2>`+P.contas.map(c=>`<button class="card" style="width:100%;text-align:left" data-conta="${c.codigo}">
      <div class="lin"><div><b>${esc(c.nome)}</b><div class="mut">mesa ${c.mesa} · pediu ${hora(c.pedida_em)}</div></div>
      <div style="text-align:right"><b>${brl(c.total)}</b>${c.frest_total!=null?`<div class="mut">Frest ${brl(c.frest_total)}</div>`:''}</div>
      <div class="puls"><small>PULS.</small>${c.pulseira}</div></div></button>`).join('');
  }
  if(S.papel==='porta'||S.papel==='gestao'||S.papel==='caixa'){
    h+=`<h2>Cadastrar na porta</h2><div class="card"><p class="mut">Use quando o WhatsApp da convidada não funcionar.</p>
      <button class="bt linha" style="width:100%;margin-top:10px" id="porta">Cadastrar pulseira à mão</button></div>`;
  }
  const meus = S.papel==='garcom' ? pend.filter(p=>p.garcom===S.nome) : [];
  const resto = S.papel==='garcom' ? pend.filter(p=>p.garcom!==S.nome) : pend;
  if(S.papel==='garcom') h+=`<h2>Minhas entregas (${meus.length})</h2>`+(meus.map(pedidoCard).join('')||'<p class="mut">Leia o voucher da cliente para assumir uma entrega.</p>');
  const tit={bar:'Bebidas a entregar',garcom:'Comidas sem garçom',caixa:'Tudo que falta entregar',gestao:'Tudo que falta entregar',porta:'Tudo que falta entregar'}[S.papel];
  h+=`<h2>${tit} (${resto.length})</h2>`+(resto.map(pedidoCard).join('')||'<p class="mut">Nada pendente.</p>');
  h+=`<p class="mut" style="text-align:center;margin-top:24px;font-size:11px">skv-versao ${VER}</p>`;
  $('#app').innerHTML=h;
  document.querySelectorAll('[data-conta]').forEach(b=>b.onclick=()=>ler('C-'+b.dataset.conta));
  document.querySelectorAll('[data-relancar]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Você conferiu no Frest que esse item NÃO está na mesa? Se estiver, vai cobrar duas vezes.')) return;
    try{ await rpc('ev_relancar',{p_sessao:S.sessao,p_voucher:b.dataset.relancar}); atualizar(); }catch(e){ alert(msgErro(e)); }
  });
  const pb=$('#porta'); if(pb) pb.onclick=telaPorta;
}

/* ---------------------------------------------------------------- leitura */
async function ler(texto){
  const cod=String(texto||'').trim(); if(!cod) return;
  if(navigator.vibrate) navigator.vibrate(40);
  $('#app').innerHTML='<p class="mut">Conferindo…</p>';
  try{
    const r=await rpc('ev_ler',{p_sessao:S.sessao,p_codigo:cod});
    if(r.tipo==='voucher') return telaVoucher(r);
    if(r.tipo==='conta') return telaConta(r);
    resultado(`<div class="card res ruim" id="res"><div class="grande-txt">QR não reconhecido</div><p class="mut">Não é voucher nem conta desta festa.</p>${voltar()}</div>`);
  }catch(e){ if(e.codigo==='sessao_invalida'){S=null;return telaLogin();} resultado(`<div class="card res ruim" id="res"><div class="grande-txt">${esc(msgErro(e))}</div>${voltar()}</div>`); }
}
const voltar=()=>`<div class="acoes"><button class="bt linha" onclick="fechar()">Voltar</button></div>`;
function resultado(h){ $('#app').innerHTML=h; window.scrollTo(0,0); }
function fechar(){ const r=$('#res'); if(r) r.remove(); atualizar(); }

function telaVoucher(r){
  const p=r.pedido, c=r.cliente;
  const usado=!!p.entregue_em, cancel=p.status==='cancelado';
  const ruim=usado||cancel;
  let acoes='';
  if(!ruim){
    if(p.tipo==='comida' && S.papel==='garcom'){
      acoes = p.garcom===S.nome
        ? `<button class="bt ok grande" data-a="entregar">Entreguei na mão dela</button><button class="bt linha" data-a="soltar">Não vou conseguir levar (soltar)</button>`
        : p.garcom ? `<div class="aviso">Já é do(a) ${esc(p.garcom)}.</div>`
        : `<button class="bt ouro grande" data-a="assumir">É meu: vou levar</button>`;
    } else {
      acoes=`<button class="bt ok grande" data-a="entregar">Entregar agora</button>`;
    }
  }
  if(S.papel==='gestao'||S.papel==='caixa'){
    if(usado) acoes+=`<button class="bt linha" data-a="desfazer_entrega">Desfazer a entrega</button>`;
    if(!cancel) acoes+=`<button class="bt perigo" data-a="cancelar">Cancelar este pedido</button>`;
  }
  resultado(`<div class="card res ${ruim?'ruim':'bom'}" id="res">
    ${usado?`<div class="aviso">JÁ ENTREGUE às ${hora(p.entregue_em)} por ${esc(p.entregue_por)}. Não entregue de novo.</div>`:''}
    ${cancel?`<div class="aviso">PEDIDO CANCELADO${p.cancelado_por?' por '+esc(p.cancelado_por):''}. Não entregue.</div>`:''}
    <div class="lin" style="margin-top:6px"><div class="grande-txt">${p.qtd}× ${esc(p.nome)}</div><div class="puls"><small>PULS.</small>${c.pulseira}</div></div>
    <p style="margin-top:8px"><b>${esc(c.nome)}</b> · mesa ${c.mesa}${p.local?' · '+esc(p.local):''}</p>
    <p class="mut">Pedido às ${hora(p.criado_em)} · ${p.status==='lancado'?'no Frest':p.status==='erro'?'NÃO entrou no Frest':'indo pro Frest'}</p>
    <p class="mut">Confira o número da pulseira no braço dela.</p>
    <div class="acoes">${acoes}<button class="bt linha" onclick="fechar()">Voltar</button></div></div>`);
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{
    const a=b.dataset.a;
    if(a==='cancelar' && !confirm('Cancelar este pedido? Se já está no Frest, cancele lá também.')) return;
    b.disabled=true;
    try{
      const x=await rpc('ev_voucher_acao',{p_sessao:S.sessao,p_voucher:p.voucher,p_acao:a});
      if(x&&x.ok===false){ const m={ja_entregue:`Já entregue às ${hora(x.em)} por ${x.por}.`,ja_tem_garcom:`Já é do(a) ${x.garcom}.`}[x.motivo]||x.motivo;
        return resultado(`<div class="card res ruim" id="res"><div class="grande-txt">${esc(m)}</div>${voltar()}</div>`); }
      const ok={entregar:'Entregue ✓',assumir:'É seu. Leve quando a cozinha soltar.',soltar:'Solto. Outro garçom pode assumir.',desfazer_entrega:'Entrega desfeita.',cancelar:'Cancelado.'}[a];
      resultado(`<div class="card res bom" id="res"><div class="grande-txt">${ok}</div><p class="mut">${p.qtd}× ${esc(p.nome)} · pulseira ${c.pulseira}</p>${voltar()}</div>`);
      setTimeout(()=>{ if($('#res')) fechar(); }, 2500);
    }catch(e){ b.disabled=false; alert(msgErro(e)); }
  });
}

function telaConta(r){
  const c=r.cliente, k=r.conta;
  const pode=S.papel==='caixa'||S.papel==='gestao';
  const paga=!!c.liberada_em;
  const div = c.frest_total!=null && Math.abs(Number(c.frest_total)-(k.consumo+k.servico))>0.05;
  let forma=null;
  resultado(`<div class="card res ${paga?'ruim':'bom'}" id="res">
    ${paga?`<div class="aviso">JÁ PAGA às ${hora(c.liberada_em)} (${esc(c.liberada_por)}).</div>`:''}
    <div class="lin"><div><div class="grande-txt">${esc(c.nome)}</div><div class="mut">mesa ${c.mesa}${c.cpf?' · CPF na nota: '+esc(c.cpf):''}</div></div><div class="puls"><small>PULS.</small>${c.pulseira}</div></div>
    <div style="margin-top:12px">${k.itens.map(i=>`<div class="lin mut"><span>${i.qtd}× ${esc(i.nome)}${i.status==='erro'?' ⚠︎':''}</span><span>${brl(i.qtd*i.preco)}</span></div>`).join('')}</div>
    <div class="lin" style="margin-top:8px"><span>Consumo</span><b>${brl(k.consumo)}</b></div>
    <div class="lin"><span>Serviço ${k.servico_pct}%</span><b>${brl(k.servico)}</b></div>
    ${k.falta_minimo>0?`<div class="lin"><span>Complemento da consumação</span><b>${brl(k.falta_minimo)}</b></div>`:''}
    <div class="lin" style="margin-top:6px;font-size:24px"><span>Cobrar</span><b style="color:var(--ouro-2)">${brl(k.total)}</b></div>
    ${c.frest_total!=null?`<p class="mut" style="margin-top:6px">Frest (lido ${hora(c.frest_lido_em)}): ${brl(c.frest_total)}</p>`:'<p class="mut" style="margin-top:6px">Total do Frest ainda não lido. Confira na mesa '+c.mesa+'.</p>'}
    ${div?`<div class="aviso">O Frest e o app estão diferentes. Confira a mesa ${c.mesa} no Frest antes de cobrar.</div>`:''}
    ${k.falta_minimo>0?`<div class="aviso" style="background:rgba(224,169,63,.14);color:var(--ouro-2)">Lance no Frest o complemento de ${brl(k.falta_minimo)} na mesa ${c.mesa}.</div>`:''}
    ${pode&&!paga?`<div class="formas">${['Crédito','Débito','Pix','Dinheiro'].map(f=>`<button class="bt linha" data-f="${f}">${f}</button>`).join('')}</div>
      <div class="acoes"><button class="bt ok grande" id="liberar" disabled>Recebi: liberar</button></div>`:''}
    ${!pode?'<p class="mut" style="margin-top:10px">Leve ao caixa para cobrar.</p>':''}
    <div class="acoes"><button class="bt linha" onclick="fechar()">Voltar</button></div></div>`);
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ forma=b.dataset.f; document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===b)); $('#liberar').disabled=false; });
  const lb=$('#liberar'); if(lb) lb.onclick=async()=>{
    lb.disabled=true;
    try{ await rpc('ev_liberar',{p_sessao:S.sessao,p_conta_codigo:c.codigo,p_forma:forma}); }
    catch(e){ lb.disabled=false; return alert(msgErro(e)); }
    resultado(`<div class="card res bom" id="res"><div class="grande-txt">Liberada ✓</div><p class="mut">${esc(c.nome)} · pulseira ${c.pulseira} · ${forma}. Feche a mesa ${c.mesa} no Frest.</p>${voltar()}</div>`);
  };
}

/* ---------------------------------------------------------------- porta */
function telaPorta(){
  resultado(`<div class="card" id="res"><div class="grande-txt">Cadastrar pulseira</div>
    <input class="campo" id="pp" inputmode="numeric" placeholder="Número da pulseira"/>
    <input class="campo" id="pn" placeholder="Nome completo" autocomplete="off"/>
    <input class="campo" id="pt" inputmode="tel" placeholder="WhatsApp (opcional)"/>
    <div id="pm"></div>
    <div class="acoes"><button class="bt ouro grande" id="pok">Abrir a mesa</button><button class="bt linha" onclick="fechar()">Voltar</button></div></div>`);
  $('#pok').onclick=async()=>{
    const n=parseInt($('#pp').value,10), nome=$('#pn').value.trim();
    if(!n||!nome) return $('#pm').innerHTML='<div class="aviso">Preencha pulseira e nome.</div>';
    try{
      const r=await rpc('ev_porta_cadastrar',{p_sessao:S.sessao,p_pulseira:n,p_nome:nome,p_telefone:$('#pt').value||null});
      if(!r.ok) return $('#pm').innerHTML=`<div class="aviso">${esc({pulseira_ocupada:'Essa pulseira já tem dona.',pulseira_invalida:'Número de pulseira inválido.',evento_fechado:'Evento fechado.'}[r.motivo]||r.motivo)}</div>`;
      const q=qrcode(0,'M'); q.addData(CLIENTE+r.token); q.make();
      resultado(`<div class="card res bom" id="res"><div class="grande-txt">Mesa ${r.mesa} aberta</div>
        <p>${esc(r.nome)} · pulseira ${r.pulseira}</p><p class="mut">Peça para ela ler este QR com a câmera do celular:</p>
        <div class="qrbox">${q.createSvgTag({cellSize:6,margin:2,scalable:true})}</div>${voltar()}</div>`);
    }catch(e){ $('#pm').innerHTML=`<div class="aviso">${esc(msgErro(e))}</div>`; }
  };
}

/* ---------------------------------------------------------------- câmera */
let stream=null, detector=null, rodando=false;
async function abrirCamera(){
  $('#scan').classList.remove('oculto'); $('#scan-msg').textContent='Aponte para o QR do voucher ou da conta';
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    const v=$('#video'); v.srcObject=stream; await v.play();
    if('BarcodeDetector' in window){ try{ detector=new BarcodeDetector({formats:['qr_code']}); }catch{ detector=null; } }
    rodando=true; laco();
  }catch(e){ $('#scan-msg').textContent='Não consegui abrir a câmera. Use o botão ⌨︎ para digitar o código.'; }
}
function fecharCamera(){ rodando=false; if(stream) stream.getTracks().forEach(t=>t.stop()); stream=null; $('#scan').classList.add('oculto'); }
const tela=document.createElement('canvas'), ctx=tela.getContext('2d',{willReadFrequently:true});
async function laco(){
  if(!rodando) return;
  const v=$('#video'); let txt=null;
  try{
    if(v.readyState>=2){
      if(detector){ const r=await detector.detect(v); if(r.length) txt=r[0].rawValue; }
      else if(window.jsQR){ const w=v.videoWidth, h=v.videoHeight, s=Math.min(1, 640/Math.max(w,h));
        tela.width=w*s; tela.height=h*s; ctx.drawImage(v,0,0,tela.width,tela.height);
        const img=ctx.getImageData(0,0,tela.width,tela.height); const r=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'}); if(r) txt=r.data; }
    }
  }catch{}
  if(txt){ fecharCamera(); ultimoCodigo=codigoDe(txt); ler(txt); return; }
  setTimeout(laco, 120);
}
const codigoDe=t=>String(t).toUpperCase().replace(/^.*[\/=:#-]/,'').replace(/[^A-Z0-9]/g,'');
$('#ler').onclick=abrirCamera; $('#scan-fechar').onclick=fecharCamera;
$('#digitar').onclick=()=>{ const t=prompt('Código do voucher (8 letras) ou da conta (10 letras):'); if(t){ ultimoCodigo=codigoDe(t); ler(t);} };
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(h&&S){ history.replaceState(null,'',location.pathname+location.search); ultimoCodigo=codigoDe(h); ler(h);} });

if(location.hash) ultimoCodigo=codigoDe(location.hash.slice(1));
S ? iniciar() : telaLogin();
</script>
