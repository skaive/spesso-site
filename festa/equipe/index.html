<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Equipe · Jardim do Éder</title>
<meta name="theme-color" content="#0B2216"/>
<meta name="color-scheme" content="dark"/>
<meta name="robots" content="noindex"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@500;700;800&family=Kaushan+Script&display=swap" rel="stylesheet"/>
<style>
:root{--selva:#0B2216;--selva-2:#113021;--selva-3:#18402C;--linha:#2A5A40;--creme:#F4E8CB;--tinta:#3A2312;
  --ouro:#E0A93F;--ouro-2:#F3C766;--texto:#F4EBD6;--texto-2:#BFD0BF;--ok:#3FB96B;--erro:#FF7A57;--sab:env(safe-area-inset-bottom,0px);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--selva);}
body{font-family:'Alegreya Sans',system-ui,sans-serif;color:var(--texto);font-size:17px;line-height:1.35;min-height:100dvh;overscroll-behavior-y:none;}
button,input{font:inherit;color:inherit;}
button{border:0;background:none;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;}
.oculto{display:none!important;}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
  border-bottom:1px solid var(--linha);position:sticky;top:0;background:rgba(11,34,22,.96);z-index:10;}
header h1{font-family:'Kaushan Script',cursive;font-weight:400;font-size:22px;color:var(--creme);}
header .quem{font-size:14px;color:var(--texto-2);text-align:right;}
header .quem b{color:var(--ouro-2);display:block;font-size:15px;}
.wrap{padding:16px 16px calc(120px + var(--sab));max-width:560px;margin:0 auto;}
.bt{border-radius:14px;padding:14px 16px;font-weight:800;font-size:17px;}
.bt.ouro{background:var(--ouro);color:var(--tinta);} .bt.ok{background:var(--ok);color:#06200F;}
.bt.linha{border:1px solid var(--linha);color:var(--creme);} .bt.creme{background:var(--creme);color:var(--tinta);}
.bt.perigo{border:1px solid var(--erro);color:var(--erro);}
.bt:active{transform:scale(.97);} .bt:disabled{opacity:.5;}
.grande{width:100%;padding:20px;font-size:21px;}
h2{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--texto-2);margin:22px 0 10px;}
.card{background:var(--selva-2);border:1px solid var(--linha);border-radius:16px;padding:14px;margin-bottom:10px;}
.lin{display:flex;justify-content:space-between;gap:10px;align-items:center;}
.puls{background:var(--ouro);color:var(--tinta);font-weight:800;border-radius:12px;min-width:56px;padding:6px 8px;text-align:center;font-size:26px;line-height:1;}
.puls small{display:block;font-size:10px;letter-spacing:.1em;}
.mut{color:var(--texto-2);font-size:14px;}
.tag{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--selva-3);color:var(--texto-2);}
.tag.erro{background:rgba(255,122,87,.15);color:var(--erro);} .tag.ok{background:rgba(63,185,107,.18);color:#8EE6AE;}
.tag.vivo{background:rgba(224,169,63,.16);color:var(--ouro-2);}
.saida{border-radius:16px;padding:16px 12px;text-align:center;font-size:28px;font-weight:800;line-height:1.1;}
.saida small{display:block;font-size:15px;font-weight:700;margin-top:6px;}
.saida.ok{background:#1f8a4c;color:#fff;} .saida.nao{background:#c0392b;color:#fff;}
.erro-bt{background:#c0392b;color:#fff;}
.tag.bistro{background:var(--ouro);color:#1d1208;font-size:14px;}
.res{border-width:2px;}
.res.bom{border-color:var(--ok);} .res.ruim{border-color:var(--erro);}
.res .grande-txt{font-size:24px;font-weight:800;color:var(--creme);line-height:1.15;}
.acoes{display:grid;gap:8px;margin-top:12px;}
.formas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.formas .bt.on{background:var(--creme);color:var(--tinta);}
.aviso{border-radius:12px;padding:10px 12px;margin-top:10px;font-size:15px;background:rgba(255,122,87,.12);color:var(--erro);}
.aviso.ok{background:rgba(63,185,107,.14);color:#8EE6AE;}
.campo{width:100%;padding:14px;border-radius:12px;border:1px solid var(--linha);background:var(--selva);font-size:18px;margin-top:8px;}
.pin{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
.pin button{height:64px;border-radius:14px;background:var(--selva-2);border:1px solid var(--linha);font-size:26px;font-weight:800;}
.bolinhas{display:flex;gap:12px;justify-content:center;margin:16px 0 4px;}
.bolinhas i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ouro);} .bolinhas i.on{background:var(--ouro);}
.nomes{display:grid;gap:8px;}
.nomes button{text-align:left;padding:14px;border-radius:14px;background:var(--selva-2);border:1px solid var(--linha);display:flex;justify-content:space-between;}
.nomes button span{color:var(--texto-2);font-size:14px;}
.scan{position:fixed;inset:0;z-index:30;background:#000;display:flex;flex-direction:column;}
.scan video{flex:1;width:100%;object-fit:cover;}
.scan .mira{position:absolute;left:50%;top:42%;width:66vw;max-width:300px;aspect-ratio:1;transform:translate(-50%,-50%);
  border:3px solid var(--ouro);border-radius:22px;box-shadow:0 0 0 999px rgba(0,0,0,.35);}
.scan .baixo{position:absolute;left:0;right:0;bottom:0;padding:14px 16px calc(16px + var(--sab));display:grid;gap:8px;background:linear-gradient(transparent,rgba(0,0,0,.8));}
.barra{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(10px + var(--sab));background:rgba(9,27,17,.97);border-top:1px solid var(--linha);}
.barra .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:8px;}
.resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.resumo div{background:var(--selva-2);border:1px solid var(--linha);border-radius:14px;padding:10px;text-align:center;}
.resumo b{display:block;font-size:20px;color:var(--creme);}
.resumo span{font-size:12.5px;color:var(--texto-2);}
.qrbox{background:#fff;border-radius:16px;padding:12px;width:min(70vw,260px);margin:12px auto;}
.achados{display:grid;gap:8px;margin-top:10px;}
.achados button{text-align:left;padding:12px 14px;border-radius:14px;background:var(--selva-2);border:1px solid var(--linha);display:flex;justify-content:space-between;align-items:center;gap:10px;}
.achados button .mut{font-size:13px;}
.num-grande{font-size:44px;text-align:center;font-weight:800;letter-spacing:.06em;padding:12px;}
.lado{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px;}
.lado .bt.on{background:var(--creme);color:var(--tinta);}
.cardap{display:grid;gap:6px;}
.cardap .cat{margin:14px 0 2px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--texto-2);}
.cardap button{text-align:left;padding:12px 14px;border-radius:12px;background:var(--selva-2);border:1px solid var(--linha);display:flex;justify-content:space-between;gap:10px;}
.cardap button.on{border-color:var(--ouro);}
.escolha{position:sticky;bottom:calc(96px + var(--sab));background:var(--selva-3);border:1px solid var(--ouro);border-radius:16px;padding:12px;margin-top:12px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.chips button{border:1px solid var(--linha);border-radius:999px;padding:8px 12px;font-weight:700;}
.chips button.on{background:var(--creme);color:var(--tinta);}
.qtd{display:flex;align-items:center;gap:14px;margin-top:10px;font-size:22px;font-weight:800;}
.qtd button{width:46px;height:46px;border-radius:50%;border:1px solid var(--linha);font-size:24px;}
.qrbox svg{width:100%;height:auto;display:block;}
</style>
</head>
<body>
<header><h1>Jardim do Éder · equipe</h1><div class="quem" id="quem"></div></header>
<div class="wrap" id="app"></div>
<div class="barra oculto" id="barra"><div class="in">
  <button class="bt ouro grande" id="ler">Ler QR</button>
  <button class="bt linha" id="digitar" aria-label="Digitar código">⌨︎</button>
</div></div>
<div class="scan oculto" id="scan">
  <video id="video" playsinline muted></video><div class="mira"></div>
  <div class="baixo"><div class="mut" id="scan-msg" style="text-align:center;color:#fff">Aponte para o QR do voucher ou da conta</div>
  <form id="scan-form" class="lin" style="gap:8px" autocomplete="off">
    <input class="campo" id="scan-cod" placeholder="ou digite o código" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="go"
      style="margin:0;background:rgba(0,0,0,.6);color:#fff;text-transform:uppercase;letter-spacing:.08em"/>
    <button class="bt ouro" type="submit">Ok</button></form>
  <button class="bt linha" style="background:rgba(0,0,0,.5)" id="scan-fechar">Fechar câmera</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
const SB='https://ujxdbktmbowtokrxxylb.supabase.co', K='sb_publishable_esAA71xiJkVOowMYoH0iEg_PPcb6xiP';
const VER='festa-equipe-v20 27/11/2026';
const SLUG = new URLSearchParams(location.search).get('e') || 'jardim-eder';
const CLIENTE = 'https://spesso.com.br/festa/?t=';
const $=s=>document.querySelector(s);
const brl=v=>'R$ '+Number(v||0).toFixed(2).replace('.',',');
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const hora=t=>t?new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';
const minutos=t=>t?Math.max(0,Math.round((Date.now()-new Date(t))/60000)):0;
async function rpc(n,a){
  const r=await fetch(`${SB}/rest/v1/rpc/${n}`,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(a)});
  const t=await r.text(); let j=null; try{j=t?JSON.parse(t):null}catch{}
  if(!r.ok){const e=new Error((j&&j.message)||'erro'); e.codigo=j&&j.message; throw e;} return j;
}
const MSG={escolha_invalida:'Escolha de novo a fruta e o açúcar ou adoçante.',sessao_invalida:'Sua sessão acabou. Entre de novo.',pin_errado:'PIN errado.',sem_alcada:'Só a gerência pode fazer isso.',
  voucher_invalido:'Voucher não encontrado.',voucher_cancelado:'Esse voucher foi CANCELADO.',conta_nao_encontrada_ou_ja_paga:'Essa conta não existe ou já foi paga.',
  convidada_nao_encontrada:'Convidada não encontrada.',sem_pulseira:'Ela ainda não tem pulseira.',
  pulseira_sem_dona:'Ninguém está com essa pulseira. Mande na entrada.',conta_ja_paga:'A conta dela já foi paga. Fale com o caixa.',
  evento_fechado:'Evento fechado.',item_invalido:'Item fora do cardápio.',sem_preco:'Item sem preço no Frest.',
  codigo_errado:'Código errado. Confira com a gerência.',nome_em_uso:'Esse nome já é de outra pessoa da equipe. Ponha o sobrenome.',
  muitas_tentativas:'Muitas tentativas erradas. Espere 10 minutos ou fale com a gerência.',sem_codigo:'Este evento não aceita código. Fale com a gerência.',
  sem_nome:'Escreva seu nome.',prazo_cancelar:'Passou de 2 minutos (ou já foi entregue). Agora só a gerência cancela.',papel_invalido:'Escolha onde você está hoje.'};
const msgErro=e=>MSG[e.codigo]||'Falhou. Confira a internet e tente de novo.';

let S=null; try{S=JSON.parse(localStorage.getItem('festa_eq_'+SLUG)||'null')}catch{}
let P=null, ultimoCodigo=null, timer=null;

/* ---------------------------------------------------------------- login */
async function telaLogin(){
  $('#barra').classList.add('oculto'); $('#quem').innerHTML='';
  $('#app').innerHTML='<p class="mut">Carregando…</p>';
  let nomes=[], temCod=false;
  try{ [nomes,temCod]=await Promise.all([rpc('ev_equipe_nomes',{p_slug:SLUG}), rpc('ev_equipe_tem_codigo',{p_slug:SLUG})]); }catch{}
  const PAP={bar:'bar',garcom:'garçom',caixa:'caixa',porta:'porta',gestao:'gerência'};
  $('#app').innerHTML=`${temCod?`<button class="bt ouro grande" id="primeira" style="margin-top:6px">Primeira vez aqui</button>
      <p class="mut" style="margin-top:8px;text-align:center">Garçom, bar e porta: entre com o código da festa.</p>`:''}
    ${nomes.length?[['garcom','Garçom'],['bar','Bar'],['porta','Porta'],['caixa','Caixa'],['gestao','Gerência']].filter(([k])=>nomes.some(n=>n.papel===k)).map(([k,t])=>
      `<h2>${t}</h2><div class="nomes">${nomes.filter(n=>n.papel===k).map(n=>`<button data-n="${esc(n.nome)}">${esc(n.nome)}<span></span></button>`).join('')}</div>`).join('')
      :'<p class="mut">Ninguém cadastrado neste evento.</p>'}`;
  document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>telaPin(b.dataset.n, nomes.find(n=>n.nome===b.dataset.n)));
  const pv=$('#primeira'); if(pv) pv.onclick=telaPrimeira;
}
/* garçom, bar e porta se cadastram sozinhos com o código da festa (sql/671) */
function telaPrimeira(){
  let nome='', papel=null, pin='', passo='quem', erro='';
  const PAPEIS=[['garcom','Garçom',null],['bar','Bar do 1º piso','baixo'],['bar','Bar do 2º piso','cima'],['porta','Porta (entrada)',null]];
  let esc_i=null;
  const pintar=()=>{
    if(passo==='quem'){
      $('#app').innerHTML=`<h2>Primeira vez aqui</h2>
        <p class="mut">Seu nome, como a equipe te chama:</p>
        <input class="campo" id="pv-nome" placeholder="Ex.: Rafael" autocomplete="off" autocapitalize="words" value="${esc(nome)}"/>
        <p class="mut" style="margin-top:16px">Hoje você está no:</p>
        <div class="nomes" style="margin-top:8px">${PAPEIS.map(([p,r],i)=>`<button data-pp="${i}" style="${esc_i===i?'background:var(--creme);color:var(--tinta)':''}">${r}<span></span></button>`).join('')}</div>
        ${erro?`<div class="aviso">${esc(erro)}</div>`:''}
        <div class="acoes"><button class="bt ouro grande" id="pv-seg">Continuar</button><button class="bt linha" id="pv-volta">Voltar</button></div>`;
      const ni=$('#pv-nome'); ni.oninput=()=>{ nome=ni.value; };
      document.querySelectorAll('[data-pp]').forEach(b=>b.onclick=()=>{ nome=ni.value; esc_i=+b.dataset.pp; erro=''; pintar(); });
      $('#pv-seg').onclick=()=>{ nome=ni.value.trim();
        if(nome.length<2){ erro='Escreva seu nome.'; return pintar(); }
        if(esc_i==null){ erro='Toque onde você está hoje.'; return pintar(); }
        papel=PAPEIS[esc_i][0]; erro=''; passo='codigo'; pintar(); };
      $('#pv-volta').onclick=telaLogin;
      return;
    }
    $('#app').innerHTML=`<h2>${esc(nome)} · ${esc(PAPEIS[esc_i][1])}</h2><p class="mut">Digite o código da festa (falado na reunião)</p>
      <div class="bolinhas">${[0,1,2,3].map(i=>`<i class="${i<pin.length?'on':''}"></i>`).join('')}</div>
      ${erro?`<div class="aviso">${esc(erro)}</div>`:''}
      <div class="pin">${[1,2,3,4,5,6,7,8,9,'←',0,'ok'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div>
      <p style="margin-top:14px"><button class="bt linha" id="pv-volta">Voltar</button></p>`;
    $('#pv-volta').onclick=()=>{ passo='quem'; pin=''; erro=''; pintar(); };
    document.querySelectorAll('[data-k]').forEach(b=>b.onclick=async()=>{
      const k=b.dataset.k;
      if(k==='←'){ pin=pin.slice(0,-1); return pintar(); }
      if(k!=='ok'){ if(pin.length<4) pin+=k; pintar(); }
      if(pin.length<4) return;
      try{
        S=await rpc('ev_equipe_cadastrar',{p_slug:SLUG,p_nome:nome,p_papel:papel,p_codigo:pin});
        const lado=PAPEIS[esc_i][2]; if(lado){ barEq=lado; try{localStorage.setItem('festa_eq_bar',lado);}catch{} }
        localStorage.setItem('festa_eq_'+SLUG,JSON.stringify(S)); iniciar();
      }catch(e){ pin=''; erro=MSG[e.codigo]||msgErro(e); pintar(); }
    });
  };
  pintar();
}
function telaPin(nome, info){
  let pin='';
  const pintar=(erro)=>{
    $('#app').innerHTML=`<h2>${esc(nome)}</h2><p class="mut">Digite o PIN</p>
      <div class="bolinhas">${[0,1,2,3].map(i=>`<i class="${i<pin.length?'on':''}"></i>`).join('')}</div>
      ${erro?`<div class="aviso">${esc(erro)}</div>`:''}
      <div class="pin">${[1,2,3,4,5,6,7,8,9,'←',0,'ok'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div>
      <p style="margin-top:14px"><button class="bt linha" id="volta">Não sou eu</button></p>`;
    document.querySelectorAll('[data-k]').forEach(b=>b.onclick=async()=>{
      const k=b.dataset.k;
      if(k==='←'){pin=pin.slice(0,-1);return pintar();}
      if(k!=='ok'){ if(pin.length<4) pin+=k; pintar(); }
      if(pin.length<4) return;   // com 4 dígitos entra sozinho
      try{ S=await rpc('ev_equipe_entrar',{p_slug:SLUG,p_nome:nome,p_pin:pin}); localStorage.setItem('festa_eq_'+SLUG,JSON.stringify(S)); iniciar(); }
      catch(e){ pin=''; pintar(msgErro(e)); }
    });
    $('#volta').onclick=telaLogin;
  };
  pintar();
}

/* ---------------------------------------------------------------- painel */
function iniciar(){
  const pap={bar:'bar',garcom:'garçom',caixa:'caixa',porta:'porta',gestao:'gerência'}[S.papel];
  $('#quem').innerHTML=`<b>${esc(S.nome)}</b>${S.nome.toLowerCase()===pap?'':esc(pap)+' · '}<a href="#" id="sair" style="color:inherit">sair</a>`;
  $('#sair').onclick=e=>{e.preventDefault(); localStorage.removeItem('festa_eq_'+SLUG); S=null; telaLogin();};
  $('#barra').classList.remove('oculto');
  atualizar(); clearInterval(timer); timer=setInterval(()=>{ if(!document.hidden && !$('#res')) atualizar(); },8000);
  const h=location.hash.slice(1); if(h){ history.replaceState(null,'',location.pathname+location.search); ler(h); }
}
async function atualizar(){
  try{ P=await rpc('ev_painel',{p_sessao:S.sessao}); desenhar(); }
  catch(e){ if(e.codigo==='sessao_invalida'){ localStorage.removeItem('festa_eq_'+SLUG); S=null; return telaLogin(); } }
}
// sql/686: o garçom cancela o que ELE lançou, ainda não entregue, até 2 min depois
const PRAZO=120000;
const restaCancelar=p=>S.papel==='garcom'&&p.pedido_por===S.nome&&!p.entregue_em&&p.status!=='cancelado'?Math.max(0,PRAZO-(Date.now()-new Date(p.criado_em))):0;
const seg=ms=>{const t=Math.ceil(ms/1000);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');};
async function cancelarMeu(v, b){
  if(!confirm('Cancelar este pedido? Avise o bar se ele já estiver preparando.')) return false;
  if(b) b.disabled=true;
  try{ const x=await rpc('ev_voucher_acao',{p_sessao:S.sessao,p_voucher:v,p_acao:'cancelar'});
    if(x&&x.ok===false){ alert(x.motivo==='lancando'?'Está entrando no Frest agora. Espere uns segundos e cancele de novo.':x.motivo); if(b) b.disabled=false; return false; }
    if(navigator.vibrate) navigator.vibrate(30); return true; }
  catch(e){ alert(msgErro(e)); if(b) b.disabled=false; return false; }
}
// o relógio dos botões de cancelar anda sozinho e o botão some quando o prazo acaba
setInterval(()=>document.querySelectorAll('[data-ate]').forEach(b=>{
  const ms=+b.dataset.ate-Date.now();
  if(ms<=0){ const a=b.parentElement; b.remove(); if(a&&a.classList.contains('acoes')&&!a.children.length) a.remove(); return; }
  b.textContent=b.textContent.replace(/\d+:\d\d\)/, seg(ms)+')');
}),1000);
function pedidoCard(p){
  const st = p.status==='erro' ? '<span class="tag erro">NÃO entrou no Frest</span>'
    : (p.status==='pedido'||p.status==='lancando') ? '<span class="tag vivo">indo pro Frest</span>'
    : p.chegou_em ? `<span class="tag ok">cliente avisada ${hora(p.chegou_em)}</span>`
    : p.pronto ? '<span class="tag ok">pronto na cozinha</span>' : '<span class="tag">no Frest</span>';
  // sql/690: comida que a convidada pediu para retirar no bar — quem está com ela na mão avisa (página + WhatsApp)
  const podeAvisar=p.tipo==='comida'&&p.retirar&&!p.bistro&&!p.pedido_por&&!p.chegou_em&&p.status==='lancado'&&['garcom','gestao','caixa'].includes(S.papel);
  return `<div class="card"><div class="lin"><div><b>${p.qtd}× ${esc(p.nome)}</b>
    <div class="mut">${esc(p.cliente)} · mesa ${p.mesa}${p.local?' · '+esc(p.local):''} · há ${minutos(p.criado_em)} min</div>
    <div style="margin-top:4px">${p.bistro?`<span class="tag bistro">BISTRÔ ${p.bistro}</span> `:p.retirar?`<span class="tag${p.tipo==='comida'?' bistro':''}">${p.tipo==='comida'?'LEVAR AO BAR DO '+(p.retirar==='cima'?'2º':'1º')+' PISO':'pega no bar '+(p.retirar==='cima'?'2º':'1º')+' piso'}</span> `:''}${st}${p.garcom?` <span class="tag">${esc(p.garcom)}</span>`:''}</div>
    ${p.status==='erro'&&p.erro?`<div class="mut" style="margin-top:4px">${esc(p.erro)}</div>`:''}</div>
    <div class="puls"><small>PULS.</small>${p.pulseira}</div></div>
    ${S.papel==='garcom'&&p.bistro&&!p.garcom?`<div class="acoes"><button class="bt ouro" data-assumir="${p.voucher}">É meu: levo à bistrô ${p.bistro}</button></div>`:''}
    ${S.papel==='garcom'&&p.tipo==='comida'&&p.retirar&&!p.bistro&&!p.garcom?`<div class="acoes"><button class="bt ouro" data-assumir="${p.voucher}">É meu: levo ao bar do ${p.retirar==='cima'?'2º':'1º'} piso</button></div>`:''}
    ${podeAvisar?`<div class="acoes"><button class="bt ok" data-chegou="${p.voucher}">Chegou no bar do ${p.retirar==='cima'?'2º':'1º'} piso: avisar a cliente</button></div>`:''}
    ${S.papel==='garcom'&&p.garcom===S.nome?`<div class="acoes"><button class="bt ok" data-entreguei="${p.voucher}">Entreguei${p.bistro?' na bistrô '+p.bistro:''}</button></div>`:''}
    ${restaCancelar(p)>0?`<div class="acoes"><button class="bt perigo" data-cancmeu="${p.voucher}" data-ate="${new Date(p.criado_em).getTime()+PRAZO}">Cancelar (${seg(restaCancelar(p))})</button></div>`:''}
    ${p.status==='erro'&&(S.papel==='gestao'||S.papel==='caixa')?`<div class="acoes"><button class="bt linha" data-relancar="${p.voucher}">Conferi no Frest: não está lá. Lançar de novo</button></div>`:''}
  </div>`;
}
let busca='';
function desenhar(){
  if($('#res')) return;
  const foco=document.activeElement; if(foco && (foco.id==='busca'||foco.id==='cx-num'||foco.id==='lp-num')) return;
  const pend=P.pendentes||[];
  let h='';
  if(P.resumo){ const r=P.resumo;
    h+=`<div class="resumo"><div><b>${brl(r.vendido).replace('R$ ','')}</b><span>vendido (R$)</span></div>
      <div><b>${r.convidadas}</b><span>pulseiras · ${r.pagas} pagas</span></div>
      <div><b style="color:${r.erros?'var(--erro)':'inherit'}">${r.erros}</b><span>sem Frest · ${r.na_fila} na fila</span></div></div>`; }
  if(P.contas&&P.contas.length){
    h+=`<h2>Pediram a conta (${P.contas.length})</h2>`+P.contas.map(c=>`<button class="card" style="width:100%;text-align:left" data-conta="${c.codigo}">
      <div class="lin"><div><b>${esc(c.nome)}</b><div class="mut">mesa ${c.mesa} · pediu ${hora(c.pedida_em)}</div></div>
      <div style="text-align:right"><b>${brl(c.total)}</b>${c.frest_total!=null?`<div class="mut">Frest ${brl(c.frest_total)}</div>`:''}</div>
      <div class="puls"><small>PULS.</small>${c.pulseira}</div></div></button>`).join('');
  }
  if(S.papel!=='porta'){
    h+=`<h2>Lançar pedido</h2><div class="card"><div class="lin"><input class="campo" id="lp-num" inputmode="numeric" placeholder="Nº da pulseira" style="margin:0"/>
      <button class="bt ouro" id="lp-ok">Abrir</button></div><p class="mut" style="margin-top:8px">Vai direto para o Frest, na mesa dela.</p></div>`;
  }
  if(P.cancelamentos&&P.cancelamentos.length){
    h+=`<h2>Cancelamentos no Frest (${P.cancelamentos.length})</h2>`+P.cancelamentos.map(k=>`<div class="card"><div class="lin"><div>
      <b>${k.qtd}× ${esc(k.nome)}</b><div class="mut">${esc(k.cliente)} · mesa ${k.mesa} · cancelado por ${esc(k.por||'')}</div>
      <div style="margin-top:4px">${k.estado==='erro'?'<span class="tag erro">NÃO confirmado no Frest</span>':'<span class="tag vivo">saindo do Frest</span>'}</div>
      ${k.erro?`<div class="mut" style="margin-top:4px">${esc(k.erro)}</div>`:''}</div>
      <div class="puls"><small>PULS.</small>${k.pulseira}</div></div>
      ${k.estado==='erro'?`<div class="acoes"><button class="bt linha" data-conf="${k.voucher}" data-saiu="1">Conferi: já saiu do Frest</button>
        <button class="bt linha" data-conf="${k.voucher}" data-saiu="0">Conferi: continua lá. Cancelar de novo</button></div>`:''}</div>`).join('');
  }
  if(S.papel==='caixa'||S.papel==='gestao'){
    h+=`<h2>Cobrar pela pulseira</h2><div class="card"><p class="mut">Para quem não pediu pelo celular: o total vem da mesa no Frest.</p>
      <div class="lin" style="margin-top:8px"><input class="campo" id="cx-num" inputmode="numeric" placeholder="Nº da pulseira" style="margin:0"/>
      <button class="bt ouro" id="cx-ok">Abrir conta</button></div></div>`;
  }
  if(S.papel==='porta'||S.papel==='gestao'){
    const pt=P.porta||{};
    h+=`<h2>Entrada${pt.total!=null?` · ${pt.com_pulseira} de ${pt.total} com pulseira`:''}</h2>
      <div class="card"><input class="campo" id="busca" placeholder="Nome ou celular da convidada" autocomplete="off" value="${esc(busca)}" style="margin:0"/>
      <div class="achados" id="achados"></div>
      <button class="bt linha" style="width:100%;margin-top:10px" id="porta">Não está na lista: cadastrar</button></div>`;
  }
  const meus = S.papel==='garcom' ? pend.filter(p=>p.garcom===S.nome) : [];
  // bar: só as bebidas que saem no piso dele (bistrô sai no 2º piso, como o papel da impressora)
  const destino=p=>p.tipo!=='bebida'?(p.bistro?'baixo':(p.retirar||'baixo')):p.bistro?'cima':(p.retirar||'baixo');
  let resto = S.papel==='garcom' ? pend.filter(p=>p.garcom!==S.nome) : pend;
  if(S.papel==='bar'){
    h=`<div class="lado" style="margin-top:0"><button class="bt linha ${barEq==='baixo'?'on':''}" data-meubar="baixo">Bar 1º piso</button><button class="bt linha ${barEq==='cima'?'on':''}" data-meubar="cima">Bar 2º piso</button></div>`
      +(barEq?'':'<div class="aviso">Toque no bar em que você está.</div>')+h;
    if(barEq) resto=resto.filter(p=>destino(p)===barEq);
  }
  if(S.papel==='garcom') h+=`<h2>Minhas entregas (${meus.length})</h2>`+(meus.map(pedidoCard).join('')||'<p class="mut">Assuma uma entrega abaixo ou leia o voucher da cliente. Quando ela tocar em "Recebi", o pedido sai daqui.</p>');
  const tit={bar:'Bebidas a entregar'+(barEq?' no '+(barEq==='cima'?'2º':'1º')+' piso':''),garcom:'Para levar (sem garçom)',caixa:'Tudo que falta entregar',gestao:'Tudo que falta entregar',porta:'Tudo que falta entregar'}[S.papel];
  h+=`<h2>${tit} (${resto.length})</h2>`+(resto.map(pedidoCard).join('')||'<p class="mut">Nada pendente.</p>');
  // sql/675: o que este perfil já entregou (some de "Minhas entregas" ao tocar em Entregar)
  const ent=P.entregues||[];
  if(ent.length) h+=`<h2>Já entregues (${ent.length})</h2><div class="card" style="padding:6px 14px">`+ent.map((e,i)=>`<div class="lin" style="padding:8px 0;border-top:${i?'1px solid var(--linha)':'0'}">
      <div><b>${e.qtd}× ${esc(e.nome)}</b><div class="mut">${esc(e.cliente)}${e.bistro?' · bistrô '+e.bistro:''}${e.entregue_por&&e.entregue_por!==S.nome?' · entregue por '+esc(e.entregue_por):''}</div></div>
      <div style="text-align:right;white-space:nowrap"><span class="tag ok">✓ ${hora(e.entregue_em)}</span><div class="mut">puls. ${e.pulseira}</div></div></div>`).join('')+'</div>';
  h+=`<p class="mut" style="text-align:center;margin-top:24px;font-size:11px">skv-versao ${VER}</p>`;
  $('#app').innerHTML=h;
  document.querySelectorAll('[data-conta]').forEach(b=>b.onclick=()=>ler('C-'+b.dataset.conta));
  document.querySelectorAll('[data-meubar]').forEach(b=>b.onclick=()=>{ barEq=b.dataset.meubar; try{localStorage.setItem('festa_eq_bar',barEq);}catch{} desenhar(); });
  document.querySelectorAll('[data-relancar]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Você conferiu no Frest que esse item NÃO está na mesa? Se estiver, vai cobrar duas vezes.')) return;
    try{ await rpc('ev_relancar',{p_sessao:S.sessao,p_voucher:b.dataset.relancar}); atualizar(); }catch(e){ alert(msgErro(e)); }
  });
  document.querySelectorAll('[data-cancmeu]').forEach(b=>b.onclick=async()=>{ if(await cancelarMeu(b.dataset.cancmeu,b)) atualizar(); });
  document.querySelectorAll('[data-chegou]').forEach(b=>b.onclick=async()=>{
    b.disabled=true;
    try{ const x=await rpc('ev_voucher_acao',{p_sessao:S.sessao,p_voucher:b.dataset.chegou,p_acao:'chegou'});
      if(x&&x.ok===false) alert({ja_entregue:'Já entregue.',ja_avisada:`Já avisada por ${x.por}.`}[x.motivo]||x.motivo);
      else { b.textContent='Avisada ✓'; if(navigator.vibrate) navigator.vibrate(30); }
      atualizar(); }
    catch(e){ b.disabled=false; alert(msgErro(e)); }
  });
  document.querySelectorAll('[data-assumir],[data-entreguei]').forEach(b=>b.onclick=async()=>{
    const v=b.dataset.assumir||b.dataset.entreguei, a=b.dataset.assumir?'assumir':'entregar';
    b.disabled=true;
    try{ const x=await rpc('ev_voucher_acao',{p_sessao:S.sessao,p_voucher:v,p_acao:a});
      if(x&&x.ok===false) alert({ja_entregue:'Já entregue.',ja_tem_garcom:`Já é do(a) ${x.garcom}.`}[x.motivo]||x.motivo);
      if(navigator.vibrate) navigator.vibrate(30); atualizar(); }
    catch(e){ b.disabled=false; alert(msgErro(e)); }
  });
  const pb=$('#porta'); if(pb) pb.onclick=()=>telaPorta();
  const lp=$('#lp-ok'); if(lp) lp.onclick=()=>{ const n=parseInt($('#lp-num').value,10); if(n){ bisEq=null; telaLancar(n); } };
  const ln=$('#lp-num'); if(ln) ln.onkeydown=e=>{ if(e.key==='Enter') lp.click(); };
  document.querySelectorAll('[data-conf]').forEach(b=>b.onclick=async()=>{
    const saiu=b.dataset.saiu==='1';
    if(!saiu && !confirm('Você olhou a mesa no Frest e o item CONTINUA lá? O robô vai tentar cancelar de novo.')) return;
    try{ await rpc('ev_cancelar_conferido',{p_sessao:S.sessao,p_voucher:b.dataset.conf,p_saiu:saiu}); atualizar(); }catch(e){ alert(msgErro(e)); }
  });
  const cx=$('#cx-ok'); if(cx) cx.onclick=()=>{ const n=parseInt($('#cx-num').value,10); if(n) ler(String(n)); };
  const cn=$('#cx-num'); if(cn) cn.onkeydown=e=>{ if(e.key==='Enter') cx.click(); };
  const bq=$('#busca'); if(bq){ bq.oninput=()=>{ busca=bq.value; clearTimeout(bq._t); bq._t=setTimeout(buscar,250); }; if(busca) buscar(); }
}

/* ---------------------------------------------------------------- leitura */
async function ler(texto){
  const cod=String(texto||'').trim(); if(!cod) return;
  if(navigator.vibrate) navigator.vibrate(40);
  $('#app').innerHTML='<p class="mut">Conferindo…</p>';
  try{
    const r=await rpc('ev_ler',{p_sessao:S.sessao,p_codigo:cod});
    if(r.tipo==='voucher') return telaVoucher(r);
    if(r.tipo==='conta') return telaConta(r);
    if(r.pulseira_livre) return resultado(`<div class="card res ruim" id="res"><div class="grande-txt">Pulseira ${r.pulseira_livre} sem dona</div><p class="mut">Ninguém está com essa pulseira. Confira o número no braço dela.</p>${voltar()}</div>`);
    resultado(`<div class="card res ruim" id="res"><div class="grande-txt">QR não reconhecido</div><p class="mut">Não é voucher nem conta desta festa.</p>${voltar()}</div>`);
  }catch(e){ if(e.codigo==='sessao_invalida'){S=null;return telaLogin();} resultado(`<div class="card res ruim" id="res"><div class="grande-txt">${esc(msgErro(e))}</div>${voltar()}</div>`); }
}
const voltar=()=>`<div class="acoes"><button class="bt linha" onclick="fechar()">Voltar</button></div>`;
function resultado(h){ $('#app').innerHTML=h; window.scrollTo(0,0); }
function fechar(){ const r=$('#res'); if(r) r.remove(); atualizar(); }

function telaVoucher(r){
  const p=r.pedido, c=r.cliente;
  const usado=!!p.entregue_em, cancel=p.status==='cancelado';
  const ruim=usado||cancel;
  let acoes='';
  if(!ruim){
    if((p.tipo==='comida'||p.bistro) && S.papel==='garcom'){
      acoes = p.garcom===S.nome
        ? `<button class="bt ok grande" data-a="entregar">Entreguei na mão dela</button><button class="bt linha" data-a="soltar">Não vou conseguir levar (soltar)</button>`
        : p.garcom ? `<div class="aviso">Já é do(a) ${esc(p.garcom)}.</div>`
        : `<button class="bt ouro grande" data-a="assumir">É meu: vou levar</button>`;
    } else {
      acoes=`<button class="bt ok grande" data-a="entregar">Entregar agora</button>`;
    }
  }
  if(!ruim&&restaCancelar(p)>0) acoes+=`<button class="bt perigo" data-a="cancelar" data-ate="${new Date(p.criado_em).getTime()+PRAZO}">Cancelar (até ${seg(restaCancelar(p))})</button>`;
  if(S.papel==='gestao'||S.papel==='caixa'){
    if(usado) acoes+=`<button class="bt linha" data-a="desfazer_entrega">Desfazer a entrega</button>`;
    if(!cancel) acoes+=`<button class="bt perigo" data-a="cancelar">Cancelar este pedido</button>`;
  }
  resultado(`<div class="card res ${ruim?'ruim':'bom'}" id="res">
    ${usado?`<div class="aviso">JÁ ENTREGUE às ${hora(p.entregue_em)} por ${esc(p.entregue_por)}. Não entregue de novo.</div>`:''}
    ${cancel?`<div class="aviso">PEDIDO CANCELADO${p.cancelado_por?' por '+esc(p.cancelado_por):''}. Não entregue.</div>`:''}
    <div class="lin" style="margin-top:6px"><div class="grande-txt">${p.qtd}× ${esc(p.nome)}</div><div class="puls"><small>PULS.</small>${c.pulseira}</div></div>
    <p style="margin-top:8px"><b>${esc(c.nome)}</b> · mesa ${c.mesa}${p.local?' · '+esc(p.local):''}</p>
    ${p.bistro?`<p style="margin-top:6px"><span class="tag bistro">ENTREGAR NA BISTRÔ ${p.bistro}</span></p>`:(p.tipo==='comida'&&p.retirar)?`<p style="margin-top:6px"><span class="tag bistro">${p.retirar==='cima'?'RETIRADA AO LADO DO BAR DO 2º PISO':'ENTREGAR NO BAR DO 1º PISO'}</span></p>`:p.retirar?`<p class="mut">Ela pega no bar do ${p.retirar==='cima'?'2º':'1º'} piso.</p>`:''}
    <p class="mut">Pedido às ${hora(p.criado_em)} · ${p.status==='lancado'?'no Frest':p.status==='erro'?'NÃO entrou no Frest':'indo pro Frest'}</p>
    <p class="mut">Confira o número da pulseira no braço dela.</p>
    <div class="acoes">${acoes}<button class="bt linha" onclick="fechar()">Voltar</button></div></div>`);
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{
    const a=b.dataset.a;
    if(a==='cancelar' && !confirm('Cancelar este pedido? Se já está no Frest, o robô cancela lá também.')) return;
    b.disabled=true;
    try{
      const x=await rpc('ev_voucher_acao',{p_sessao:S.sessao,p_voucher:p.voucher,p_acao:a});
      if(x&&x.ok===false){ const m={ja_entregue:`Já entregue às ${hora(x.em)} por ${x.por}.`,ja_tem_garcom:`Já é do(a) ${x.garcom}.`,
        lancando:'Está entrando no Frest agora. Espere uns segundos e cancele de novo.'}[x.motivo]||x.motivo;
        return resultado(`<div class="card res ruim" id="res"><div class="grande-txt">${esc(m)}</div>${voltar()}</div>`); }
      const ok={entregar:'Entregue ✓',assumir:'É seu. Leve quando a cozinha soltar.',soltar:'Solto. Outro garçom pode assumir.',desfazer_entrega:'Entrega desfeita.',
        cancelar: x&&x.frest==='cancelando' ? 'Cancelado. O robô tira do Frest em segundos.' : p.status==='erro' ? 'Cancelado no app. Confira a mesa no Frest.' : 'Cancelado.'}[a];
      resultado(`<div class="card res bom" id="res"><div class="grande-txt">${ok}</div><p class="mut">${p.qtd}× ${esc(p.nome)} · pulseira ${c.pulseira}</p>${voltar()}</div>`);
      setTimeout(()=>{ if($('#res')) fechar(); }, 2500);
    }catch(e){ b.disabled=false; alert(msgErro(e)); }
  });
}

function telaConta(r){
  const c=r.cliente, k=r.conta;
  const pode=S.papel==='caixa'||S.papel==='gestao';
  const paga=!!c.liberada_em;
  const div = c.frest_total!=null && Math.abs(Number(c.frest_total)-(k.consumo+k.servico))>0.05;
  // o Frest é o livro: se ele tem mais do que o app (garçom lançou direto), cobra pelo Frest
  let cobrar=k.total, compl=k.falta_minimo;
  if(c.frest_total!=null && Number(c.frest_total)>k.consumo+k.servico+0.05){
    const consumoFrest=Number(c.frest_total)/(1+k.servico_pct/100);
    compl=Math.max(0, Math.round((k.minimo-consumoFrest)*100)/100);
    cobrar=Number(c.frest_total)+compl;
  }
  let forma=null;
  resultado(`<div class="card res ${paga?'ruim':'bom'}" id="res">
    <div class="saida ${paga?'ok':'nao'}">${paga?`CONTA PAGA ✓<small>saída liberada · paga às ${hora(c.liberada_em)}</small>`:`CONTA EM ABERTO<small>não pode sair: mandar ao caixa</small>`}</div>
    <p class="mut" style="text-align:center;margin:6px 0 10px">Confira a pulseira no braço: tem que ser a <b style="color:var(--creme);font-size:20px">${c.pulseira}</b></p>
    <div class="lin"><div><div class="grande-txt">${esc(c.nome)}</div><div class="mut">mesa ${c.mesa}</div></div><div class="puls"><small>PULS.</small>${c.pulseira}</div></div>
    <div style="margin-top:12px">${k.itens.map(i=>`<div class="lin mut"><span>${i.qtd}× ${esc(i.nome)}${i.status==='erro'?' ⚠︎':''}</span><span>${brl(i.qtd*i.preco)}</span></div>`).join('')}</div>
    <div class="lin" style="margin-top:8px"><span>Consumo</span><b>${brl(k.consumo)}</b></div>
    <div class="lin"><span>Serviço ${k.servico_pct}%</span><b>${brl(k.servico)}</b></div>
    ${compl>0?`<div class="lin"><span>Complemento da consumação</span><b>${brl(compl)}</b></div>`:''}
    <div class="lin" style="margin-top:6px;font-size:24px"><span>Cobrar</span><b style="color:var(--ouro-2)">${brl(cobrar)}</b></div>
    ${cobrar!==k.total?`<p class="mut">Pelo Frest (tem item lançado direto na mesa ${c.mesa}).</p>`:''}
    ${c.frest_total!=null?`<p class="mut" style="margin-top:6px">Frest (lido ${hora(c.frest_lido_em)}): ${brl(c.frest_total)}</p>`:'<p class="mut" style="margin-top:6px">Total do Frest ainda não lido. <a href="#" id="reler" style="color:var(--ouro-2)">Ler de novo</a> ou confira a mesa '+c.mesa+'.</p>'}
    ${div?`<div class="aviso">O Frest e o app estão diferentes. Confira a mesa ${c.mesa} no Frest antes de cobrar.</div>`:''}
    ${compl>0?`<div class="aviso" style="background:rgba(224,169,63,.14);color:var(--ouro-2)">Lance no Frest o complemento de ${brl(compl)} na mesa ${c.mesa}.</div>`:''}
    ${pode&&!paga?`<div class="formas">${['Crédito','Débito','Pix','Dinheiro'].map(f=>`<button class="bt linha" data-f="${f}">${f}</button>`).join('')}</div>
      <div class="acoes"><button class="bt ok grande" id="liberar" disabled>Recebi: liberar</button></div>`:''}
    ${!pode?'<p class="mut" style="margin-top:10px">Leve ao caixa para cobrar.</p>':''}
    <div class="acoes"><button class="bt linha" onclick="fechar()">Voltar</button></div></div>`);
  const rl=$('#reler'); if(rl) rl.onclick=e=>{ e.preventDefault(); ler('C-'+c.codigo); };
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ forma=b.dataset.f; document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===b)); $('#liberar').disabled=false; });
  const lb=$('#liberar'); if(lb) lb.onclick=async()=>{
    lb.disabled=true;
    try{ await rpc('ev_liberar',{p_sessao:S.sessao,p_conta_codigo:c.codigo,p_forma:forma}); }
    catch(e){ lb.disabled=false; return alert(msgErro(e)); }
    resultado(`<div class="card res bom" id="res"><div class="grande-txt">Liberada ✓</div><p class="mut">${esc(c.nome)} · pulseira ${c.pulseira} · ${forma}. Feche a mesa ${c.mesa} no Frest.</p>${voltar()}</div>`);
  };
}

/* ---------------------------------------------------------------- lançar pela pulseira */
/* bebida lançada pela equipe: o papel sai no bar escolhido (quem é do bar entrega na hora: sem papel) */
let barEq=null; try{ barEq=localStorage.getItem('festa_eq_bar'); }catch{}
let bisEq=null;   // mesa bistrô (opcional): o garçom leva e ela confirma no celular
let ultLanc=null;   // último pedido lançado por este garçom (botão Desfazer)
async function telaLancar(n, aviso, ladoIni){
  resultado('<div class="card" id="res"><p class="mut">Abrindo a pulseira '+n+'…</p></div>');
  let r;
  try{ r=await rpc('ev_equipe_cliente',{p_sessao:S.sessao,p_pulseira:n}); }
  catch(e){ return resultado(`<div class="card res ruim" id="res"><div class="grande-txt">${esc(msgErro(e))}</div>${voltar()}</div>`); }
  if(!r.ok) return resultado(`<div class="card res ruim" id="res"><div class="grande-txt">${esc(MSG[r.motivo]||r.motivo)}</div>${voltar()}</div>`);
  if(r.paga) return resultado(`<div class="card res ruim" id="res"><div class="grande-txt">${esc(r.nome)}: conta já paga</div><p class="mut">Fale com o caixa para reabrir.</p>${voltar()}</div>`);
  let lado=ladoIni||((S.papel==='bar')?'bebida':'comida'), sel=null, cod=null, qtd=1, enviando=false, resp=[];
  const pintar=()=>{
    const itens=r.cardapio.filter(m=>m.tipo===lado), cats=[...new Set(itens.map(m=>m.categoria))];
    const m=sel&&r.cardapio.find(x=>x.id===sel), op=m&&m.opcoes.find(o=>o.cod===cod);
    resultado(`<div id="res">
      <button class="bt linha" onclick="fechar()" style="width:100%;margin-bottom:10px">← Sair da mesa ${r.pulseira}</button>
      ${aviso?`<div class="aviso ok" style="margin:0 0 10px">${esc(aviso)}${ultLanc&&S.papel==='garcom'&&Date.now()-ultLanc.em<PRAZO?`<button class="bt perigo" id="desfazer" data-ate="${ultLanc.em+PRAZO}" style="width:100%;margin-top:8px;background:transparent">Desfazer: a cliente desistiu (${seg(PRAZO-(Date.now()-ultLanc.em))})</button>`:''}</div>`:''}
      <div class="card"><div class="lin"><div><div class="grande-txt">${esc(r.nome)}</div>
        <div class="mut">mesa ${r.mesa} · consumo ${brl(r.conta.consumo)}</div></div><div class="puls"><small>PULS.</small>${r.pulseira}</div></div></div>
      <div class="lado"><button class="bt linha ${lado==='bebida'?'on':''}" data-lado="bebida">Beber</button><button class="bt linha ${lado==='comida'?'on':''}" data-lado="comida">Comer</button></div>
      <div class="cardap">${cats.map(c=>`<div class="cat">${esc(c)}</div>`+itens.filter(x=>x.categoria===c).map(x=>{
        const ps=x.opcoes.map(o=>o.preco), mn=Math.min(...ps);
        return `<button data-item="${x.id}" class="${x.id===sel?'on':''}"><span>${esc(x.nome)}</span><span class="mut">${brl(mn)}</span></button>`;}).join('')).join('')}</div>
      ${m?`<div class="escolha"><b>${esc(m.nome)}</b>
        ${m.opcoes.length>1?`<div class="chips">${m.opcoes.map(o=>`<button data-cod="${o.cod}" class="${o.cod===cod?'on':''}">${esc(o.rotulo)}</button>`).join('')}</div>`:''}
        ${(m.perguntas||[]).map((pg,i)=>`<div class="mut" style="margin-top:10px">${esc(pg.p)}</div><div class="chips">${pg.op.map((o,j)=>`<button data-perg="${i}" data-resp="${j}" class="${resp[i]===o?'on':''}">${esc(o)}</button>`).join('')}</div>`).join('')}
        ${S.papel!=='bar'?`<div class="mut" style="margin-top:10px">${m.tipo==='comida'?'A cozinha manda para':'Sai no'}</div><div class="chips">${[['baixo','Bar do 1º piso'],['cima','Bar do 2º piso'],['bistro','Bistrô']].map(([k,nb])=>`<button data-bar="${k}" class="${(k==='bistro'?bisEq!==null:(bisEq===null&&k===barEq))?'on':''}">${nb}</button>`).join('')}</div>`:''}
                ${bisEq!==null&&S.papel!=='bar'?`<div class="chips">${Array.from({length:15},(_,i)=>`<button data-bis="${i+1}" class="${bisEq===i+1?'on':''}">${i+1}</button>`).join('')}</div>`:''}
        <div class="qtd"><button id="menos">−</button><span>${qtd}</span><button id="mais">+</button></div>
        <div class="acoes"><button class="bt ok grande" id="lancar">${enviando?'Lançando…':'Lançar '+brl(op.preco*qtd)}</button></div></div>`:''}
      <div class="acoes"><button class="bt linha" onclick="fechar()">← Sair da mesa ${r.pulseira}</button></div></div>`);
    document.querySelectorAll('[data-lado]').forEach(b=>b.onclick=()=>{ lado=b.dataset.lado; sel=null; pintar(); });
    document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{ sel=+b.dataset.item; const mm=r.cardapio.find(x=>x.id===sel); cod=mm.opcoes[0].cod; qtd=1; resp=(mm.perguntas||[]).map(()=>null); pintar(); });
    document.querySelectorAll('[data-perg]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.perg; resp[i]=m.perguntas[i].op[+b.dataset.resp]; pintar(); });
    document.querySelectorAll('[data-cod]').forEach(b=>b.onclick=()=>{ cod=b.dataset.cod; pintar(); });
    document.querySelectorAll('[data-bar]').forEach(b=>b.onclick=()=>{ if(b.dataset.bar==='bistro'){ bisEq=bisEq||0; pintar(); return; } bisEq=null; barEq=b.dataset.bar; try{localStorage.setItem('festa_eq_bar',barEq);}catch{} pintar(); });
    document.querySelectorAll('[data-bis]').forEach(b=>b.onclick=()=>{ const n=+b.dataset.bis; bisEq=n; pintar(); });
    const df=$('#desfazer'); if(df) df.onclick=async()=>{ if(await cancelarMeu(ultLanc.voucher,df)){ ultLanc=null; telaLancar(r.pulseira,'Pedido cancelado. O Frest e o bar recebem o cancelamento.',lado); } };
    const me=$('#menos'); if(me){ me.onclick=()=>{ if(qtd>1){qtd--;pintar();} }; $('#mais').onclick=()=>{ if(qtd<10){qtd++;pintar();} }; }
    const lb=$('#lancar'); if(lb) lb.onclick=async()=>{
      if(enviando) return;
      if(S.papel!=='bar'&&bisEq===null&&!barEq){ alert(m.tipo==='comida'?'Escolha para onde a cozinha manda.':'Escolha em qual bar a bebida sai.'); return; }
      if(bisEq===0){ alert('Toque no número da bistrô.'); return; }
      const pg=m.perguntas||[]; const faltou=pg.findIndex((_,i)=>!resp[i]);
      if(faltou>=0){ alert('Falta escolher: '+pg[faltou].p); return; }
      enviando=true; lb.disabled=true; lb.textContent='Lançando…';
      try{
        const x=await rpc('ev_equipe_pedir',{p_sessao:S.sessao,p_pulseira:r.pulseira,p_item:m.id,p_cod:cod,p_qtd:qtd,p_retirar:!bisEq?(barEq||null):null,p_bistro:bisEq||null,p_escolhas:pg.length?resp:null});
        if(navigator.vibrate) navigator.vibrate(40);
        const nomeItem=m.nome+(op.rotulo?' · '+op.rotulo:'')+resp.filter(Boolean).map(x=>' · '+x).join('');
        ultLanc={voucher:x.voucher, em:Date.now()};
        telaLancar(r.pulseira, `${qtd}× ${nomeItem} lançado para ${r.nome.split(' ')[0]}${S.papel==='garcom'&&m.tipo==='comida'?'. A entrega é sua.':'.'}`, lado);
      }catch(e){ enviando=false; lb.disabled=false; lb.textContent='Tentar de novo'; alert(msgErro(e)+' O pedido NÃO foi feito.'); }
    };
  };
  pintar();
}

/* ---------------------------------------------------------------- porta */
async function buscar(){
  const box=$('#achados'); if(!box) return;
  const q=busca.trim();
  if(q.length<2 && !/^\d+$/.test(q)){ box.innerHTML=''; return; }
  try{
    const r=await rpc('ev_porta_buscar',{p_sessao:S.sessao,p_q:q});
    if(busca.trim()!==q) return;
    box.innerHTML = r.length ? r.map(c=>`<button data-conv="${c.id}">
        <span><b>${esc(c.nome)}</b><div class="mut">cel. final ${esc(c.tel_final||'—')}${c.origem==='lista'?'':' · '+esc(c.origem)}</div></span>
        ${c.pulseira!=null?`<span class="puls"><small>PULS.</small>${c.pulseira}</span>`:'<span class="tag vivo">sem pulseira</span>'}
      </button>`).join('')
      : '<p class="mut">Ninguém com esse nome ou celular. Confira a grafia ou cadastre abaixo.</p>';
    box.querySelectorAll('[data-conv]').forEach(b=>b.onclick=()=>telaLigar(r.find(c=>String(c.id)===b.dataset.conv)));
  }catch(e){ box.innerHTML=`<div class="aviso">${esc(msgErro(e))}</div>`; }
}
const MOTIVO={pulseira_ocupada:'Essa pulseira já é de outra convidada.',pulseira_invalida:'Número de pulseira inválido.',
  ja_pediu:'Ela já pediu com a outra pulseira. Fale com a gerência.',ja_tem_pulseira:'Ela já tem outra pulseira.',
  evento_fechado:'Evento fechado.',sem_nome:'Falta o nome.'};
function telaLigar(c){
  if(c.pulseira!=null) return ligar(c, c.pulseira);
  resultado(`<div class="card" id="res"><div class="grande-txt">${esc(c.nome)}</div>
    <p class="mut">cel. final ${esc(c.tel_final||'—')}</p>
    <p style="margin-top:14px">Entregue a pulseira e digite o número dela:</p>
    <input class="campo num-grande" id="pp" inputmode="numeric" placeholder="nº" autocomplete="off"/>
    <div id="pm"></div>
    <div class="acoes"><button class="bt ouro grande" id="pok">Abrir a mesa</button><button class="bt linha" onclick="fechar()">Voltar</button></div></div>`);
  $('#pp').focus();
  $('#pp').onkeydown=e=>{ if(e.key==='Enter') $('#pok').click(); };
  $('#pok').onclick=()=>{ const n=parseInt($('#pp').value,10); if(!n) return $('#pm').innerHTML='<div class="aviso">Digite o número da pulseira.</div>'; ligar(c,n); };
}
async function ligar(c,n){
  try{
    const r=await rpc('ev_porta_vincular',{p_sessao:S.sessao,p_conv:c.id,p_pulseira:n});
    if(!r.ok){ const m=(MOTIVO[r.motivo]||r.motivo)+(r.de?` (${r.de})`:'');
      if($('#pm')) return $('#pm').innerHTML=`<div class="aviso">${esc(m)}</div>`;
      return resultado(`<div class="card res ruim" id="res"><div class="grande-txt">${esc(m)}</div>${voltar()}</div>`); }
    mostrarQr(r);
  }catch(e){ resultado(`<div class="card res ruim" id="res"><div class="grande-txt">${esc(msgErro(e))}</div>${voltar()}</div>`); }
}
function mostrarQr(r){
  const q=qrcode(0,'M'); q.addData(CLIENTE+r.token); q.make();
  busca=''; if(navigator.vibrate) navigator.vibrate(60);
  resultado(`<div class="card res bom" id="res">
    <div class="lin"><div><div class="grande-txt">${esc(r.nome)}</div><div class="mut">mesa ${r.mesa} aberta</div></div><div class="puls"><small>PULS.</small>${r.pulseira}</div></div>
    <p style="margin-top:12px">Vire a tela para ela: <b>abra a câmera do celular e aponte para o QR</b>. O cardápio abre já na mesa dela.</p>
    <div class="qrbox">${q.createSvgTag({cellSize:6,margin:2,scalable:true})}</div>
    <p class="mut">Não abriu? Ela pode pedir pelo garçom e pagar no caixa dizendo o número da pulseira.</p>
    <div class="acoes"><button class="bt ok grande" onclick="fechar()">Próxima</button></div></div>`);
}
function telaPorta(){
  resultado(`<div class="card" id="res"><div class="grande-txt">Cadastrar quem não está na lista</div>
    <input class="campo" id="pn" placeholder="Nome e sobrenome" autocomplete="off"/>
    <input class="campo" id="pt" inputmode="tel" placeholder="Celular com DDD"/>
    <input class="campo" id="pp" inputmode="numeric" placeholder="Número da pulseira"/>
    <div id="pm"></div>
    <div class="acoes"><button class="bt ouro grande" id="pok">Abrir a mesa</button><button class="bt linha" onclick="fechar()">Voltar</button></div></div>`);
  $('#pn').focus();
  $('#pok').onclick=async()=>{
    const n=parseInt($('#pp').value,10), nome=$('#pn').value.trim(), tel=$('#pt').value.trim();
    if(!n||!nome) return $('#pm').innerHTML='<div class="aviso">Preencha nome e pulseira.</div>';
    try{
      const r=await rpc('ev_porta_cadastrar',{p_sessao:S.sessao,p_pulseira:n,p_nome:nome,p_telefone:tel||null});
      if(!r.ok) return $('#pm').innerHTML=`<div class="aviso">${esc((MOTIVO[r.motivo]||r.motivo)+(r.motivo==='ja_tem_pulseira'?` É a pulseira ${r.pulseira}.`:''))}</div>`;
      mostrarQr(r);
    }catch(e){ $('#pm').innerHTML=`<div class="aviso">${esc(msgErro(e))}</div>`; }
  };
}

/* ---------------------------------------------------------------- câmera */
let stream=null, detector=null, rodando=false;
async function abrirCamera(){
  $('#scan').classList.remove('oculto'); $('#scan-msg').textContent='Aponte para o QR do voucher ou da conta';
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    const v=$('#video'); v.srcObject=stream; await v.play();
    if('BarcodeDetector' in window){ try{ detector=new BarcodeDetector({formats:['qr_code']}); }catch{ detector=null; } }
    rodando=true; laco();
  }catch(e){ $('#scan-msg').textContent='Não consegui abrir a câmera. Digite o código do voucher aqui embaixo.'; }
}
function fecharCamera(){ rodando=false; if(stream) stream.getTracks().forEach(t=>t.stop()); stream=null; $('#scan').classList.add('oculto'); }
const tela=document.createElement('canvas'), ctx=tela.getContext('2d',{willReadFrequently:true});
async function laco(){
  if(!rodando) return;
  const v=$('#video'); let txt=null;
  try{
    if(v.readyState>=2){
      if(detector){ const r=await detector.detect(v); if(r.length) txt=r[0].rawValue; }
      else if(window.jsQR){ const w=v.videoWidth, h=v.videoHeight, s=Math.min(1, 640/Math.max(w,h));
        tela.width=w*s; tela.height=h*s; ctx.drawImage(v,0,0,tela.width,tela.height);
        const img=ctx.getImageData(0,0,tela.width,tela.height); const r=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'}); if(r) txt=r.data; }
    }
  }catch{}
  if(txt){ fecharCamera(); ultimoCodigo=codigoDe(txt); ler(txt); return; }
  setTimeout(laco, 120);
}
const codigoDe=t=>String(t).toUpperCase().replace(/^.*[\/=:#-]/,'').replace(/[^A-Z0-9]/g,'');
$('#ler').onclick=abrirCamera; $('#scan-fechar').onclick=fecharCamera;
// celular da cliente sem bateria: digita o código impresso na etiqueta do drink (ex.: H8Z2 BN4U)
$('#scan-form').onsubmit=e=>{ e.preventDefault(); const t=$('#scan-cod').value.trim().replace(/\s+/g,''); if(!t) return;
  $('#scan-cod').value=''; $('#scan-cod').blur(); fecharCamera(); ultimoCodigo=codigoDe(t); ler(t); };
$('#digitar').onclick=()=>{ const t=prompt('Código do voucher, da conta ou o número da pulseira:'); if(t){ ultimoCodigo=codigoDe(t); ler(t);} };
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(h&&S){ history.replaceState(null,'',location.pathname+location.search); ultimoCodigo=codigoDe(h); ler(h);} });

// 27/11 (Rebecca, pulseira 23): a convidada tocou no QR do próprio voucher/conta e o celular dela abriu
// esta tela, "como se fosse garçom". Sem sessão da equipe, QR de voucher ou de conta volta para a
// página da convidada (o link dela fica no aparelho); a equipe abre esta tela logada e lê pelo leitor.
if(!S && /^#[VC]-/i.test(location.hash)){ location.replace('/festa/'+location.search); }
else {
if(location.hash) ultimoCodigo=codigoDe(location.hash.slice(1));
S ? iniciar() : telaLogin();
}
</script>
