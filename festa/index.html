<!DOCTYPE html>
<html lang="pt-BR" data-tema="convite">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Jardim do Éder · Spesso</title>
<meta name="description" content="Jardim do Éder: solte suas feras. Peça bebidas e pratos pelo celular."/>
<meta name="theme-color" content="#07130C"/>
<meta name="color-scheme" content="dark"/>
<meta name="robots" content="noindex"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='%23E0A93F'/></svg>"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Alegreya:ital,wght@0,500;0,700;0,800;1,500&family=Alegreya+SC:wght@500;700&family=Kaushan+Script&display=swap" rel="stylesheet"/>
<style>
/* comum (o visual da festa vem de temas/convite.css, carregado logo abaixo e por cima) */
.nav .nav-perfil{width:52px;display:grid;place-items:center;padding:0;}
.perfil-bt{width:34px;height:34px;border-radius:50%;border:1px solid var(--ouro);background:rgba(0,0,0,.28);color:var(--ouro-2);
  font:inherit;font-size:15px;font-weight:700;display:grid;place-items:center;padding:0;cursor:pointer;flex:none;
  -webkit-tap-highlight-color:transparent;transition:transform 140ms var(--ease-out,ease-out);}
.nav-perfil:active .perfil-bt{transform:scale(.94);}
.perfil .campo{margin-top:20px;}
.perfil .campo .rot{display:block;margin:0;}
.perfil .campo .pq{display:block;font-size:13px;line-height:1.35;color:var(--texto-2);margin:3px 0 8px;}
.perfil input[type=text],.perfil input[type=email]{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;
  border:1px solid var(--linha);background:rgba(0,0,0,.22);color:var(--texto);}
.perfil .arroba{position:relative;} .perfil .arroba span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--texto-2);font-size:16px;}
.perfil .arroba input{padding-left:30px;}
.perfil .sel{display:flex;gap:8px;} .perfil .sel select{flex:1;}
.perfil .simnao{display:flex;gap:8px;} .perfil .simnao button{flex:1;}
.perfil .simnao button.on{outline:2px solid var(--ouro-2);outline-offset:2px;}
.perfil .rodape{font-size:12.5px;line-height:1.4;color:var(--texto-2);margin-top:14px;}
@media (prefers-reduced-motion: reduce){.perfil-bt{transition:none;}}
</style>
<link rel="stylesheet" id="tema-css" href="temas/convite.css?v=17a" onerror="if(!this.dataset.r){this.dataset.r=1;this.href=this.href+'&r=1'}"/>
</head>
<body>
<div id="rede" class="rede oculto">Sem internet agora. Assim que voltar, a página se atualiza.</div>
<div id="app"><div class="carregando"><img src="img/spesso.png" alt="Spesso · Cucina italiana" width="150" style="margin:0 auto 18px;opacity:.9"/>Abrindo o seu cardápio…</div></div>

<div id="veu" class="veu oculto"></div>
<div id="folha" class="folha oculto" role="dialog" aria-modal="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const SB = 'https://ujxdbktmbowtokrxxylb.supabase.co';
const K  = 'sb_publishable_esAA71xiJkVOowMYoH0iEg_PPcb6xiP';
const VER = 'festa-v20 27/11/2026';
const FOTOS_G = ['bruschette','ciabatta','fettuccine-fiorentina','gnocchi','insalata-foglie','insalata-mediterranea','pizza-4formaggi','pizza-calabresa','pizza-maiale','pizza-margherita','pizza-parma','risotto-baccala','risotto-coda','rosetta','tiramisu','giro-pizzette'];
const SLUG = new URLSearchParams(location.search).get('e') || 'jardim-eder';
const EQUIPE = 'https://spesso.com.br/festa/equipe/#';

const $ = s => document.querySelector(s);
const brl = v => 'R$ ' + Number(v || 0).toFixed(2).replace('.', ',');
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const slug = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-');

async function rpc(nome, args) {
  const r = await fetch(`${SB}/rest/v1/rpc/${nome}`, {
    method:'POST', headers:{apikey:K, Authorization:'Bearer '+K, 'Content-Type':'application/json'},
    body: JSON.stringify(args)});
  const t = await r.text();
  let j = null; try { j = t ? JSON.parse(t) : null; } catch {}
  if (!r.ok) { const e = new Error((j && j.message) || 'erro'); e.codigo = j && j.message; throw e; }
  return j;
}

/* token: vem no link (?t=) e fica guardado para reabrir sem o link */
let token = new URLSearchParams(location.search).get('t');
try {
  if (token) localStorage.setItem('festa_token', token);
  else token = localStorage.getItem('festa_token');
} catch {}
/* QR da mesa bistrô aberto pela câmera do celular: spesso.com.br/festa/?b=N guarda a mesa por 3 h */
const B_URL = +(new URLSearchParams(location.search).get('b') || 0);
if (B_URL > 0 && B_URL <= 40) guardarBistro(B_URL);
if ((token || B_URL) && location.search) history.replaceState(null, '', location.pathname);

let D = null;            // último ev_cliente
let EXTRA = {};          // ev_cliente_extra (sql/666): novidades, pré-reserva, perfil
const carregarExtra = () => token ? rpc('ev_cliente_extra', {p_token: token}).then(x => { EXTRA = Object.assign(x || {}, {_ok: !!x}); }).catch(() => {}) : Promise.resolve();
let aba = 'cardapio';    // cardapio | pedidos | conta
let lado = 'bebida';     // bebida | comida
let obsCats = null;      // a barra das categorias presa no alto → mostra a chave Beber/Comer

async function carregar() {
  if (!token) return carregarVitrine();
  try {
    D = await rpc('ev_cliente', {p_token: token});
    $('#rede').classList.add('oculto');
    desenhar(); checarProntos();
    if (!EXTRA._ok) carregarExtra().then(() => { if (aba === 'pedidos' && !D.vitrine) desenharPedidos(); });
  } catch (e) {
    if (e.codigo === 'link_invalido') {
      try { localStorage.removeItem('festa_token'); } catch {}
      token = null;
      return carregarVitrine();
    }
    $('#rede').classList.remove('oculto');
    if (!D) telaErro('Sem conexão', 'Confira a internet do celular e toque para tentar de novo.', true);
  }
}
/* sem o link pessoal: o cardápio aparece para olhar; pedir só com o link */
async function carregarVitrine() {
  try {
    const r = await rpc('ev_cardapio_publico', {p_slug: SLUG});
    D = {vitrine: true, evento: r.evento, cardapio: r.cardapio, eu: null, conta: null};
    $('#rede').classList.add('oculto');
    desenhar();
  } catch (e) {
    telaErro('Sem conexão', 'Confira a internet do celular e toque para tentar de novo.', true);
  }
}
/* só pede quem abriu o próprio link (cada link é uma mesa). Sem link: cardápio para ver e o garçom.
   Renato 24/11: "cada link é de uma mesa e só pelo link o cliente pode pedir. como plano b, o cliente pede pro garçom." */
const podePedir = () => !!(D && !D.vitrine && D.eu.pulseira != null && !D.eu.liberada);
let avisouBistro = false;
function conviteHtml() {
  if (D.vitrine && B_URL) return `<div class="convite"><b>Mesa bistrô ${B_URL}</b>
      <p>Abra o seu link (a mensagem da Minerva no WhatsApp), escolha "Na minha mesa bistrô" e toque no <b>${B_URL}</b>. Sem o link? Peça a um garçom.</p></div>`;
  if (D.vitrine) return `<div class="convite"><b>Para pedir, use o seu link</b>
      <p>Na entrada, aponte a câmera para o QR: a Minerva abre a sua mesa no WhatsApp e te manda o seu link. Sem celular? Peça a um garçom.</p></div>`;
  if (B_URL && bistroAtual() === B_URL && !avisouBistro) { avisouBistro = true;
    return `<div class="convite"><b>Você está na mesa bistrô ${B_URL}</b><p>Peça pelo cardápio: o garçom traz aqui.</p></div>`; }
  if (D.eu.pulseira == null) return `<div class="convite"><b>Falta ligar a sua pulseira</b>
      <p>Fale com alguém da entrada ou com um garçom para ligar a sua pulseira a este link.</p></div>`;
  return '';
}
/* Instagram: tocar em "Seguir" uma vez basta; até lá ele aparece pelo caminho, uma vez por tela
   (Renato 25/11: "insistentes mas educados e elegantes, sempre"): faixa no topo do cardápio, cartão no fim
   de Pedidos, uma linha nas folhas (no máximo a cada 15 min) e o link depois da foto.
   Não dá para saber se ela seguiu de fato: vale o toque. */
const seguiu = () => { try { return localStorage.getItem('festa_seguiu') === '1'; } catch { return false; } };
const FRASES_SEGUIR = [
  ['As fotos da festa vão para o nosso Instagram', 'Siga para se achar amanhã.'],
  ['Gostou do drink?', 'No @spesso.rio tem os bastidores do bar e as próximas festas.'],
  ['Fome de mais?', 'O cardápio do dia a dia e as novidades da cozinha estão no @spesso.rio.'],
  ['Mentre aspetti…', 'Enquanto espera, siga o @spesso.rio.'],
  ['Marque a gente na foto.', 'Siga o @spesso.rio: a gente reposta as melhores da noite.'],
];
function seguirTopo() {
  if (seguiu()) return `<a class="seguir-topo feito" href="${INSTA}" target="_blank" rel="noopener" data-seguir>${IG} @spesso.rio <span>seguindo</span></a>`;
  return `<a class="seguir-topo" href="${INSTA}" target="_blank" rel="noopener" data-seguir>
      ${IG}<span class="tx"><b>Siga o Spesso</b> no Instagram</span><span class="bt-s">Seguir</span></a>`;
}
function seguirLinha(i) {
  if (seguiu() || D.vitrine) return '';
  let ult = 0; try { ult = +localStorage.getItem('festa_seguir_ts') || 0; } catch {}
  if (Date.now() - ult < 15 * 60 * 1000) return '';
  try { localStorage.setItem('festa_seguir_ts', String(Date.now())); } catch {}
  const [a] = FRASES_SEGUIR[i % FRASES_SEGUIR.length];
  return `<a class="seguir-linha" href="${INSTA}" target="_blank" rel="noopener" data-seguir>${IG}<span>${a} <b>Siga o @spesso.rio</b></span></a>`;
}
function seguirHtml(i) {
  if (seguiu() || D.vitrine) return '';
  const [a, b] = FRASES_SEGUIR[i % FRASES_SEGUIR.length];
  return `<a class="seguir-card" href="${INSTA}" target="_blank" rel="noopener" data-seguir>
      ${IG}<span class="tx"><b>${a}</b>${b}</span><span class="bt-s">Seguir</span></a>`;
}
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('[data-seguir]'); if (!a) return;
  try { localStorage.setItem('festa_seguiu', '1'); } catch {}
  setTimeout(() => { document.querySelectorAll('.seguir-card,.seguir-linha').forEach(c => c.remove());
    const t = document.querySelector('.seguir-topo:not(.feito)'); if (t) t.outerHTML = seguirTopo(); }, 800);
});
/* bebida: a convidada escolhe em qual bar pega (o papel sai na impressora daquele bar) */
const BARES = [['baixo', 'Bar do 1º piso'], ['cima', 'Bar do 2º piso']];
/* Renato 27/11: comida também no Bar do 1º piso (a cozinha manda para o bar escolhido) */
const retiraComida = r => r === 'baixo' ? 'no Bar do 1º piso' : 'ao lado do Bar do 2º piso';
const nomeBar = k => (BARES.find(b => b[0] === k) || [k, 'bar'])[1];
let bar = null; try { bar = localStorage.getItem('festa_bar'); } catch {}
function telaErro(t, d, tentar) {
  $('#app').innerHTML = `<div class="erro-tela"><h2>${esc(t)}</h2><p>${esc(d)}</p>
    ${tentar ? '<p style="margin-top:18px"><button class="bt ouro" onclick="carregar()">Tentar de novo</button></p>' : ''}</div>`;
}

/* ---------------------------------------------------------------- desenho */
/* Renato 24/11: "a primeira tela precisa já aparecer os botões de comida e bebida ... a paisagem
   está ocupando demais ... mais funcional pra cliente já bêbada pedir com facilidade." */
function desenhar() {
  const eu = D.eu, conta = D.conta;
  const primeiroNome = eu ? (eu.nome || '').split(' ')[0] : '';
  if (D.vitrine) aba = 'cardapio';
  const ativos = conta ? conta.itens.filter(i => !i.entregue).length : 0;
  $('#app').innerHTML = `
    <header class="topo"><div class="bg"></div>
      <div class="tt">${primeiroNome && !D.vitrine
        ? `<div class="nome-topo">${esc(primeiroNome)}</div><h1 class="com-nome">no Jardim do Éder</h1>`
        : `<h1>Jardim do Éder</h1><div class="marca">SPESSO · 27·11·26</div>`}</div>
      <div class="dir"><button class="logo-casa" id="logo-casa" aria-label="Conheça o Spesso"><img src="img/spesso.png" alt="Spesso"/></button>
      ${eu && eu.pulseira != null ? `<div class="eu"><span class="q">MESA</span><span class="num">${eu.pulseira}</span></div>` : ''}</div>
    </header><div class="faixa" aria-hidden="true"></div>
    ${conviteHtml()}
    <main id="corpo"></main>
    <div class="espaco"></div>
    <div class="ver">skv-versao ${VER}</div>
    ${D.vitrine ? '' : `<nav class="barra">
      <div class="nav">
        <button data-aba="cardapio"><b>Cardápio</b></button>
        <button data-aba="pedidos"><b>Pedidos${ativos ? ' · ' + ativos : ''}</b></button>
        <button data-aba="fotos"><b>Fotos</b></button>
        <button data-aba="perfil" class="nav-perfil" aria-label="Seu perfil"><span class="perfil-bt">${esc((primeiroNome || '?').charAt(0).toUpperCase())}</span></button>
      </div>
    </nav>`}`;
  document.querySelectorAll('.nav button').forEach(b => {
    b.classList.toggle('on', b.dataset.aba === aba);
    b.onclick = () => {
      if (b.dataset.aba === 'fotos') return abrirCamera();
      if (b.dataset.aba === 'perfil') return abrirPerfil();
      aba = b.dataset.aba; desenhar(); window.scrollTo({top: 0, behavior:'smooth'});
    };
  });
  if (aba === 'conta') aba = 'pedidos';
  $('#logo-casa').onclick = abrirCasa;
  ({cardapio: desenharCardapio, pedidos: desenharPedidos})[aba]();
  if (!revelou) { revelou = true; const tt = $('.topo .tt'); if (tt) tt.classList.add('revela'); }
}
let revelou = false;     // o nome aparece com calma só na primeira abertura

function desenharConsumo() {
  const c = D.conta, el = $('#consumo');
  if (!el) return;
  if (!c.minimo) { el.classList.add('oculto'); return; }
  const pct = Math.min(100, 100 * c.consumo / c.minimo);
  el.innerHTML = c.falta_minimo > 0
    ? `<span>Faltam <b>${brl(c.falta_minimo)}</b> da sua consumação</span><span class="trilho"><i style="width:${pct}%"></i></span>`
    : `<span>Consumação de <b>${brl(c.minimo)}</b> completa</span><span class="trilho"><i style="width:100%"></i></span>`;
}

const fotoP = m => m.foto ? `img/${esc(m.foto)}.jpg` : '';
const fotoG = m => m.foto ? (FOTOS_G.includes(m.foto) ? `img/g/${esc(m.foto)}.jpg` : `img/${esc(m.foto)}.jpg`) : '';
function desenharCardapio() {
  const itens = D.cardapio.filter(m => m.tipo === lado);
  const cats = [...new Set(itens.map(m => m.categoria))];
  $('#corpo').innerHTML = `
    <div class="lados">
      <button class="lado ${lado==='bebida'?'on':''}" data-lado="bebida" aria-label="Beber"><img src="img/arara.jpg" alt=""/><b>Beber</b></button>
      <button class="lado ${lado==='comida'?'on':''}" data-lado="comida" aria-label="Comer"><img src="img/onca.jpg" alt=""/><b>Comer</b></button>
    </div>
    ${D.vitrine ? '' : seguirTopo()}
    <div class="sent" aria-hidden="true"></div>
    <nav class="cats">
      <div class="troca"><button data-troca="bebida" class="${lado==='bebida'?'on':''}">Beber</button><button data-troca="comida" class="${lado==='comida'?'on':''}">Comer</button></div>
      <div class="in">${cats.map(c => `<a href="#c-${slug(c)}">${esc(c)}</a>`).join('')}</div></nav>
    ${lado === 'comida' && !D.vitrine ? `<p class="dica">A comida vai até a sua <b>mesa bistrô</b> ou você retira no <b>Bar do 1º piso</b> ou <b>ao lado do Bar do 2º piso</b> (a gente avisa quando ficar pronta).</p>` : ''}
    ${cats.map((c, i) => `<section class="secao" id="c-${slug(c)}"><h2>${esc(c)}</h2>
      ${itens.filter(m => m.categoria === c).map(itemHtml).join('')}</section>`).join('')}
    ${casaHtml(false)}`;
  document.querySelectorAll('.lado').forEach(b => b.onclick = () => {
    lado = b.dataset.lado; desenharCardapio();
    window.scrollTo({top: $('.lados').offsetTop - 6, behavior: 'smooth'});
  });
  /* trocar Beber e Comer lá embaixo, sem rolar tudo para cima */
  document.querySelectorAll('[data-troca]').forEach(b => b.onclick = () => {
    if (lado === b.dataset.troca) return;
    const fixo = window.scrollY > $('.cats').offsetTop - 2;
    lado = b.dataset.troca; desenharCardapio();
    if (fixo) window.scrollTo({top: $('.cats').offsetTop, behavior: 'instant'});
  });
  document.querySelectorAll('.item').forEach(b => b.onclick = () => abrirItem(+b.dataset.id));
  document.querySelectorAll('.item .foto').forEach(f => f.onclick = e => {
    e.stopPropagation(); const m = D.cardapio.find(x => x.id === +f.closest('.item').dataset.id); verFoto(m);
  });
  if (obsCats) obsCats.disconnect();
  if (window.IntersectionObserver) {
    obsCats = new IntersectionObserver(es => { const e = es[es.length - 1], c = $('.cats');
      if (c) c.classList.toggle('preso', !e.isIntersecting && e.boundingClientRect.top < 0); });
    obsCats.observe($('.sent'));
  }
  ligarCasa();
  marcarCats();
}
function itemHtml(m) {
  const precos = m.opcoes.map(o => o.preco);
  const min = Math.min(...precos), max = Math.max(...precos);
  return `<button class="item" data-id="${m.id}">
    ${m.foto ? `<div class="foto"><img src="${fotoP(m)}" alt="" loading="lazy"/></div>` : ''}
    <div class="tx"><h3>${esc(m.nome)}</h3>
      ${m.chamada ? `<div class="chamada">${esc(m.chamada)}</div>` : ''}
      <div class="pr">${min === max ? brl(min) : 'a partir de ' + brl(min)}</div></div>
    <span class="mais" aria-hidden="true">+</span></button>`;
}
function marcarCats() {
  const links = [...document.querySelectorAll('.cats a')];
  if (!links.length) return;
  const io = new IntersectionObserver(es => es.filter(e => e.isIntersecting).forEach(e => {
    links.forEach(a => {
      const on = a.getAttribute('href') === '#' + e.target.id;
      a.classList.toggle('on', on);
      if (on) a.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
    });
  }), {rootMargin:'-124px 0px -65% 0px'});
  document.querySelectorAll('.secao').forEach(s => io.observe(s));
}
/* foto em tela cheia: toque para fechar */
function verFoto(m) {
  if (!m || !m.foto) return;
  const v = document.createElement('div');
  v.className = 'lupa';
  v.innerHTML = `<img src="${fotoG(m)}" alt="${esc(m.nome)}"/><div class="lg">${esc(m.nome)}<small>toque para fechar</small></div>`;
  v.onclick = () => v.remove();
  document.body.appendChild(v);
}

/* ---------- entrega: bistrô (garçom leva) ou retirada no bar ---------- */
function onde(p) {
  if (p.bistro) return `na bistrô ${p.bistro}`;
  if (p.retirar) return `no ${nomeBar(p.retirar)}`;
  return '';
}
const STATUS = p => {
  if (p.entregue) return [p.entregue_por === 'cliente' ? 'Você confirmou que recebeu' : 'Entregue', 'ok'];
  if (p.bistro) return [p.garcom ? `${p.garcom.split(' ')[0]} está levando até a bistrô ${p.bistro}` : `Preparando · o garçom leva até a bistrô ${p.bistro}`, 'vivo'];
  if (p.tipo === 'comida' && p.pelo_garcom) return [p.garcom ? `Com ${p.garcom.split(' ')[0]}, que vai levar até você` : 'Na cozinha · o garçom leva até você', 'vivo'];
  if (p.tipo === 'comida' && p.retirar) return prontaJa(p) ? [`PRONTA! Retire ${retiraComida(p.retirar)}`, 'vivo']
                                                        : ['Na cozinha · a gente avisa quando ficar pronta', 'vivo'];
  if (p.retirar) return [`Retire no ${nomeBar(p.retirar)} com o voucher`, 'vivo'];
  if (p.tipo === 'comida') return [p.garcom ? `Com ${p.garcom.split(' ')[0]}, que vai levar até você` : 'Na cozinha', 'vivo'];
  return ['Retire no bar com o voucher', 'vivo'];
};
const BOTAO_RECEBI = p => p.bistro ? 'Recebi' : 'Peguei';
/* ---------- La casa: o Spesso assina embaixo (conselho de estilistas 25/11). Textos só do spesso.com.br. */
const ORN = '<svg width="120" height="26" viewBox="0 0 120 26" fill="currentColor" aria-hidden="true"><path d="M60 3 c5 6 12 8 20 8 c-8 2 -15 5 -20 12 c-5 -7 -12 -10 -20 -12 c8 0 15 -2 20 -8z"/><circle cx="14" cy="13" r="2"/><circle cx="106" cy="13" r="2"/><path d="M22 13 h26 M72 13 h26" stroke="currentColor" stroke-width="1"/></svg>';
function casaHtml(folha) {
  const convite = !folha || !D || D.vitrine || !token || EXTRA.pre_reserva ? ''
    : `<button class="bt ouro casa-bt" id="casa-pre">Fazer a minha festa aqui</button><p class="casa-pq">Pré-reserva sem compromisso, em três perguntas.</p>`;
  return `<section class="casa ${folha ? 'na-folha' : ''}">

const pn = () => esc(((D && D.eu && D.eu.nome) || '').split(' ')[0]);

/* comida para retirar: "pronta" 30 s depois do pronto do KDS (dá tempo de o prato chegar ao lado do bar) */
const prontaJa = p => !!(p.pronto && Date.now() - new Date(p.pronto).getTime() >= 30000);
let avisados = []; try { avisados = JSON.parse(localStorage.getItem('festa_avisados') || '[]'); } catch {}
function checarProntos() {
  if (!D || D.vitrine || !D.conta) return;
  const p = D.conta.itens.find(i => i.tipo === 'comida' && i.retirar && !i.pelo_garcom && !i.bistro && !i.entregue && prontaJa(i) && !avisados.includes(i.voucher));
  if (!p || document.querySelector('.alerta')) return;
  avisados.push(p.voucher); try { localStorage.setItem('festa_avisados', JSON.stringify(avisados)); } catch {}
  if (navigator.vibrate) navigator.vibrate([300, 120, 300, 120, 300]);
  try {
    const a = new (window.AudioContext || window.webkitAudioContext)();
    [0, .18, .36].forEach((d, i) => {
      const o = a.createOscillator(), g = a.createGain(); o.frequency.value = [880, 1175, 1568][i]; o.connect(g); g.connect(a.destination);
      g.gain.setValueAtTime(.0001, a.currentTime + d); g.gain.exponentialRampToValueAtTime(.3, a.currentTime + d + .02);
      g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + d + .16); o.start(a.currentTime + d); o.stop(a.currentTime + d + .18);
    });
  } catch {}
  const v = document.createElement('div'); v.className = 'alerta';
  v.innerHTML = `<div class="cx"><h2 class="it palavra">È pronto${comNome()}!</h2><p class="sub">${p.qtd}<span class="vz">×</span> ${esc(p.nome)}</p>

    <button class="bt ouro" id="al-v">Ver voucher</button><button class="bt linha" id="al-ok">Já vou</button></div>`;
  document.body.appendChild(v);
  v.querySelector('#al-ok').onclick = () => v.remove();
  v.querySelector('#al-v').onclick = () => { v.remove(); abrirVoucher(p); };
}

function ligarPedirDeNovo() {
  document.querySelectorAll('[data-de-novo]').forEach(b => b.onclick = () => {

let timerFolha = 0;
function abrirFolha(html) {
  clearTimeout(timerFolha);
  const f = $('#folha'), v = $('#veu');
  f.innerHTML = '<div class="pega"></div>' + html;
  f.classList.remove('oculto'); v.classList.remove('oculto');
  f.scrollTop = 0;
  requestAnimationFrame(() => { f.classList.add('on'); v.classList.add('on'); });
  v.onclick = fecharFolha;
}
function fecharFolha() {
  const f = $('#folha'), v = $('#veu');

  timerFolha = setTimeout(() => { f.classList.add('oculto'); v.classList.add('oculto'); }, 260);
}

/* pedido em dois passos: 1) o quê e quantos  2) onde receber + confirmar */
/* Renato 27/11: caipirinha pergunta açúcar ou adoçante; caipivodka, a fruta e açúcar ou adoçante (sql/680).
   Sem resposta não segue: o bar recebe no papel o que preparar. */
function abrirItem(id, codIni, qtdIni, respIni) {
  const m = D.cardapio.find(x => x.id === id); if (!m) return;
  let cod = codIni || m.opcoes[0].cod, qtd = qtdIni || 1, passo = 1, enviando = false;
  const pergs = m.perguntas || [];
  const resp = pergs.map((_, i) => (respIni && respIni[i]) || null);
  const falta = () => resp.some(r => !r);
  let entrega = m.tipo === 'comida' ? (bistroAtual() ? 'bistro' : null)  // comida: bistrô ou retirada no 2º piso
              : (bistroAtual() ? 'bistro' : (bar || null));
  const pintar = () => {
    const op = m.opcoes.find(o => o.cod === cod);
    const nomeOp = m.nome + (op.rotulo && m.opcoes.length > 1 ? ' · ' + op.rotulo : '') + resp.filter(Boolean).map(r => ' · ' + r).join('');
    if (passo === 1) {
      abrirFolha(`
        ${m.foto ? `<button class="foto-g" id="fg"><img src="${fotoG(m)}" alt=""/><span>toque para ampliar</span></button>` : ''}
        <h3>${esc(m.nome)}</h3>
        ${m.chamada ? `<div class="chamada">${esc(m.chamada)}</div>` : ''}
        ${m.descricao ? `<p class="d">${esc(m.descricao)}</p>` : ''}
        ${m.opcoes.length > 1 ? `<div class="rot">Qual?</div><div class="chips">${m.opcoes.map(o =>
          `<button class="chip ${o.cod===cod?'on':''}" data-cod="${o.cod}">${esc(o.rotulo)} · ${brl(o.preco)}</button>`).join('')}</div>` : ''}
        ${podePedir() ? pergs.map((pg, i) => `<div class="rot">${esc(pg.p)}</div><div class="chips">${pg.op.map((o, j) =>
          `<button class="chip ${resp[i]===o?'on':''}" data-perg="${i}" data-resp="${j}">${esc(o)}</button>`).join('')}</div>`).join('') : ''}
        ${podePedir() ? `<div class="rot">Quantos?</div>
          <div class="qtd"><button id="menos" aria-label="menos">−</button><span>${qtd}</span><button id="mais" aria-label="mais">+</button></div>
          <button class="pedir" id="seguir" ${falta() ? 'disabled' : ''}><span>${falta() ? 'Escolha acima' : 'Pedir'}</span><span>${brl(op.preco * qtd)}</span></button>`
        : (D.vitrine || D.eu.pulseira == null ? '' : `<div class="aviso">Sua conta já foi paga. Fale com o caixa para abrir de novo.</div>`)}`);
      const fg = $('#fg'); if (fg) fg.onclick = () => verFoto(m);
      document.querySelectorAll('[data-cod]').forEach(b => b.onclick = () => { cod = b.dataset.cod; pintar(); });
      if (!podePedir()) return;
      const fol = $('#folha'), topo = () => fol.scrollTop;
      document.querySelectorAll('[data-perg]').forEach(b => b.onclick = () => {
        const y = topo(); resp[+b.dataset.perg] = pergs[+b.dataset.perg].op[+b.dataset.resp]; pintar(); fol.scrollTop = y; });
      $('#menos').onclick = () => { const y = topo(); if (qtd > 1) { qtd--; pintar(); fol.scrollTop = y; } };
      $('#mais').onclick = () => { const y = topo(); if (qtd < 10) { qtd++; pintar(); fol.scrollTop = y; } };
      $('#seguir').onclick = () => { if (falta()) return; passo = 2; pintar(); };
      return;
    }
    // passo 2: onde receber
    const b = bistroAtual();
    const opcoes = m.tipo === 'comida'
      ? [['bistro', b ? `Na bistrô ${b}` : 'Na minha mesa bistrô', 'o garçom leva até você'],
         ['baixo', 'Retiro no Bar do 1º piso', 'a gente avisa aqui e no WhatsApp quando ficar pronta'],
         ['cima', 'Retiro ao lado do Bar do 2º piso', 'a gente avisa aqui e no WhatsApp quando ficar pronta']]
      : [['bistro', b ? `Na bistrô ${b}` : 'Na minha mesa bistrô', 'o garçom leva até você'],
         ['baixo', 'Pego no Bar do 1º piso', 'mostre o voucher no balcão'],
         ['cima', 'Pego no Bar do 2º piso', 'mostre o voucher no balcão']];
    abrirFolha(`
      <div class="volta-linha"><button class="voltar" id="voltar">Voltar</button><span>${qtd}<span class="vz">×</span> ${esc(nomeOp)}</span></div>
      <h3 style="margin-top:6px">${m.tipo === 'comida' ? 'Onde entregamos?' : 'Onde você quer receber?'}</h3>
      <div class="ondes">${opcoes.map(([k, t, s]) => `<button class="onde-op ${entrega===k?'on':''}" data-onde="${k}"><b>${t}</b><small>${s}</small></button>`).join('')}</div>
      ${entrega === 'bistro' ? bistroHtml() : ''}
      ${m.tipo === 'comida' ? '<p class="d" style="margin-top:10px">Quer comer sentada? Desça para o 1º piso e peça a um garçom.</p>' : ''}
      <button class="pedir" id="pedir" ${podeConfirmar() ? '' : 'disabled'}><span>${enviando ? 'Enviando…' : 'Confirmar ' + qtd + '<span class="vz">×</span> ' + esc(op.rotulo && m.opcoes.length > 1 ? op.rotulo : m.nome)}</span><span>${brl(op.preco * qtd)}</span></button>
      <div id="msg"></div>`);
    $('#voltar').onclick = () => { passo = 1; pintar(); };
    document.querySelectorAll('[data-onde]').forEach(x => x.onclick = () => {
      entrega = x.dataset.onde;
      if (entrega !== 'bistro' && m.tipo === 'bebida') { bar = entrega; try { localStorage.setItem('festa_bar', bar); } catch {} }
      pintar();
    });
    ligarBistro(pintar);
    $('#pedir').onclick = async () => {
      if (enviando || !podeConfirmar()) return;
      enviando = true; $('#pedir').disabled = true; $('#pedir span').textContent = 'Enviando…';
      try {
        const r = await rpc('ev_pedir', {p_token: token, p_item: m.id, p_cod: cod, p_qtd: qtd, p_local: null,
          p_retirar: entrega === 'bistro' ? null : entrega, p_bistro: entrega === 'bistro' ? bistroAtual() : null,
          p_escolhas: pergs.length ? resp : null});
        D = await rpc('ev_cliente', {p_token: token});
        desenhar();
        const p = D.conta.itens.find(x => x.voucher === r.voucher);
        abrirVoucher(p, true);
      } catch (e) {
        enviando = false; $('#pedir').disabled = false; $('#pedir span').textContent = 'Tentar de novo';
        const txt = {conta_ja_paga:'Sua conta já foi paga. Fale com o caixa para abrir de novo.',
                     sem_pulseira:'Falta a sua pulseira: fale com um garçom.',
                     evento_fechado:'Os pedidos pelo celular foram encerrados. Fale com um garçom.',
                     escolha_a_bistro:'Escolha a sua mesa bistrô.', escolha_o_bar:'Escolha onde vai pegar.',

/* leitor de QR na própria página (BarcodeDetector ou jsQR); o QR da mesa traz ?b=N */
async function lerQr(ok) {
  const v = document.createElement('div');
  v.className = 'leitor';
  v.innerHTML = `<video playsinline muted></video><div class="mira"></div>
    <p>Aponte para o QR da mesa</p><button class="bt creme" id="lq-x">Cancelar</button>`;
  document.body.appendChild(v);
  const video = v.querySelector('video');
  let stream = null, vivo = true;
  const fim = () => { vivo = false; if (stream) stream.getTracks().forEach(t => t.stop()); v.remove(); };
  v.querySelector('#lq-x').onclick = fim;
  const numero = txt => { const m = String(txt || '').match(/[?&]b=(\d{1,2})\b/) || String(txt || '').match(/^BISTRO-(\d{1,2})$/i); return m ? +m[1] : null; };
  try {
    stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}, audio: false});
    video.srcObject = stream; await video.play();
  } catch (e) {
    v.querySelector('p').textContent = 'Não consegui abrir a câmera. Toque no número da plaquinha.';
    return;
  }
  let detector = null;
  if ('BarcodeDetector' in window) { try { detector = new BarcodeDetector({formats: ['qr_code']}); } catch {} }
  if (!detector && !window.jsQR) {
    await new Promise(r => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js'; s.onload = r; s.onerror = r; document.head.appendChild(s); });
  }
  const cv = document.createElement('canvas'), cx = cv.getContext('2d', {willReadFrequently: true});
  const passo = async () => {
    if (!vivo) return;
    let txt = null;
    try {
      if (detector) { const r = await detector.detect(video); if (r[0]) txt = r[0].rawValue; }
      else if (window.jsQR && video.videoWidth) {
        cv.width = video.videoWidth; cv.height = video.videoHeight; cx.drawImage(video, 0, 0);
        const r = jsQR(cx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height); if (r) txt = r.data;
      }
    } catch {}
    const n = numero(txt);
    if (n) { if (navigator.vibrate) navigator.vibrate(40); fim(); ok(n); return; }
    if (txt) v.querySelector('p').textContent = 'Esse QR não é de uma mesa bistrô.';
    setTimeout(passo, 220);
  };
  passo();
}

function carregarFolhas() {
  if (folhasImg) return Promise.resolve(folhasImg);

  return new Promise(r => { const i = new Image(); i.onload = () => {

/* ---------- rosto (MediaPipe): carrega uma vez, só quando pedem coroa ou onça ---------- */

    x.rotate(Math.PI * 2 / 5);
    const g = x.createRadialGradient(0, -r * .55, r * .05, 0, -r * .55, r * .7);
    g.addColorStop(0, '#fff3d6'); g.addColorStop(.35, cor); g.addColorStop(1, cor);

  const rx = f.larg * .62, ry = f.larg * .34, cores = ['#E2483D', '#F27A3A', '#E85D9A', '#F2B33D', '#D9502E', '#F06B8B', '#E2483D'];

/* letras das molduras: as do convite (Cinzel em caixa alta, pincel Kaushan, Alegreya no miúdo) */
const LETRAS = {t: p => `600 ${Math.round(p * .62)}px Cinzel, "Trajan Pro", Georgia, serif`, s: p => `${p}px "Kaushan Script", cursive`,
                x: p => `700 ${p}px Alegreya, Georgia, serif`, caixa: s => s};
const letrasCam = () => LETRAS;
/* a arte do convite em quatro tiras (em cima, embaixo e os lados): vira a moldura "Convite" */
let conviteImgs = null;
function carregarConvite() {
  if (conviteImgs) return conviteImgs;
  const um = n => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = `img/convite-${n}.jpg`; });
  conviteImgs = Promise.all(['topo', 'base', 'esq', 'dir'].map(um)).then(l => l.every(Boolean) ? l : (conviteImgs = null, null));
  return conviteImgs;
}
function molduraConvite(x, W, H, imgs) {
  const [topo, base, esq, dir] = imgs, k = W / 1068;            // tudo na escala do convite (1068 px de largura)
  const ht = Math.round(250 * k), hb = Math.round(173 * k), ls = Math.round(118 * k);
  const o = document.createElement('canvas'); o.width = W; o.height = H;
  const ox = o.getContext('2d');
  /* os lados: a tira inteira, esticada só no comprido entre a faixa de cima e a de baixo */
  const lh = H - ht - hb + 4;
  ox.drawImage(esq, 0, ht - 2, ls, lh); ox.drawImage(dir, W - ls, ht - 2, ls, lh);
  ox.drawImage(topo, 0, 0, W, ht); ox.drawImage(base, 0, H - hb, W, hb);
  /* a janela da foto: some com a borda macia, como a luz entrando pelas folhas */
  ox.globalCompositeOperation = 'destination-out';
  const jx = ls * .62, jy = ht * .58, jw = W - jx * 2, jh = H - jy - hb * .92, r = 18;
  ox.shadowColor = '#000'; ox.shadowBlur = Math.round(W * .035);
  ox.beginPath(); ox.roundRect ? ox.roundRect(jx, jy, jw, jh, r) : ox.rect(jx, jy, jw, jh); ox.fill();
  ox.shadowBlur = 0; ox.globalCompositeOperation = 'source-over';
  x.drawImage(o, 0, 0);
  /* o fio de ouro do convite, recuado, por cima de tudo */
  x.save(); x.strokeStyle = 'rgba(226,190,112,.9)'; x.lineWidth = Math.max(2, Math.round(2.2 * k));
  const m = Math.round(20 * k); x.strokeRect(m, m, W - m * 2, H - m * 2); x.restore();
  /* o nome, no meio escuro da faixa de baixo */
  const L = LETRAS, ouro = x.createLinearGradient(0, H - hb, 0, H - hb * .25);
  ouro.addColorStop(0, '#F7DF9E'); ouro.addColorStop(.55, '#E0B45C'); ouro.addColorStop(1, '#A8782E');
  x.save(); x.textAlign = 'center'; x.textBaseline = 'middle';
  x.shadowColor = 'rgba(0,0,0,.85)'; x.shadowBlur = 14;
  x.fillStyle = ouro; x.font = L.t(Math.round(55 * k * 1.6));
  if ('letterSpacing' in x) x.letterSpacing = Math.round(3 * k) + 'px';
  x.fillText('JARDIM DO ÉDER', W / 2, H - hb * .6);
  if ('letterSpacing' in x) x.letterSpacing = '0px';
  x.fillStyle = '#F1DBA5'; x.font = L.x(Math.round(24 * k * 1.25));
  x.fillText('27 · 11 · 26   ·   @spesso.rio', W / 2, H - hb * .27);
  x.restore();
}
/* molduras: folhas da selva em volta (a arte do convite), a fita creme do convite ou polaroid */
async function desenharMoldura(x, m) {
  const W = x.canvas.width, H = x.canvas.height;
  const L = letrasCam();
  try { await Promise.race([Promise.all([L.t(80), L.s(40), L.x(30)].map(f => document.fonts.load(f, 'JARDIM DO ÉDER Jardim'))),
                            new Promise(r => setTimeout(r, 1500))]); } catch {}
  if (m === 'convite') {
    const imgs = await carregarConvite();
    if (imgs) return molduraConvite(x, W, H, imgs);
    m = 'folhas';                                                // sem a arte (rede), as folhas seguram
  }
  if (m === 'folhas') {
    const img = await carregarFolhas();
    if (img) {
      const o = document.createElement('canvas'); o.width = W; o.height = H;
      const ox = o.getContext('2d');
      const tile = (ix, iy, iw, ih, dx, dy, dw, dh) => ox.drawImage(img, ix, iy, iw, ih, dx, dy, dw, dh);
      const iw = img.width, ih = img.height, topo = W * .375, base = W * .25;
      tile(0, 0, iw, ih * .42, 0, 0, W, topo);                          // copa em cima
      tile(0, ih * .62, iw, ih * .38, 0, H - base, W, base);            // folhagem embaixo
      tile(0, ih * .2, iw * .2, ih * .6, 0, topo * .8, W * .16, H - topo * .8 - base * .8);
      tile(iw * .8, ih * .2, iw * .2, ih * .6, W * .84, topo * .8, W * .16, H - topo * .8 - base * .8);
      ox.globalCompositeOperation = 'destination-out';
      const g = ox.createRadialGradient(W / 2, H * .5, W * .36, W / 2, H * .5, W * .47 * Math.max(1, H / W * .8));
      g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      ox.fillStyle = g; ox.fillRect(0, 0, W, H);
      x.drawImage(o, 0, 0);
    }
    const sombra = x.createLinearGradient(0, H - 380, 0, H);
    sombra.addColorStop(0, 'rgba(6,20,12,0)'); sombra.addColorStop(1, 'rgba(6,20,12,.75)');
    x.fillStyle = sombra; x.fillRect(0, H - 380, W, 380);
    x.save();
    x.fillStyle = '#F4E8CB'; x.textAlign = 'center';
    x.shadowColor = 'rgba(0,0,0,.75)'; x.shadowBlur = 18;
    x.font = L.t(108); x.fillText('Jardim do Éder', W / 2, H - 92);
    x.font = L.x(30); x.fillStyle = '#F3C766';
    x.fillText(L.caixa('@spesso.rio  ·  27·11·26'), W / 2, H - 38);
    x.restore();
  } else if (PELES[m]) {
    desenharFeras(x, W, H, m);
  } else if (m === 'fita') {
    x.save();
    x.translate(W / 2, H - 150); x.rotate(-0.035);
    const fw = W * .84, fh = 118;
    x.shadowColor = 'rgba(0,0,0,.45)'; x.shadowBlur = 24; x.shadowOffsetY = 8;
    x.fillStyle = '#F4E8CB';
    x.beginPath();
    x.moveTo(-fw / 2, -fh / 2); x.lineTo(fw / 2, -fh / 2); x.lineTo(fw / 2 - 30, 0); x.lineTo(fw / 2, fh / 2);
    x.lineTo(-fw / 2, fh / 2); x.lineTo(-fw / 2 + 30, 0); x.closePath(); x.fill();
    x.shadowColor = 'transparent';
    x.fillStyle = '#3A2312'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = L.s(64); x.fillText('Solte suas feras', 0, -6);
    x.restore();
    x.save(); x.fillStyle = '#F4E8CB'; x.textAlign = 'center'; x.shadowColor = 'rgba(0,0,0,.7)'; x.shadowBlur = 14;
    x.font = L.x(30); x.fillText(L.caixa('Jardim do Éder  ·  @spesso.rio'), W / 2, H - 42);
    x.restore();
  } else if (m === 'polaroid') {
    const lado = 54, cima = 54, baixo = H * .17;
    x.save();
    x.fillStyle = '#FBF7EE';
    x.beginPath(); x.rect(0, 0, W, H); x.rect(lado, cima, W - lado * 2, H - cima - baixo); x.fill('evenodd');
    x.strokeStyle = 'rgba(0,0,0,.08)'; x.lineWidth = 2; x.strokeRect(lado, cima, W - lado * 2, H - cima - baixo);
    x.fillStyle = '#3A2312'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = L.s(Math.round(baixo * .36)); x.fillText('Jardim do Éder', W / 2, H - baixo * .58);
    x.font = L.x(Math.round(baixo * .15)); x.fillStyle = '#8a5a12';
    x.fillText(L.caixa('27 · 11 · 26   @spesso.rio'), W / 2, H - baixo * .22);
    x.restore();
  } else {
    x.save(); x.fillStyle = 'rgba(244,232,203,.92)'; x.textAlign = 'right'; x.shadowColor = 'rgba(0,0,0,.6)'; x.shadowBlur = 10;
    x.font = L.x(28); x.fillText(L.caixa('Jardim do Éder · @spesso.rio'), W - 34, H - 34);
    x.restore();
  }
}

/* molduras Feras: a pele do bicho em volta da foto ("Solte suas feras", o drink da casa).
   fundo: 3 cores do pelo (centro → borda); manchas: rosetas (onças) ou listras (tigre, zebra). */
const PELES = {
  feras:   {fundo: ['#E7B454', '#D29A3C', '#A8701F'], miolo: 'rgba(150,88,24,.75)', mancha: '#2B1A0D', tipo: 'rosetas'},
  rosa:    {fundo: ['#F7C3D2', '#EC98B3', '#CF6A8C'], miolo: 'rgba(205,98,138,.7)', mancha: '#3D1427', tipo: 'rosetas'},
  pantera: {fundo: ['#2E2925', '#1E1A17', '#0D0B0A'], miolo: 'rgba(58,50,42,.9)', mancha: 'rgba(0,0,0,.9)', tipo: 'rosetas', fio: '#C9A04A'},
  tigre:   {fundo: ['#F2A445', '#E27D22', '#B65A12'], mancha: '#1E120A', tipo: 'listras'},
  zebra:   {fundo: ['#FBF8F1', '#F2EDE2', '#E3DCCD'], mancha: '#141110', tipo: 'listras', grossa: 1.35},
};
function desenharFeras(x, W, H, qual) {
  const pele = PELES[qual] || PELES.feras;
  const lado = Math.round(W * .055), cima = lado, baixo = Math.round(H * .15), r = 26;
  const jx = lado, jy = cima, jw = W - lado * 2, jh = H - cima - baixo;      // a janela da foto
  const janela = c => { c.beginPath(); c.roundRect ? c.roundRect(jx, jy, jw, jh, r) : c.rect(jx, jy, jw, jh); };
  const o = document.createElement('canvas'); o.width = W; o.height = H;
  const ox = o.getContext('2d');
  /* pelo: dourado, mais quente no meio, mais escuro nas bordas */
  const g = ox.createRadialGradient(W / 2, H / 2, W * .2, W / 2, H / 2, Math.max(W, H) * .75);
  g.addColorStop(0, pele.fundo[0]); g.addColorStop(.6, pele.fundo[1]); g.addColorStop(1, pele.fundo[2]);
  ox.fillStyle = g; ox.fillRect(0, 0, W, H);
  if (pele.tipo === 'listras') listras(ox, W, H, pele); else rosetas(ox, W, H, pele);
  /* abre a janela da foto */
  ox.globalCompositeOperation = 'destination-out';
  janela(ox); ox.fill();
  ox.globalCompositeOperation = 'source-over';
  /* sombra para dentro da foto e um fio dourado em volta, para a pele não "colar" na foto */
  x.save();
  janela(x); x.clip();
  x.shadowColor = 'rgba(0,0,0,.55)'; x.shadowBlur = 30;
  x.lineWidth = 40; x.strokeStyle = 'rgba(0,0,0,.55)'; janela(x); x.stroke();
  x.restore();
  x.drawImage(o, 0, 0);
  x.save(); x.lineWidth = 4; x.strokeStyle = pele.fio || '#F3C766'; janela(x); x.stroke(); x.restore();
  /* faixa de baixo: escurece a pele para o texto respirar */
  const fx = x.createLinearGradient(0, H - baixo, 0, H);
  fx.addColorStop(0, 'rgba(30,16,6,.35)'); fx.addColorStop(1, 'rgba(30,16,6,.7)');
  x.fillStyle = fx; x.fillRect(0, H - baixo + 8, W, baixo - 8);
  x.save();
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.shadowColor = 'rgba(0,0,0,.8)'; x.shadowBlur = 16;
  const L = letrasCam();
  x.fillStyle = '#F4E8CB'; x.font = L.s(Math.round(baixo * .42));
  x.fillText('Solte suas feras', W / 2, H - baixo * .56);
  x.font = L.x(Math.round(baixo * .15)); x.fillStyle = '#F3C766';
  x.fillText(L.caixa('Jardim do Éder  ·  @spesso.rio  ·  27·11·26'), W / 2, H - baixo * .18);
  x.restore();
}

function rosetas(ox, W, H, pele) {
  /* rosetas: miolo ocre e um anel quebrado de manchas escuras; a semente fixa faz a pele ser sempre a mesma */
  let s = 7;
  const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  const passo = W * .085;
  for (let yy = -passo; yy < H + passo; yy += passo * .86) {
    for (let xx = -passo; xx < W + passo; xx += passo) {
      const cx = xx + (rnd() - .5) * passo * .7 + (Math.round(yy / passo) % 2 ? passo / 2 : 0);
      const cy = yy + (rnd() - .5) * passo * .6;
      const rr = passo * (.26 + rnd() * .14);
      if (rnd() < .2) {                                                     // pinta solta, pequena
        ox.fillStyle = pele.mancha; ox.beginPath();
        ox.ellipse(cx, cy, rr * .3, rr * .24, rnd() * 3, 0, Math.PI * 2); ox.fill(); continue;
      }
      ox.fillStyle = pele.miolo; ox.beginPath();
      ox.ellipse(cx, cy, rr * .72, rr * .6, rnd() * 3, 0, Math.PI * 2); ox.fill();
      const n = 4 + Math.floor(rnd() * 3), a0 = rnd() * Math.PI * 2;
      ox.fillStyle = pele.mancha;
      for (let k = 0; k < n; k++) {
        const a = a0 + k * Math.PI * 2 / n + (rnd() - .5) * .5;
        ox.beginPath();
        ox.ellipse(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * .9, rr * (.36 + rnd() * .16), rr * (.2 + rnd() * .08),
                   a + Math.PI / 2, 0, Math.PI * 2);
        ox.fill();
      }
    }
}
}
/* listras: entram de cada borda para dentro, onduladas, afinando na ponta e de tamanhos diferentes (como no bicho) */
function listras(ox, W, H, pele) {
  let s = 11;
  const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  const gr = pele.grossa || 1, banda = W * .055, fundoBaixo = H * .15;
  const lados = [                                      // origem na borda, direção para dentro, ao longo da borda, profundidade
    {o: (u) => [u * W, -10], in: [0, 1], comp: W, fundo: banda},
    {o: (u) => [u * W, H + 10], in: [0, -1], comp: W, fundo: fundoBaixo},
    {o: (u) => [-10, u * H], in: [1, 0], comp: H, fundo: banda},
    {o: (u) => [W + 10, u * H], in: [-1, 0], comp: H, fundo: banda},
  ];
  ox.fillStyle = pele.mancha;
  for (const L of lados) {
    const passo = W * .052 * gr;
    for (let d = -passo; d < L.comp + passo; d += passo * (.75 + rnd() * .5)) {
      const [x0, y0] = L.o(d / L.comp), [ix, iy] = L.in, px = -iy, py = ix;   // perp = ao longo da borda
      const len = (L.fundo + 10) * (.55 + rnd() * .9);
      const w = passo * (.32 + rnd() * .22) * (gr > 1 ? 1.15 : 1);
      const amp = passo * (.12 + rnd() * .2), fase = rnd() * 6, incl = (rnd() - .5) * .6, passos = 16;
      const pt = (f, lado) => {
        const meio = Math.sin(f * Math.PI * 1.4 + fase) * amp + incl * f * len;
        const hw = (w / 2) * Math.pow(1 - f, .7) * (lado);
        return [x0 + ix * f * len + px * (meio + hw), y0 + iy * f * len + py * (meio + hw)];
      };
      ox.beginPath();
      for (let i = 0; i <= passos; i++) { const [x, y] = pt(i / passos, 1); i ? ox.lineTo(x, y) : ox.moveTo(x, y); }
      for (let i = passos; i >= 0; i--) { const [x, y] = pt(i / passos, -1); ox.lineTo(x, y); }
      ox.closePath(); ox.fill();
      if (rnd() < .25) {                               // às vezes a listra se divide (garfo), como no tigre
        const f0 = .35 + rnd() * .2, [bx, by] = pt(f0, 0), l2 = len * (1 - f0) * .7, ang = (rnd() < .5 ? 1 : -1) * .5;
        const dx = ix * Math.cos(ang) - iy * Math.sin(ang), dy = ix * Math.sin(ang) + iy * Math.cos(ang);
        ox.beginPath(); ox.moveTo(bx - dy * w * .25, by + dx * w * .25);
        ox.quadraticCurveTo(bx + dx * l2 * .5, by + dy * l2 * .5 + amp * .3, bx + dx * l2, by + dy * l2);
        ox.lineTo(bx + dy * w * .25, by - dx * w * .25); ox.closePath(); ox.fill();
      }
    }
  }
}

/* ---------------------------------------------------------------- a festa dela no Spesso
   Renato 25/11: "usar o app pra apresentar um convite pra pessoa fazer uma festa conosco ... uma pré-reserva
   sem compromisso; aí conseguiríamos vários leads". Cai na fila de Orçamentos da casa (sql/666). Uma pergunta
   por tela; nome e WhatsApp ela não digita. O "quero novidades" é um sim separado (LGPD). */
const MESES_PR = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const TIPOS_FESTA = ['Aniversário', 'Casamento ou noivado', 'Empresa', 'Outra comemoração'];
const FAIXAS_FESTA = [['Até 20 pessoas', 20], ['De 20 a 50', 35], ['De 50 a 100', 75], ['Mais de 100', 120]];
function conviteFestaHtml() {
  if (!D || D.vitrine) return '';
  const nome = esc((D.eu.nome || '').split(' ')[0]), pr = EXTRA.pre_reserva;
  if (pr) return `<div class="convite-festa feito"><div class="it" style="font-size:30px">La tua festa</div>
      <p>Sua pré-reserva está com a gente: <b>${esc(pr.tipo || '')}</b>${pr.data ? ' · ' + pr.data.split('-').reverse().join('/') : ''}.
      A equipe te chama no WhatsApp nos próximos dias.</p>
      <button class="bt linha" id="abrir-pre">Mudar a pré-reserva</button></div>`;
  const mes = EXTRA.aniv_mes ? MESES_PR[EXTRA.aniv_mes - 1] : null;
  return `<div class="convite-festa"><div class="it" style="font-size:34px">La prossima festa</div>
      <h3>${nome}, a próxima pode ser a sua.</h3>
      <p>${mes ? `Seu aniversário é em ${mes}. ` : ''}Faça uma pré-reserva sem compromisso: três perguntas, e a gente te chama para montar tudo.</p>
      <button class="bt ouro" id="abrir-pre">Fazer a minha pré-reserva</button></div>`;
}
function ligarConviteFesta() { const b = $('#abrir-pre'); if (b) b.onclick = abrirPreReserva; }
function abrirPreReserva() {
  const R = {tipo: null, mes: null, ano: null, data: null, faixa: null, pessoas: null};
  let passo = 1, enviando = false;
  const hoje = new Date(), nome = esc((D.eu.nome || '').split(' ')[0]);
  const meses = Array.from({length: 12}, (_, i) => { const d = new Date(hoje.getFullYear(), hoje.getMonth() + 1 + i, 1);
    return {m: d.getMonth() + 1, a: d.getFullYear()}; });
  const pintar = () => {
    let h = '';
    if (passo > 1 && passo < 5) h += `<div class="volta-linha"><button class="voltar" id="pr-volta">Voltar</button>
      <span>${passo === 4 ? 'Quase lá' : `Pré-reserva · ${passo} de 3`}</span></div>`;
    if (passo === 1) h += `<div class="it pr-tit">La tua festa</div><h3 class="pr-q">Que festa, ${nome}?</h3>
      <div class="pr-ops">${TIPOS_FESTA.map(x => `<button class="pr-op" data-v="${x}">${x}</button>`).join('')}</div>
      <p class="d" style="margin-top:12px">Sem compromisso. A equipe confirma a data e te chama para montar tudo.</p>`;
    if (passo === 2) h += `<h3 class="pr-q">Quando?</h3>
      <div class="pr-meses">${meses.map(x => `<button class="pr-op mes ${EXTRA.aniv_mes === x.m && R.tipo === 'Aniversário' ? 'sugerido' : ''}" data-m="${x.m}" data-a="${x.a}">
        ${MESES_PR[x.m - 1]}<small>${x.a}</small></button>`).join('')}</div>
      <label class="pr-dia">Já sei o dia <input type="date" id="pr-data" min="${hoje.toISOString().slice(0, 10)}"/></label>`;
    if (passo === 3) h += `<h3 class="pr-q">Quantas pessoas?</h3>
      <div class="pr-ops">${FAIXAS_FESTA.map(x => `<button class="pr-op" data-f="${x[0]}" data-p="${x[1]}">${x[0]}</button>`).join('')}</div>`;
    if (passo === 4) h += `<h3 class="pr-q">Quer receber convites e novidades do Spesso no WhatsApp?</h3>
      <p class="d">Festas, cardápios novos e as fotos desta noite. Sem spam, e você sai quando quiser.</p>
      <div class="pr-ops"><button class="pr-op" data-nov="1">Sim, quero</button><button class="pr-op" data-nov="0">Agora não</button></div>`;
    if (passo === 5) h += `<div class="it pr-tit palavra" style="font-size:48px">Grazie mille!</div>
      <h3 class="pr-q">A sua pré-reserva está com a gente.</h3>
      <p class="d">${esc(R.tipo)} · ${R.data ? R.data.split('-').reverse().join('/') : MESES_PR[R.mes - 1] + ' de ' + R.ano} · ${esc(R.faixa)}.<br/>
        A equipe te chama no WhatsApp nos próximos dias. Sem compromisso.</p>
      <button class="bt ouro" style="padding:14px;width:100%;margin-top:16px" id="pr-ok">Voltar para a festa</button>`;
    abrirFolha(`<div class="voucher pre-reserva">${h}<div id="pr-msg"></div></div>`);
    const vb = $('#pr-volta'); if (vb) vb.onclick = () => { passo -= 1; if (passo === 4 && EXTRA.novidades != null) passo = 3; pintar(); };
    document.querySelectorAll('.pre-reserva [data-v]').forEach(b => b.onclick = () => { R.tipo = b.dataset.v; passo = 2; pintar(); });
    document.querySelectorAll('.pre-reserva [data-m]').forEach(b => b.onclick = () => { R.mes = +b.dataset.m; R.ano = +b.dataset.a; R.data = null; passo = 3; pintar(); });
    const di = $('#pr-data'); if (di) di.onchange = () => { if (!di.value) return; R.data = di.value; R.mes = null; R.ano = null; passo = 3; pintar(); };
    document.querySelectorAll('.pre-reserva [data-f]').forEach(b => b.onclick = () => { R.faixa = b.dataset.f; R.pessoas = +b.dataset.p;
      if (EXTRA.novidades == null) { passo = 4; pintar(); } else enviar(); });
    document.querySelectorAll('.pre-reserva [data-nov]').forEach(b => b.onclick = async () => {
      const sim = b.dataset.nov === '1';
      try { await rpc('ev_novidades', {p_token: token, p_sim: sim}); EXTRA.novidades = sim; } catch {}
      enviar();
    });
    const ok = $('#pr-ok'); if (ok) ok.onclick = () => { fecharFolha(); desenhar(); };
  };
  async function enviar() {
    if (enviando) return; enviando = true;
    try {
      await rpc('ev_pre_reserva', {p_token: token, p_tipo: R.tipo, p_data: R.data, p_mes: R.mes, p_ano: R.ano,
                                   p_pessoas: R.pessoas, p_faixa: R.faixa});
      await carregarExtra();
      passo = 5; pintar();
    } catch (e) {
      enviando = false;
      $('#pr-msg').innerHTML = `<div class="aviso">${e.codigo === 'data_passada' ? 'Essa data já passou. Escolha outra.' : 'Não consegui enviar. Confira a internet e tente de novo.'}</div>`;
    }
  }
  pintar();
}

/* aniversário (dia e mês): para convidar a fazer a festa dela aqui */
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
let anivPulou = false; try { anivPulou = !!sessionStorage.getItem('festa_aniv_pulou'); } catch {}
function anivHtml() {
  if (!D || D.vitrine || D.eu.tem_aniversario || anivPulou) return '';
  return `<div class="aniv" id="aniv"><div class="rot">Quando é o seu aniversário?</div>
    <p class="d" style="margin:0 0 10px">Só dia e mês. A gente adora fazer festa e quer te chamar para a sua.</p>
    <div class="sel"><select id="aniv-d" aria-label="dia"><option value="">dia</option>${Array.from({length:31},(_,i)=>`<option>${i+1}</option>`).join('')}</select>
    <select id="aniv-m" aria-label="mês"><option value="">mês</option>${MESES.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('')}</select></div>
    <div style="display:flex;gap:8px;margin-top:10px"><button class="bt ouro" id="aniv-ok">Salvar</button><button class="bt linha" id="aniv-nao">Agora não</button></div>
    <div id="aniv-msg"></div></div>`;
}
function ligarAniv() {
  if (!$('#aniv')) return;
  $('#aniv-nao').onclick = () => { anivPulou = true; try { sessionStorage.setItem('festa_aniv_pulou', '1'); } catch {} $('#aniv').remove(); };
  $('#aniv-ok').onclick = async () => {
    const d = +$('#aniv-d').value, m = +$('#aniv-m').value;
    if (!d || !m) { $('#aniv-msg').innerHTML = '<div class="aviso">Escolha o dia e o mês.</div>'; return; }
    try {
      await rpc('ev_cliente_aniversario', {p_token: token, p_dia: d, p_mes: m});
      D.eu.tem_aniversario = true; EXTRA.aniv_dia = d; EXTRA.aniv_mes = m;
      $('#aniv').innerHTML = `<p style="margin:0">Anotado: <b>${d} de ${MESES[m-1]}</b>. Grazie!</p>`;
    } catch (e) {
      $('#aniv-msg').innerHTML = `<div class="aviso">${e.codigo === 'data_invalida' ? 'Essa data não existe. Confira o dia.' : 'Não consegui salvar. Tente de novo.'}</div>`;
    }
  };
}

function qrSvg(texto) {
  const q = qrcode(0, 'M'); q.addData(texto); q.make();
  return q.createSvgTag({cellSize: 6, margin: 2, scalable: true});
}
function abrirVoucher(p, novo) {
  if (!p) return;
  const onde = p.bistro ? `O garçom leva até a bistrô ${p.bistro}`
             : (p.tipo === 'comida' && p.pelo_garcom) ? 'O garçom leva até você'
             : (p.tipo === 'comida' && p.retirar) ? 'Retire ' + retiraComida(p.retirar)
             : p.retirar ? `Retire no ${nomeBar(p.retirar)}` : (p.tipo === 'bebida' ? 'Mostre no bar' : 'Mostre a um garçom');
  const instr = p.bistro ? 'Já está sendo preparado.' : (p.tipo === 'comida' ? 'A gente avisa quando ficar pronta.' : 'Mostre este bilhete no balcão.');
  abrirFolha(`<div class="voucher ${novo ? 'novo' : ''}">
    ${novo ? `<p class="it vou-ok palavra">Perfetto!</p><p class="vou-sub">${instr}</p>` : ''}
    <div class="bilhete ${p.entregue ? 'entregue' : ''}">
      <div class="b-casa">SPESSO · JARDIM DO ÉDER</div>
      <div class="b-nome">${pn()}</div>
      <div class="b-mesa">MESA ${D.eu.pulseira}</div>
      <div class="b-item">${p.qtd}<span class="vz">×</span> ${esc(p.nome)}</div>
      ${p.entregue ? '<div class="carimbo">Entregue</div>' : `<div class="qr">${qrSvg(EQUIPE + 'V-' + p.voucher)}</div>`}
      <div class="b-cod">${p.voucher}</div>
      <div class="corte"></div>
      <div class="b-onde">${esc(onde)}</div>
    </div>
    <div style="display:grid;gap:8px;margin-top:16px">
      ${p.entregue ? '' : `<button class="bt ouro" style="padding:16px;font-size:18px" id="recebi">${BOTAO_RECEBI(p)}</button>`}
      <button class="bt" style="padding:12px;color:var(--texto-2)" id="ok">Fechar</button>
    </div></div>`);
  $('#ok').onclick = fecharFolha;
  const rb = $('#recebi'); if (rb) rb.onclick = () => confirmarRecebi(p);
}

async function pedirConta() {
  try {
    const r = await rpc('ev_pedir_conta', {p_token: token});
    D = await rpc('ev_cliente', {p_token: token});
    desenhar();
    const c = r.conta;
    abrirFolha(`<div class="voucher">
      <div class="onde">Mostre ao caixa</div>
      <div class="qr">${qrSvg(EQUIPE + 'C-' + r.conta_codigo)}</div>
      <div class="cod">${r.conta_codigo}</div>
      <h3 style="margin-top:10px">Total ${brl(c.total)}</h3>
      ${c.falta_minimo > 0 ? `<p class="d">Inclui o complemento da consumação mínima: ${brl(c.falta_minimo)}.</p>` : ''}
      <div class="quem">Mesa ${D.eu.pulseira} · ${esc(D.eu.nome.split(' ')[0])}</div>
      <p class="d" style="margin-top:10px">Se pedir mais alguma coisa, a conta reabre sozinha.</p>
      <button class="bt linha" style="padding:12px;margin-top:16px;width:100%" id="ok">Fechar</button></div>`);
    $('#ok').onclick = fecharFolha;
  } catch (e) {
    abrirFolha(`<div class="aviso">Não consegui pedir a conta. Confira a internet e tente de novo.</div>
      <button class="bt linha" style="padding:12px;margin-top:16px;width:100%" onclick="fecharFolha()">Fechar</button>`);
  }
}

/* atualiza sozinho (status do voucher, conta) sem atrapalhar quem está escolhendo */
setInterval(() => {
  if (document.hidden || !token || !D || D.vitrine) return;
  const folhaAberta = !$('#folha').classList.contains('oculto');
  const y = window.scrollY;
  rpc('ev_cliente', {p_token: token}).then(d => {
    if (folhaAberta) { D = d; checarProntos(); return; }
    const mudou = JSON.stringify(d) !== JSON.stringify(D);
    const virou = D && D.eu && (D.eu.pulseira !== d.eu.pulseira || D.eu.liberada !== d.eu.liberada);
    D = d;
    if (virou) { desenhar(); window.scrollTo(0, y); return; } $('#rede').classList.add('oculto');
    const escolhendo = document.activeElement && document.activeElement.closest && document.activeElement.closest('#aniv');
    if (mudou && aba !== 'cardapio' && !escolhendo) {
      const ad = $('#aniv-d') ? $('#aniv-d').value : '', am = $('#aniv-m') ? $('#aniv-m').value : '';
      desenhar(); window.scrollTo(0, y);
      if ($('#aniv-d')) { $('#aniv-d').value = ad; $('#aniv-m').value = am; }
    }
    else if (mudou) { desenharConsumo(); }
    checarProntos();
  }).catch(() => $('#rede').classList.remove('oculto'));
}, 8000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && D) carregar(); });
window.addEventListener('online', carregar);

carregar();
