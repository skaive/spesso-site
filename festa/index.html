<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Jardim do Éder · Spesso</title>
<meta name="description" content="Jardim do Éder: solte suas feras. Peça bebidas e pratos pelo celular."/>
<meta name="theme-color" content="#0B2216"/>
<meta name="color-scheme" content="dark"/>
<meta name="robots" content="noindex"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐆</text></svg>"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;0,800;1,500&family=Alegreya+SC:wght@700&family=Kaushan+Script&family=Pinyon+Script&display=swap" rel="stylesheet"/>
<style>
:root{
  --selva:#0B2216; --selva-2:#113021; --selva-3:#18402C; --linha:#2A5A40;
  --creme:#F4E8CB; --creme-2:#E9D8AE; --tinta:#3A2312; --ouro:#E0A93F; --ouro-2:#F3C766;
  --brasa:#D9502E; --texto:#F4EBD6; --texto-2:#BFD0BF; --ok:#7FD39A; --erro:#FF8A6B;
  --raio:18px; --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{background:var(--selva);}
body{font-family:'Alegreya',Georgia,serif;color:var(--texto);background:var(--selva);min-height:100dvh;
  font-size:17px;line-height:1.4;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;}
img{display:block;max-width:100%;}
.oculto{display:none!important;}

/* ---------- topo compacto (Renato 24/11: a paisagem ocupava a tela; Beber/Comer logo de cara) ---------- */
.topo{position:relative;height:104px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;overflow:hidden;isolation:isolate;}
.topo .bg{position:absolute;inset:0;z-index:-2;background:var(--selva) url(img/selva.jpg) center 38%/cover no-repeat;}
.topo::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(11,34,22,.25),rgba(11,34,22,.7) 70%,var(--selva));}
.topo h1{font-family:'Pinyon Script',cursive;font-weight:400;color:var(--creme);font-size:clamp(30px,9.4vw,40px);white-space:nowrap;line-height:1.1;text-shadow:0 2px 12px rgba(0,0,0,.6);}
.topo .marca{font-family:'Alegreya SC',serif;letter-spacing:.26em;font-size:11px;color:var(--ouro-2);margin-top:4px;}
.eu{flex:none;display:flex;align-items:center;gap:8px;background:rgba(11,34,22,.82);
  border:1px solid var(--linha);border-radius:999px;padding:5px 12px 5px 5px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.eu .num{background:var(--ouro);color:var(--tinta);font-weight:800;border-radius:999px;min-width:36px;height:36px;
  display:grid;place-items:center;font-size:17px;padding:0 8px;}
.eu .q{font-size:12px;line-height:1.1;color:var(--texto-2);} .eu .q b{display:block;font-size:15px;color:var(--creme);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ---------- Beber / Comer ---------- */
.lados{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px 0;}
.lado{position:relative;height:108px;border-radius:var(--raio);overflow:hidden;border:2px solid var(--linha);
  box-shadow:0 6px 18px rgba(0,0,0,.3);transition:transform .14s ease-out;}
.lado:active{transform:scale(.97);}
.lado img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.lado::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,20,12,.1),rgba(6,20,12,.85));}
.lado b{position:absolute;left:14px;bottom:10px;z-index:1;font-family:'Kaushan Script',cursive;font-weight:400;font-size:32px;color:var(--creme);line-height:1;}
.lado.on{border-color:var(--ouro);}
.lado.on b{color:var(--ouro-2);}
.dica{margin:12px 16px 0;font-size:15px;color:var(--texto-2);}
.dica b{color:var(--creme);}

/* ---------- foto grande ---------- */
.lupa{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;}
.lupa img{max-width:100%;max-height:78dvh;border-radius:14px;object-fit:contain;}
.lupa .lg{margin-top:14px;color:var(--creme);font-size:19px;font-weight:700;text-align:center;}
.lupa .lg small{display:block;font-weight:400;font-size:13px;color:var(--texto-2);margin-top:4px;}
.foto-g{display:block;position:relative;width:calc(100% + 36px);margin:-4px -18px 14px;height:240px;overflow:hidden;background:var(--selva);}
.foto-g img{width:100%;height:100%;object-fit:cover;}
.foto-g span{position:absolute;right:10px;bottom:10px;font-size:12px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:4px 10px;}

/* ---------- onde receber + mesa bistrô ---------- */
.voltar{color:var(--ouro-2);font-size:15px;padding:4px 0;}
.ondes{display:grid;gap:8px;margin-top:14px;}
.onde-op{display:block;text-align:left;width:100%;border:2px solid var(--linha);border-radius:16px;padding:12px 14px;}
.onde-op b{display:block;font-size:18px;color:var(--creme);}
.onde-op small{font-size:14px;color:var(--texto-2);}
.onde-op.on{border-color:var(--ouro);background:rgba(224,169,63,.12);}
.onde-op.on b{color:var(--ouro-2);}
.bistro{margin-top:14px;padding:14px;border-radius:16px;background:rgba(0,0,0,.18);}
.bistro.ok{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:18px;color:var(--creme);}
.bistro.ok b{color:var(--ouro-2);font-size:22px;}
.bistro .escanear{width:100%;padding:14px;font-size:17px;}
.grade{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.grade button{height:48px;border-radius:12px;border:1px solid var(--linha);font-size:19px;font-weight:800;color:var(--creme);}
.grade button.on{background:var(--ouro);color:var(--tinta);border-color:var(--ouro);}
.leitor{position:fixed;inset:0;z-index:70;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 16px calc(24px + var(--sab));}
.leitor video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.leitor .mira{position:absolute;left:50%;top:42%;width:min(66vw,260px);aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid var(--ouro);border-radius:22px;box-shadow:0 0 0 2000px rgba(0,0,0,.45);}
.leitor p{position:relative;color:#fff;font-size:17px;margin-bottom:14px;text-align:center;}
.leitor .bt{position:relative;padding:12px 28px;}
.voucher .cod-g{font-family:ui-monospace,Menlo,monospace;font-weight:800;letter-spacing:.14em;font-size:44px;color:var(--creme);margin-top:6px;line-height:1;}
.ped .acoes{flex-wrap:wrap;}

/* ---------- categorias ---------- */
.cats{position:sticky;top:0;z-index:5;background:rgba(11,34,22,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--linha);margin-top:16px;}
.cats .in{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;}
.cats .in::-webkit-scrollbar{display:none;}
.cats a{flex:none;text-decoration:none;color:var(--texto-2);font-size:15px;padding:7px 14px;border-radius:999px;border:1px solid var(--linha);}
.cats a.on{background:var(--creme);color:var(--tinta);border-color:var(--creme);font-weight:700;}

.secao{padding:22px 16px 4px;scroll-margin-top:62px;}
.secao h2{display:inline-block;font-family:'Alegreya SC',serif;font-size:15px;letter-spacing:.14em;color:var(--tinta);
  background:var(--creme);padding:6px 18px 7px;margin:0 0 12px -16px;border-radius:0 999px 999px 0;}
.item{width:100%;display:flex;gap:14px;align-items:flex-start;text-align:left;padding:14px 0;border-bottom:1px solid rgba(42,90,64,.6);}
.item:active{background:rgba(255,255,255,.03);}
.item .foto{flex:none;width:86px;height:86px;border-radius:14px;overflow:hidden;background:var(--selva-2);}
.item .foto img{width:100%;height:100%;object-fit:cover;}
.item .tx{flex:1;min-width:0;}
.item h3{font-size:18px;font-weight:700;line-height:1.2;color:var(--creme);}
.item .chamada{font-style:italic;color:var(--ouro-2);font-size:15.5px;margin-top:2px;}
.item p{font-size:14.5px;color:var(--texto-2);margin-top:3px;}
.item .pr{margin-top:6px;display:flex;align-items:center;gap:10px;font-weight:800;color:var(--ouro);}
.item .mais{margin-left:auto;flex:none;width:34px;height:34px;border-radius:50%;background:var(--ouro);color:var(--tinta);
  display:grid;place-items:center;font-size:24px;font-weight:800;line-height:1;align-self:center;}

/* ---------- meus pedidos ---------- */
.titulo-bloco{font-family:'Kaushan Script',cursive;font-size:26px;color:var(--creme);padding:22px 16px 6px;}
.vazio{padding:10px 16px 0;color:var(--texto-2);}
.ped{margin:10px 16px 0;background:var(--selva-2);border:1px solid var(--linha);border-radius:var(--raio);padding:12px 14px;
  display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;}
.ped .n{font-weight:700;color:var(--creme);}
.ped .st{font-size:14px;color:var(--texto-2);}
.ped .st.ok{color:var(--ok);} .ped .st.vivo{color:var(--ouro-2);}
.ped .acoes{grid-column:1/-1;display:flex;gap:8px;margin-top:6px;}
.bt{border-radius:999px;padding:9px 16px;font-weight:700;font-size:15px;}
.bt.ouro{background:var(--ouro);color:var(--tinta);}
.bt.linha{border:1px solid var(--linha);color:var(--creme);}
.bt.creme{background:var(--creme);color:var(--tinta);}
.bt:active{transform:scale(.97);}

/* ---------- conta ---------- */
.conta{margin:10px 16px 0;background:var(--creme);color:var(--tinta);border-radius:var(--raio);padding:16px 16px 18px;}
.conta .l{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:16px;}
.conta .l.t{border-top:1px dashed rgba(58,35,18,.35);margin-top:8px;padding-top:10px;font-size:20px;font-weight:800;}
.conta .nota{font-size:14px;margin-top:8px;color:#6B4A2E;}

/* ---------- barra de baixo ---------- */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(9,27,17,.97);border-top:1px solid var(--linha);
  padding:8px 12px calc(8px + var(--sab));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
.consumo{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--texto-2);padding:0 4px 8px;}
.consumo .trilho{flex:1;height:6px;border-radius:9px;background:var(--selva-3);overflow:hidden;}
.consumo .trilho i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ouro),var(--ouro-2));transition:width .5s cubic-bezier(.2,.8,.2,1);}
.consumo b{color:var(--creme);}
.nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.nav button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 4px;border-radius:12px;font-size:13px;color:var(--texto-2);}
.nav button b{font-size:16px;color:var(--creme);}
.nav button.on{background:var(--selva-3);}
.nav button.on b{color:var(--ouro-2);}
.espaco{height:calc(170px + var(--sab));}
.dona{display:flex;align-items:center;gap:8px;padding:0 4px 8px;min-width:0;}
.dona .num{flex:none;background:var(--ouro);color:var(--tinta);font-weight:800;border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-size:15px;padding:0 7px;}
.dona b{font-size:17px;color:var(--creme);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.dona small{margin-left:auto;flex:none;font-size:12px;color:var(--texto-2);}
.insta{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 16px 0;}
.insta .bt{padding:11px 10px;font-size:15px;text-align:center;text-decoration:none;}
/* ---------- câmera da festa ---------- */
.camera{position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column;
  padding:calc(8px + env(safe-area-inset-top,0px)) 0 calc(10px + var(--sab));}
.cam-topo{display:flex;align-items:center;justify-content:space-between;padding:0 12px 8px;color:var(--creme);font-weight:700;}
.cam-topo .bt{padding:7px 14px;font-size:14px;}
.cam-quadro{position:relative;flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;}
.cam-quadro video,.cam-quadro .cam-molde,.cam-quadro .cam-foto{grid-area:1/1;width:100%;height:100%;max-height:100%;aspect-ratio:4/5;object-fit:cover;}
.cam-quadro video,.cam-quadro .cam-molde{width:auto;max-width:100%;}
.cam-quadro .cam-foto{object-fit:contain;}
.cam-quadro video.espelho{transform:scaleX(-1);}
.cam-aviso{grid-area:1/1;align-self:end;color:#fff;background:rgba(0,0,0,.6);padding:10px 14px;border-radius:12px;margin:12px;text-align:center;}
.cam-ops{padding:8px 0 0;}
.cam-linha{display:flex;gap:8px;overflow-x:auto;padding:4px 12px;scrollbar-width:none;}
.cam-linha::-webkit-scrollbar{display:none;}
.cam-linha button{flex:none;border:1px solid var(--linha);border-radius:999px;padding:8px 14px;font-size:15px;color:var(--creme);}
.cam-linha button.on{background:var(--creme);color:var(--tinta);border-color:var(--creme);font-weight:700;}
.cam-acoes{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px 0;}
.cam-acoes .bt{padding:12px 16px;}
.cam-galeria,.cam-vazio{width:110px;text-align:center;}
.cam-disparo{width:72px;height:72px;border-radius:50%;background:var(--creme);box-shadow:0 0 0 5px rgba(244,232,203,.35);}
.cam-disparo:active{transform:scale(.94);}
.cam-salvar{flex:1;font-size:17px;}

/* ---------- folhas (sheet) ---------- */
.veu{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);opacity:0;transition:opacity .2s;}
.veu.on{opacity:1;}
.folha{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--selva-2);border-top:1px solid var(--linha);
  border-radius:22px 22px 0 0;padding:10px 18px calc(18px + var(--sab));max-height:92dvh;overflow:auto;
  transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);}
.folha.on{transform:none;}
.folha .pega{width:44px;height:5px;border-radius:9px;background:var(--linha);margin:0 auto 12px;}
.folha h3{font-size:22px;color:var(--creme);line-height:1.15;}
.folha .chamada{font-style:italic;color:var(--ouro-2);margin-top:4px;}
.folha p.d{color:var(--texto-2);font-size:15px;margin-top:6px;}
.folha .rot{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--texto-2);margin:16px 0 8px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{border:1px solid var(--linha);border-radius:999px;padding:9px 14px;font-size:15.5px;color:var(--creme);}
.chip.on{background:var(--creme);color:var(--tinta);border-color:var(--creme);font-weight:700;}
.qtd{display:flex;align-items:center;gap:16px;}
.qtd button{width:44px;height:44px;border-radius:50%;border:1px solid var(--linha);font-size:24px;color:var(--creme);}
.qtd span{font-size:24px;font-weight:800;min-width:24px;text-align:center;}
.pedir{width:100%;margin-top:20px;background:var(--ouro);color:var(--tinta);border-radius:16px;padding:16px;font-size:19px;font-weight:800;
  display:flex;justify-content:space-between;align-items:center;}
.pedir:disabled{opacity:.6;}
.aviso{margin-top:12px;font-size:15px;border-radius:12px;padding:10px 12px;background:rgba(255,138,107,.12);color:var(--erro);}
.aviso.info{background:rgba(224,169,63,.12);color:var(--ouro-2);}

/* ---------- voucher ---------- */
.voucher{text-align:center;}
.voucher .qr{background:#fff;border-radius:18px;padding:14px;width:min(78vw,300px);margin:12px auto 10px;}
.voucher .qr svg,.voucher .qr img{width:100%;height:auto;display:block;}
.voucher .cod{font-family:ui-monospace,Menlo,monospace;letter-spacing:.2em;font-size:20px;color:var(--creme);}
.voucher .onde{font-family:'Kaushan Script',cursive;font-size:26px;color:var(--ouro-2);margin-top:4px;}
.voucher .quem{margin-top:6px;color:var(--texto-2);}
.voucher .usado{display:inline-block;margin-top:10px;padding:6px 14px;border-radius:999px;background:rgba(127,211,154,.15);color:var(--ok);font-weight:700;}

.convite{margin:16px 16px 0;padding:14px 16px;border-radius:16px;background:rgba(224,169,63,.12);border:1px solid rgba(224,169,63,.35);}
.folha .convite{margin:0;}
.convite b{color:var(--ouro-2);} .convite p{margin:4px 0 0;font-size:15px;line-height:1.35;}
.convite .bt{display:inline-block;margin-top:10px;text-decoration:none;}
.aniv{margin-top:16px;padding:14px;border-radius:14px;border:1px dashed var(--linha);text-align:left;}
.aniv .rot{margin:0 0 8px;} .aniv .sel{display:flex;gap:8px;}
.aniv select{flex:1;font:inherit;font-size:16px;padding:10px;border-radius:10px;background:rgba(255,255,255,.06);color:var(--creme);border:1px solid var(--linha);}
.aniv select option{color:#111;}
.erro-tela{padding:28vh 26px 0;text-align:center;}
.erro-tela h2{font-family:'Kaushan Script',cursive;font-size:30px;color:var(--creme);margin-bottom:10px;}
.carregando{padding:30vh 20px;text-align:center;color:var(--texto-2);}
.ver{font-size:11px;color:#4E7360;text-align:center;padding:24px 0 8px;}
.rede{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--brasa);color:#fff;text-align:center;font-size:14px;padding:6px calc(10px + env(safe-area-inset-right,0px)) 6px;padding-top:calc(6px + env(safe-area-inset-top,0px));}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>

<div id="app"><div class="carregando">Abrindo o seu cardápio…</div></div>

<div id="veu" class="veu oculto"></div>
<div id="folha" class="folha oculto" role="dialog" aria-modal="true"></div>

if ((token || B_URL) && location.search) history.replaceState(null, '', location.pathname);

let D = null;            // último ev_cliente
let aba = 'cardapio';    // cardapio | pedidos | conta
let lado = 'bebida';     // bebida | comida

async function carregar() {
  if (!token) return carregarVitrine();
  try {
    D = await rpc('ev_cliente', {p_token: token});
    $('#rede').classList.add('oculto');
    desenhar();
  } catch (e) {
    if (e.codigo === 'link_invalido') {
      try { localStorage.removeItem('festa_token'); } catch {}
      token = null;
      return carregarVitrine();
    }
    $('#rede').classList.remove('oculto');
    if (!D) telaErro('Sem conexão', 'Confira a internet do celular e toque para tentar de novo.', true);
  }
}
/* sem o link pessoal: o cardápio aparece para olhar; pedir só com o link */
async function carregarVitrine() {
  try {
    const r = await rpc('ev_cardapio_publico', {p_slug: SLUG});
    D = {vitrine: true, evento: r.evento, cardapio: r.cardapio, eu: null, conta: null};
    $('#rede').classList.add('oculto');
    desenhar();
  } catch (e) {
    telaErro('Sem conexão', 'Confira a internet do celular e toque para tentar de novo.', true);
  }
}
/* só pede quem abriu o próprio link (cada link é uma mesa). Sem link: cardápio para ver e o garçom.
   Renato 24/11: "cada link é de uma mesa e só pelo link o cliente pode pedir. como plano b, o cliente pede pro garçom." */
const podePedir = () => !!(D && !D.vitrine && D.eu.pulseira != null && !D.eu.liberada);
let avisouBistro = false;
function conviteHtml() {
  if (D.vitrine && B_URL) return `<div class="convite"><b>Mesa bistrô ${B_URL}</b>
      <p>Abra o seu link (a mensagem da Minerva no WhatsApp), escolha "Na minha mesa bistrô" e toque no <b>${B_URL}</b>. Sem o link? Peça a um garçom.</p></div>`;
  if (D.vitrine) return `<div class="convite"><b>Para pedir, use o seu link</b>
      <p>Na entrada, aponte a câmera para o QR: a Minerva abre a sua mesa no WhatsApp e te manda o seu link. Sem celular? Peça a um garçom.</p></div>`;
  if (B_URL && bistroAtual() === B_URL && !avisouBistro) { avisouBistro = true;
    return `<div class="convite"><b>Você está na mesa bistrô ${B_URL}</b><p>Peça pelo cardápio: o garçom traz aqui.</p></div>`; }
  if (D.eu.pulseira == null) return `<div class="convite"><b>Falta ligar a sua pulseira</b>
      <p>Fale com alguém da entrada ou com um garçom para ligar a sua pulseira a este link.</p></div>`;
  return '';
}
/* bebida: a convidada escolhe em qual bar pega (o papel sai na impressora daquele bar) */
const BARES = [['baixo', 'Bar do 1º piso'], ['cima', 'Bar do 2º piso']];
const nomeBar = k => (BARES.find(b => b[0] === k) || [k, 'bar'])[1];
let bar = null; try { bar = localStorage.getItem('festa_bar'); } catch {}
function telaErro(t, d, tentar) {
  $('#app').innerHTML = `<div class="erro-tela"><h2>${esc(t)}</h2><p>${esc(d)}</p>
    ${tentar ? '<p style="margin-top:18px"><button class="bt ouro" onclick="carregar()">Tentar de novo</button></p>' : ''}</div>`;
}

/* ---------------------------------------------------------------- desenho */
/* Renato 24/11: "a primeira tela precisa já aparecer os botões de comida e bebida ... a paisagem
   está ocupando demais ... mais funcional pra cliente já bêbada pedir com facilidade." */
function desenhar() {
  const eu = D.eu, conta = D.conta;
  const primeiroNome = eu ? (eu.nome || '').split(' ')[0] : '';
  if (D.vitrine) aba = 'cardapio';
  const ativos = conta ? conta.itens.filter(i => !i.entregue).length : 0;
  $('#app').innerHTML = `
    <header class="topo"><div class="bg"></div>
      <div class="tt"><h1>Jardim do Éder</h1><div class="marca">SPESSO · 27·11·26</div></div>
      ${eu && eu.pulseira != null ? `<div class="eu"><span class="num">${eu.pulseira}</span><span class="q">mesa<b>${esc(primeiroNome)}</b></span></div>` : ''}
    </header>
    ${conviteHtml()}
    <main id="corpo"></main>
    <div class="espaco"></div>
    <div class="ver">skv-versao ${VER}</div>
    ${D.vitrine ? '' : `<nav class="barra">
      <div class="dona"><span class="num">${eu.pulseira ?? '–'}</span><b>${esc(eu.nome)}</b><small>esta tela é sua</small></div>
      <div class="consumo" id="consumo"></div>
      <div class="nav">
        <button data-aba="cardapio"><b>Cardápio</b>pedir</button>
        <button data-aba="pedidos"><b>Pedidos${ativos ? ' · ' + ativos : ''}</b>vouchers</button>
        <button data-aba="conta"><b>${brl(conta.consumo + conta.servico)}</b>minha conta</button>
      </div>
    </nav>`}`;
  document.querySelectorAll('.nav button').forEach(b => {
    b.classList.toggle('on', b.dataset.aba === aba);
    b.onclick = () => { aba = b.dataset.aba; desenhar(); window.scrollTo({top: 0, behavior:'smooth'}); };
  });
  if (!D.vitrine) desenharConsumo();
  ({cardapio: desenharCardapio, pedidos: desenharPedidos, conta: desenharConta})[aba]();
}

function desenharConsumo() {
  const c = D.conta, el = $('#consumo');
  if (!c.minimo) { el.classList.add('oculto'); return; }
  const pct = Math.min(100, 100 * c.consumo / c.minimo);
  el.innerHTML = c.falta_minimo > 0
    ? `<span>Faltam <b>${brl(c.falta_minimo)}</b> da sua consumação</span><span class="trilho"><i style="width:${pct}%"></i></span>`
    : `<span>Consumação de <b>${brl(c.minimo)}</b> completa</span><span class="trilho"><i style="width:100%"></i></span>`;
}

const fotoP = m => m.foto ? `img/${esc(m.foto)}.jpg` : '';
const fotoG = m => m.foto ? (FOTOS_G.includes(m.foto) ? `img/g/${esc(m.foto)}.jpg` : `img/${esc(m.foto)}.jpg`) : '';
function desenharCardapio() {
  const itens = D.cardapio.filter(m => m.tipo === lado);
  const cats = [...new Set(itens.map(m => m.categoria))];
  $('#corpo').innerHTML = `
    <div class="lados">
      <button class="lado ${lado==='bebida'?'on':''}" data-lado="bebida"><img src="img/arara.jpg" alt=""/><b>Beber</b></button>
      <button class="lado ${lado==='comida'?'on':''}" data-lado="comida"><img src="img/onca.jpg" alt=""/><b>Comer</b></button>
    </div>
    <div class="insta">
      <button class="bt creme" id="foto-festa">📸 Foto da festa</button>
      <a class="bt linha" href="${INSTA}" target="_blank" rel="noopener">Seguir @spesso.rio</a>
    </div>
    <nav class="cats"><div class="in">${cats.map(c => `<a href="#c-${slug(c)}">${esc(c)}</a>`).join('')}</div></nav>
    ${lado === 'comida' && !D.vitrine ? `<p class="dica">A comida vai até a sua <b>mesa bistrô</b>. Sem bistrô? Peça a um garçom.</p>` : ''}
    ${cats.map(c => `<section class="secao" id="c-${slug(c)}"><h2>${esc(c)}</h2>
      ${itens.filter(m => m.categoria === c).map(itemHtml).join('')}</section>`).join('')}`;
  document.querySelectorAll('.lado').forEach(b => b.onclick = () => {
    lado = b.dataset.lado; desenharCardapio();
    window.scrollTo({top: $('.lados').offsetTop - 6, behavior: 'smooth'});
  });
  document.querySelectorAll('.item').forEach(b => b.onclick = () => abrirItem(+b.dataset.id));
  $('#foto-festa').onclick = abrirCamera;
  document.querySelectorAll('.item .foto').forEach(f => f.onclick = e => {
    e.stopPropagation(); const m = D.cardapio.find(x => x.id === +f.closest('.item').dataset.id); verFoto(m);
  });
  marcarCats();
}
function itemHtml(m) {
  const precos = m.opcoes.map(o => o.preco);
  const min = Math.min(...precos), max = Math.max(...precos);
  return `<button class="item" data-id="${m.id}">
    ${m.foto ? `<div class="foto"><img src="${fotoP(m)}" alt="" loading="lazy"/></div>` : ''}
    <div class="tx"><h3>${esc(m.nome)}</h3>
      ${m.chamada ? `<div class="chamada">${esc(m.chamada)}</div>` : ''}
      <div class="pr">${min === max ? brl(min) : 'a partir de ' + brl(min)}</div></div>
    <span class="mais" aria-hidden="true">+</span></button>`;
}
function marcarCats() {
  const links = [...document.querySelectorAll('.cats a')];
  if (!links.length) return;
  const io = new IntersectionObserver(es => es.filter(e => e.isIntersecting).forEach(e => {
    links.forEach(a => {
      const on = a.getAttribute('href') === '#' + e.target.id;
      a.classList.toggle('on', on);
      if (on) a.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
    });
  }), {rootMargin:'-70px 0px -70% 0px'});
  document.querySelectorAll('.secao').forEach(s => io.observe(s));
}
/* foto em tela cheia: toque para fechar */
function verFoto(m) {
  if (!m || !m.foto) return;
  const v = document.createElement('div');
  v.className = 'lupa';
  v.innerHTML = `<img src="${fotoG(m)}" alt="${esc(m.nome)}"/><div class="lg">${esc(m.nome)}<small>toque para fechar</small></div>`;
  v.onclick = () => v.remove();
  document.body.appendChild(v);
}

/* ---------- entrega: bistrô (garçom leva) ou retirada no bar ---------- */
function onde(p) {
  if (p.bistro) return `na bistrô ${p.bistro}`;
  if (p.retirar) return `no ${nomeBar(p.retirar)}`;
  return '';
}
const STATUS = p => {
  if (p.entregue) return [p.entregue_por === 'cliente' ? 'Você confirmou que recebeu' : 'Entregue', 'ok'];
  if (p.bistro) return [p.garcom ? `${p.garcom.split(' ')[0]} está levando até a bistrô ${p.bistro}` : `Preparando · o garçom leva até a bistrô ${p.bistro}`, 'vivo'];
  if (p.retirar) return [`Retire no ${nomeBar(p.retirar)} com o voucher`, 'vivo'];
  if (p.tipo === 'comida') return [p.garcom ? `Com ${p.garcom.split(' ')[0]}, que vai levar até você` : 'Na cozinha', 'vivo'];
  return ['Retire no bar com o voucher', 'vivo'];
};
const BOTAO_RECEBI = p => p.bistro ? 'Recebi' : 'Peguei';
function desenharPedidos() {
  const its = [...D.conta.itens].reverse();
  $('#corpo').innerHTML = `<div class="titulo-bloco">Meus pedidos</div>
    ${its.length ? '' : '<p class="vazio">Nada pedido ainda. Toque em Cardápio e escolha o primeiro.</p>'}
    ${its.map(p => { const [t, c] = STATUS(p); return `<div class="ped ${p.entregue ? 'feito' : ''}">
      <div><div class="n">${p.qtd}× ${esc(p.nome)}</div><div class="st ${c}">${esc(t)}</div></div>
      <div>${brl(p.qtd * p.preco)}</div>
      <div class="acoes">
        ${p.entregue ? '' : `<button class="bt ouro" data-v="${p.voucher}">Ver voucher</button>
          <button class="bt creme" data-recebi="${p.voucher}">✓ ${BOTAO_RECEBI(p)}</button>`}
        <button class="bt linha" data-de-novo="${p.id}">Pedir de novo</button>
      </div></div>`; }).join('')}`;
  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => {
    const p = D.conta.itens.find(x => x.voucher === b.dataset.v); abrirVoucher(p);
  });
  document.querySelectorAll('[data-recebi]').forEach(b => b.onclick = () => {
    const p = D.conta.itens.find(x => x.voucher === b.dataset.recebi); confirmarRecebi(p);
  });
  document.querySelectorAll('[data-de-novo]').forEach(b => b.onclick = () => {
    const p = D.conta.itens.find(x => String(x.id) === b.dataset.deNovo);
    const m = D.cardapio.find(m => p.nome.startsWith(m.nome));
    if (!m) return;
    const op = m.opcoes.find(o => p.nome === m.nome + (o.rotulo ? ' · ' + o.rotulo : '')) || m.opcoes[0];
    abrirItem(m.id, op.cod, p.qtd);
  });
}

function desenharConta() {
  const c = D.conta, eu = D.eu;
  if (eu.liberada) {
    $('#corpo').innerHTML = `<div class="titulo-bloco">Conta paga</div>
      <div class="conta"><p>Obrigada por virar fera com a gente, ${esc(eu.nome.split(' ')[0])}! 🐆</p>
      <p class="nota">Marque <b>@spesso.rio</b> nas suas fotos. A gente adora rever essa noite.</p>${anivHtml()}</div>`;
    ligarAniv();
    return;
  }
  const linhas = c.itens.map(p => `<div class="l"><span>${p.qtd}× ${esc(p.nome)}</span><span>${brl(p.qtd*p.preco)}</span></div>`).join('');
  $('#corpo').innerHTML = `<div class="titulo-bloco">Minha conta</div>
    <div class="conta">
      ${linhas || '<p>Nada pedido ainda.</p>'}
      <div class="l t" style="font-size:16px;font-weight:700"><span>Consumo</span><span>${brl(c.consumo)}</span></div>
      <div class="l"><span>Serviço (${String(c.servico_pct).replace('.',',')}%)</span><span>${brl(c.servico)}</span></div>
      ${c.falta_minimo > 0 ? `<div class="l"><span>Complemento da consumação</span><span>${brl(c.falta_minimo)}</span></div>` : ''}
      <div class="l t"><span>Total</span><span>${brl(c.total)}</span></div>
      ${c.falta_minimo > 0 ? `<p class="nota">A consumação mínima da festa é ${brl(c.minimo)} por pessoa. Faltam <b>${brl(c.falta_minimo)}</b>: dá para trocar o complemento por mais um drink ou um prato.</p>` : ''}
    </div>
    <div style="padding:18px 16px 0;display:grid;gap:10px">
      ${c.falta_minimo > 0 ? `<button class="bt ouro" style="padding:14px" id="usar">Usar os ${brl(c.falta_minimo)} que faltam</button>` : ''}
      <button class="bt ${c.falta_minimo > 0 ? 'linha' : 'ouro'}" style="padding:14px" id="fechar">${eu.conta_pedida ? 'Mostrar o QR da conta' : 'Fechar a conta'}</button>
    </div>`;
  const u = $('#usar'); if (u) u.onclick = () => { aba = 'cardapio'; desenhar(); };
  $('#fechar').onclick = pedirConta;
}

/* ---------------------------------------------------------------- folhas */
function abrirFolha(html) {
  const f = $('#folha'), v = $('#veu');
  f.innerHTML = '<div class="pega"></div>' + html;
  f.classList.remove('oculto'); v.classList.remove('oculto');
  f.scrollTop = 0;
  requestAnimationFrame(() => { f.classList.add('on'); v.classList.add('on'); });
  v.onclick = fecharFolha;
}
function fecharFolha() {
  const f = $('#folha'), v = $('#veu');
  f.classList.remove('on'); v.classList.remove('on');
  setTimeout(() => { f.classList.add('oculto'); v.classList.add('oculto'); }, 260);
}

/* pedido em dois passos: 1) o quê e quantos  2) onde receber + confirmar */
function abrirItem(id, codIni, qtdIni) {
  const m = D.cardapio.find(x => x.id === id); if (!m) return;
  let cod = codIni || m.opcoes[0].cod, qtd = qtdIni || 1, passo = 1, enviando = false;
  let entrega = m.tipo === 'comida' ? (bistroAtual() ? 'bistro' : null)
              : (bistroAtual() ? 'bistro' : (bar || null));
  const pintar = () => {
    const op = m.opcoes.find(o => o.cod === cod);
    const nomeOp = m.nome + (op.rotulo && m.opcoes.length > 1 ? ' · ' + op.rotulo : '');
    if (passo === 1) {
      abrirFolha(`
        ${m.foto ? `<button class="foto-g" id="fg"><img src="${fotoG(m)}" alt=""/><span>toque para ampliar</span></button>` : ''}
        <h3>${esc(m.nome)}</h3>
        ${m.chamada ? `<div class="chamada">${esc(m.chamada)}</div>` : ''}
        ${m.descricao ? `<p class="d">${esc(m.descricao)}</p>` : ''}
        ${m.opcoes.length > 1 ? `<div class="rot">Qual?</div><div class="chips">${m.opcoes.map(o =>
          `<button class="chip ${o.cod===cod?'on':''}" data-cod="${o.cod}">${esc(o.rotulo)} · ${brl(o.preco)}</button>`).join('')}</div>` : ''}
        ${podePedir() ? `<div class="rot">Quantos?</div>
          <div class="qtd"><button id="menos" aria-label="menos">−</button><span>${qtd}</span><button id="mais" aria-label="mais">+</button></div>
          <button class="pedir" id="seguir"><span>Pedir</span><span>${brl(op.preco * qtd)}</span></button>`
        : (D.vitrine || D.eu.pulseira == null ? '' : `<div class="aviso">Sua conta já foi paga. Fale com o caixa para abrir de novo.</div>`)}`);
      const fg = $('#fg'); if (fg) fg.onclick = () => verFoto(m);
      document.querySelectorAll('[data-cod]').forEach(b => b.onclick = () => { cod = b.dataset.cod; pintar(); });
      if (!podePedir()) return;
      $('#menos').onclick = () => { if (qtd > 1) { qtd--; pintar(); } };
      $('#mais').onclick = () => { if (qtd < 10) { qtd++; pintar(); } };
      $('#seguir').onclick = () => { passo = 2; pintar(); };
      return;
    }
    // passo 2: onde receber
    const b = bistroAtual();
    const opcoes = m.tipo === 'comida'
      ? [['bistro', b ? `Na bistrô ${b}` : 'Na minha mesa bistrô', 'o garçom leva até você']]
      : [['bistro', b ? `Na bistrô ${b}` : 'Na minha mesa bistrô', 'o garçom leva até você'],
         ['baixo', 'Pego no Bar do 1º piso', 'mostre o voucher no balcão'],
         ['cima', 'Pego no Bar do 2º piso', 'mostre o voucher no balcão']];
    abrirFolha(`
      <button class="voltar" id="voltar">‹ ${esc(nomeOp)}</button>
      <h3 style="margin-top:6px">${m.tipo === 'comida' ? 'Onde entregamos?' : 'Onde você quer receber?'}</h3>
      <div class="ondes">${opcoes.map(([k, t, s]) => `<button class="onde-op ${entrega===k?'on':''}" data-onde="${k}"><b>${t}</b><small>${s}</small></button>`).join('')}</div>
      ${entrega === 'bistro' ? bistroHtml() : ''}
      ${m.tipo === 'comida' ? '<p class="d" style="margin-top:10px">Sem mesa bistrô? Chame um garçom: ele anota o seu pedido.</p>' : ''}
      <button class="pedir" id="pedir" ${podeConfirmar() ? '' : 'disabled'}><span>${enviando ? 'Enviando…' : 'Confirmar ' + qtd + '× ' + esc(op.rotulo && m.opcoes.length > 1 ? op.rotulo : m.nome)}</span><span>${brl(op.preco * qtd)}</span></button>
      <div id="msg"></div>`);
    $('#voltar').onclick = () => { passo = 1; pintar(); };
    document.querySelectorAll('[data-onde]').forEach(x => x.onclick = () => {
      entrega = x.dataset.onde;
      if (entrega !== 'bistro') { bar = entrega; try { localStorage.setItem('festa_bar', bar); } catch {} }
      pintar();
    });
    ligarBistro(pintar);
    $('#pedir').onclick = async () => {
      if (enviando || !podeConfirmar()) return;
      enviando = true; $('#pedir').disabled = true; $('#pedir span').textContent = 'Enviando…';
      try {
        const r = await rpc('ev_pedir', {p_token: token, p_item: m.id, p_cod: cod, p_qtd: qtd, p_local: null,
          p_retirar: entrega === 'bistro' ? null : entrega, p_bistro: entrega === 'bistro' ? bistroAtual() : null});
        D = await rpc('ev_cliente', {p_token: token});
        desenhar();
        const p = D.conta.itens.find(x => x.voucher === r.voucher);
        abrirVoucher(p, true);
      } catch (e) {
        enviando = false; $('#pedir').disabled = false; $('#pedir span').textContent = 'Tentar de novo';
        const txt = {conta_ja_paga:'Sua conta já foi paga. Fale com o caixa para abrir de novo.',
                     sem_pulseira:'Falta a sua pulseira: fale com um garçom.',
                     evento_fechado:'Os pedidos pelo celular foram encerrados. Fale com um garçom.',
                     escolha_a_bistro:'Escolha a sua mesa bistrô.', escolha_o_bar:'Escolha onde vai pegar.',
                     bistro_invalida:'Essa mesa bistrô não existe. Confira o número na plaquinha.',
                     sem_preco:'Esse item saiu do cardápio agora. Escolha outro, por favor.'}[e.codigo]
          || 'Não consegui enviar. O pedido NÃO foi feito. Confira a internet e toque em "Tentar de novo".';
        $('#msg').innerHTML = `<div class="aviso">${esc(txt)}</div>`;
      }
    };
  };
  const podeConfirmar = () => entrega === 'bistro' ? !!bistroAtual() : !!entrega;
  pintar();
}

/* ---------- mesa bistrô: QR da mesa (câmera) ou o número da plaquinha ---------- */
function bistroAtual() {
  try {
    const b = JSON.parse(localStorage.getItem('festa_bistro') || 'null');
    if (b && Date.now() - b.em < 3 * 3600e3) return b.n;
  } catch {}
  return null;
}
function guardarBistro(n) { try { localStorage.setItem('festa_bistro', JSON.stringify({n, em: Date.now()})); } catch {} }
let trocarBistro = false;
function bistroHtml() {
  const b = bistroAtual(), tot = (D.evento && D.evento.bistros) || 15;
  if (b && !trocarBistro) return `<div class="bistro ok"><span>Mesa bistrô <b>${b}</b> ✓</span><button class="bt linha" id="trocar-b">Trocar</button></div>`;
  return `<div class="bistro">
    <button class="bt ouro escanear" id="escanear">📷 Ler o QR da mesa</button>
    <div class="rot" style="margin-top:12px">ou toque no número da plaquinha</div>
    <div class="grade">${Array.from({length: tot}, (_, i) => `<button class="${b===i+1?'on':''}" data-bistro="${i+1}">${i+1}</button>`).join('')}</div>
  </div>`;
}
function ligarBistro(pintar) {
  document.querySelectorAll('[data-bistro]').forEach(x => x.onclick = () => { guardarBistro(+x.dataset.bistro); trocarBistro = false; pintar(); });
  const e = $('#escanear'); if (e) e.onclick = () => lerQr(n => { guardarBistro(n); trocarBistro = false; pintar(); });

/* leitor de QR na própria página (BarcodeDetector ou jsQR); o QR da mesa traz ?b=N */
async function lerQr(ok) {
  const v = document.createElement('div');
  v.className = 'leitor';
  v.innerHTML = `<video playsinline muted></video><div class="mira"></div>
    <p>Aponte para o QR da mesa</p><button class="bt creme" id="lq-x">Cancelar</button>`;
  document.body.appendChild(v);
  const video = v.querySelector('video');
  let stream = null, vivo = true;
  const fim = () => { vivo = false; if (stream) stream.getTracks().forEach(t => t.stop()); v.remove(); };
  v.querySelector('#lq-x').onclick = fim;
  const numero = txt => { const m = String(txt || '').match(/[?&]b=(\d{1,2})\b/) || String(txt || '').match(/^BISTRO-(\d{1,2})$/i); return m ? +m[1] : null; };
  try {
    stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}, audio: false});
    video.srcObject = stream; await video.play();
  } catch (e) {
    v.querySelector('p').textContent = 'Não consegui abrir a câmera. Toque no número da plaquinha.';
    return;
  }
  let detector = null;
  if ('BarcodeDetector' in window) { try { detector = new BarcodeDetector({formats: ['qr_code']}); } catch {} }
  if (!detector && !window.jsQR) {
    await new Promise(r => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js'; s.onload = r; s.onerror = r; document.head.appendChild(s); });
  }
  const cv = document.createElement('canvas'), cx = cv.getContext('2d', {willReadFrequently: true});
  const passo = async () => {
    if (!vivo) return;
    let txt = null;
    try {
      if (detector) { const r = await detector.detect(video); if (r[0]) txt = r[0].rawValue; }
      else if (window.jsQR && video.videoWidth) {
        cv.width = video.videoWidth; cv.height = video.videoHeight; cx.drawImage(video, 0, 0);
        const r = jsQR(cx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height); if (r) txt = r.data;
      }
    } catch {}
    const n = numero(txt);
    if (n) { if (navigator.vibrate) navigator.vibrate(40); fim(); ok(n); return; }
    if (txt) v.querySelector('p').textContent = 'Esse QR não é de uma mesa bistrô.';
    setTimeout(passo, 220);
  };
  passo();
}

/* ---------------------------------------------------------------- foto da festa
   Renato 24/11: "no mesmo lugar que ela bebe ela posta". Câmera dentro do app, filtro e moldura da
   festa; a foto sai em 1080×1350 (feed e story do Instagram) e vai para a galeria ou direto para o
   Instagram pelo compartilhar do celular. Nada sobe para o servidor: a foto é só dela. */
const INSTA = 'https://www.instagram.com/spesso.rio/';
const FILTROS = [
  ['natural', 'Natural', 'none'],
  ['dourado', 'Pôr do sol', 'sepia(.35) saturate(1.35) contrast(1.05) brightness(1.04)'],
  ['selva', 'Selva', 'saturate(1.5) contrast(1.12) hue-rotate(-8deg)'],
  ['pb', 'P&B', 'grayscale(1) contrast(1.15) brightness(1.05)'],
];
const MOLDURAS = [['folhas', 'Folhas'], ['fita', 'Fita'], ['limpa', 'Sem moldura']];
/* o Safari do iPhone não aplica ctx.filter: testa de verdade (pinta vermelho em cinza e lê de volta) */
const FILTRO_CANVAS = (() => { try {
  const c = document.createElement('canvas'); c.width = c.height = 2; const x = c.getContext('2d');
  x.filter = 'grayscale(1)'; x.fillStyle = '#f00'; x.fillRect(0, 0, 2, 2);
  const d = x.getImageData(0, 0, 1, 1).data; return Math.abs(d[0] - d[1]) < 30;
} catch { return false; } })();
function filtrarPixels(x, k) {
  const W = x.canvas.width, H = x.canvas.height, im = x.getImageData(0, 0, W, H), d = im.data;
  const cont = (v, c) => (v - 128) * c + 128;
  for (let i = 0; i < d.length; i += 4) {
    let r = d[i], g = d[i + 1], b = d[i + 2];
    const l = .299 * r + .587 * g + .114 * b;
    if (k === 'pb') { r = g = b = cont(l, 1.15) * 1.05; }
    else if (k === 'dourado') {
      const sr = .393 * r + .769 * g + .189 * b, sg = .349 * r + .686 * g + .168 * b, sb = .272 * r + .534 * g + .131 * b;
      r = r * .65 + sr * .35; g = g * .65 + sg * .35; b = b * .65 + sb * .35;
      const l2 = .299 * r + .587 * g + .114 * b;
      r = cont(l2 + (r - l2) * 1.35, 1.05) * 1.04; g = cont(l2 + (g - l2) * 1.35, 1.05) * 1.04; b = cont(l2 + (b - l2) * 1.35, 1.05) * 1.04;
    } else if (k === 'selva') {
      r = cont(l + (r - l) * 1.5, 1.12); g = cont(l + (g - l) * 1.5, 1.12); b = cont(l + (b - l) * 1.5, 1.12);
    }
    d[i] = r; d[i + 1] = g; d[i + 2] = b;
  }
  x.putImageData(im, 0, 0);
}
let folhasImg = null;
function carregarFolhas() {
  if (folhasImg) return Promise.resolve(folhasImg);
  /* a arte tem fundo verde-escuro liso: vira transparente pelo brilho (folhas e flores ficam) */
  return new Promise(r => { const i = new Image(); i.onload = () => {
    const c = document.createElement('canvas'); c.width = i.width; c.height = i.height;
    const x = c.getContext('2d'); x.drawImage(i, 0, 0);
    const im = x.getImageData(0, 0, c.width, c.height), d = im.data;
    for (let k = 0; k < d.length; k += 4) {
      const l = .299 * d[k] + .587 * d[k + 1] + .114 * d[k + 2];
      const s = Math.max(d[k], d[k + 1], d[k + 2]) - Math.min(d[k], d[k + 1], d[k + 2]);
      const v = Math.max(l, d[k] * .9, s * .55);           // flor vermelha e folha clara ficam
      d[k + 3] = Math.max(0, Math.min(255, (v - 52) * 255 / 28));
    }
    x.putImageData(im, 0, 0); folhasImg = c; r(c); }; i.onerror = () => r(null); i.src = 'img/folhas.jpg'; });
}

async function abrirCamera() {
  const v = document.createElement('div');
  v.className = 'camera';
  v.innerHTML = `
    <div class="cam-topo"><button class="bt linha" id="cam-x">Fechar</button><span>Foto da festa</span><button class="bt linha" id="cam-virar">↺ Virar</button></div>
    <div class="cam-quadro"><video playsinline muted autoplay></video><canvas class="cam-molde"></canvas><img class="cam-foto oculto" alt=""/></div>
    <div class="cam-ops">
      <div class="cam-linha" id="cam-filtros">${FILTROS.map(([k, n]) => `<button data-f="${k}" class="${k === 'dourado' ? 'on' : ''}">${n}</button>`).join('')}</div>
      <div class="cam-linha" id="cam-molduras">${MOLDURAS.map(([k, n]) => `<button data-m="${k}" class="${k === 'folhas' ? 'on' : ''}">${n}</button>`).join('')}</div>
    </div>
    <div class="cam-acoes" id="cam-acoes"></div>`;
  document.body.appendChild(v);
  const video = v.querySelector('video'), molde = v.querySelector('.cam-molde'), fotoEl = v.querySelector('.cam-foto');
  let filtro = 'dourado', moldura = 'folhas', frente = true, stream = null, origem = null; // origem: imagem fixa (galeria / foto tirada)
  const W = 1080, H = 1350;

  const parar = () => { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; };
  const fechar = () => { parar(); v.remove(); };
  v.querySelector('#cam-x').onclick = fechar;

  async function ligar() {
    parar();
    try {
      stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: frente ? 'user' : 'environment', width: {ideal: 1440}, height: {ideal: 1920}}, audio: false});
      video.srcObject = stream; await video.play();
      video.classList.toggle('espelho', frente);
    } catch (e) {
      v.querySelector('.cam-quadro').insertAdjacentHTML('beforeend', '<p class="cam-aviso">Não consegui abrir a câmera. Toque em "Da galeria" para escolher uma foto.</p>');
    }
  }
  /* desenha a moldura por cima da câmera ao vivo (o filtro vai por CSS no vídeo) */
  async function pintarMolde() {
    molde.width = W; molde.height = H;
    const cx = molde.getContext('2d'); cx.clearRect(0, 0, W, H);
    await desenharMoldura(cx, moldura);
    const f = FILTROS.find(x => x[0] === filtro)[2];
    video.style.filter = f === 'none' ? '' : f;
    fotoEl.style.filter = '';
  }
  v.querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
    filtro = b.dataset.f; v.querySelectorAll('[data-f]').forEach(x => x.classList.toggle('on', x === b));
    origem ? montarFinal() : pintarMolde();
  });
  v.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    moldura = b.dataset.m; v.querySelectorAll('[data-m]').forEach(x => x.classList.toggle('on', x === b));
    origem ? montarFinal() : pintarMolde();
  });
  v.querySelector('#cam-virar').onclick = () => { if (origem) return; frente = !frente; ligar(); };

  /* congela o quadro da câmera (ou a foto da galeria) e monta a final */
  function disparar() {
    if (!video.videoWidth) return;
    const c = document.createElement('canvas'); c.width = video.videoWidth; c.height = video.videoHeight;
    const x = c.getContext('2d');
    if (frente) { x.translate(c.width, 0); x.scale(-1, 1); }   // a selfie sai como ela se vê no espelho
    x.drawImage(video, 0, 0);
    origem = c; if (navigator.vibrate) navigator.vibrate(30);
    parar(); montarFinal();
  }
  function daGaleria(e) {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const i = new Image(); i.onload = () => { origem = i; parar(); montarFinal(); }; i.src = URL.createObjectURL(f);
  }
  const ACOES_CAMERA = `<label class="bt linha cam-galeria">Da galeria<input type="file" accept="image/*" hidden id="cam-arq"/></label>
      <button class="cam-disparo" id="cam-disparo" aria-label="Tirar foto"></button><span class="cam-vazio"></span>`;
  function ligarAcoes() {
    v.querySelector('#cam-acoes').innerHTML = ACOES_CAMERA;
    v.querySelector('#cam-disparo').onclick = disparar;
    v.querySelector('#cam-arq').onchange = daGaleria;
  }
  ligarAcoes();

  let final = null;
  async function montarFinal() {
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    const sw = origem.width || origem.naturalWidth, sh = origem.height || origem.naturalHeight;
    const esc = Math.max(W / sw, H / sh), dw = sw * esc, dh = sh * esc;     // cobre o quadro, corta o excesso
    const f = FILTROS.find(z => z[0] === filtro)[2];
    if (FILTRO_CANVAS) x.filter = f;
    x.drawImage(origem, (W - dw) / 2, (H - dh) / 2, dw, dh);
    x.filter = 'none';
    if (!FILTRO_CANVAS && filtro !== 'natural') filtrarPixels(x, filtro);
    await desenharMoldura(x, moldura);
    final = c;
    fotoEl.src = c.toDataURL('image/jpeg', .9);
    fotoEl.classList.remove('oculto'); video.classList.add('oculto'); molde.classList.add('oculto');
    v.querySelector('#cam-virar').classList.add('oculto');
    v.querySelector('#cam-acoes').innerHTML = `
      <button class="bt linha" id="cam-outra">Outra foto</button>
      <button class="bt ouro cam-salvar" id="cam-salvar">Salvar / postar</button>`;
    v.querySelector('#cam-outra').onclick = () => {
      origem = null; final = null;
      fotoEl.classList.add('oculto'); video.classList.remove('oculto'); molde.classList.remove('oculto');
      v.querySelector('#cam-virar').classList.remove('oculto');
      ligarAcoes(); ligar(); pintarMolde();
    };
    v.querySelector('#cam-salvar').onclick = salvar;
  }
  /* celular: abre o compartilhar (Salvar imagem, Instagram, WhatsApp...); senão baixa o arquivo */
  async function salvar() {
    const blob = await new Promise(r => final.toBlob(r, 'image/jpeg', .92));
    const nome = `jardim-do-eder-${Date.now()}.jpg`;
    const arq = new File([blob], nome, {type: 'image/jpeg'});
    if (navigator.canShare && navigator.canShare({files: [arq]})) {
      try { await navigator.share({files: [arq], text: 'Jardim do Éder 🐆 @spesso.rio'}); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
  }

  await ligar(); pintarMolde();
}

/* molduras: folhas da selva em volta (a mesma arte do convite) ou a fita creme do convite */
async function desenharMoldura(x, m) {
  const W = x.canvas.width, H = x.canvas.height;
  try { await document.fonts.load('80px "Pinyon Script"'); await document.fonts.load('40px "Kaushan Script"'); } catch {}
  if (m === 'folhas') {
    const img = await carregarFolhas();
    if (img) {
      // folhas só na borda: apaga o miolo com um gradiente (o centro da arte é verde liso)
      const o = document.createElement('canvas'); o.width = W; o.height = H;
      const ox = o.getContext('2d');
      const tile = (ix, iy, iw, ih, dx, dy, dw, dh) => ox.drawImage(img, ix, iy, iw, ih, dx, dy, dw, dh);
      const iw = img.width, ih = img.height;
      tile(0, 0, iw, ih * .42, 0, 0, W, H * .30);                       // copa em cima
      tile(0, ih * .62, iw, ih * .38, 0, H * .80, W, H * .20);          // folhagem embaixo
      ox.save(); ox.translate(0, H * .28); tile(0, ih * .2, iw * .2, ih * .6, 0, 0, W * .16, H * .54); ox.restore();
      ox.save(); ox.translate(W * .84, H * .28); tile(iw * .8, ih * .2, iw * .2, ih * .6, 0, 0, W * .16, H * .54); ox.restore();
      ox.globalCompositeOperation = 'destination-out';
      const g = ox.createRadialGradient(W / 2, H * .5, Math.min(W, H) * .36, W / 2, H * .5, Math.min(W, H) * .47);
      g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      ox.fillStyle = g; ox.fillRect(0, 0, W, H);
      x.drawImage(o, 0, 0);
    }
    const sombra = x.createLinearGradient(0, H * .72, 0, H);
    sombra.addColorStop(0, 'rgba(6,20,12,0)'); sombra.addColorStop(1, 'rgba(6,20,12,.75)');
    x.fillStyle = sombra; x.fillRect(0, H * .72, W, H * .28);
    x.save();
    x.fillStyle = '#F4E8CB'; x.textAlign = 'center';
    x.shadowColor = 'rgba(0,0,0,.75)'; x.shadowBlur = 18;
    x.font = '108px "Pinyon Script"'; x.fillText('Jardim do Éder', W / 2, H - 92);
    x.font = '700 30px Alegreya, Georgia, serif'; x.fillStyle = '#F3C766';
    x.fillText('@spesso.rio  ·  27·11·26', W / 2, H - 38);
    x.restore();
  } else if (m === 'fita') {
    x.save();
    x.translate(W / 2, H - 150); x.rotate(-0.035);
    const fw = W * .84, fh = 118;
    x.shadowColor = 'rgba(0,0,0,.45)'; x.shadowBlur = 24; x.shadowOffsetY = 8;
    x.fillStyle = '#F4E8CB';
    x.beginPath();
    x.moveTo(-fw / 2, -fh / 2); x.lineTo(fw / 2, -fh / 2); x.lineTo(fw / 2 - 30, 0); x.lineTo(fw / 2, fh / 2);
    x.lineTo(-fw / 2, fh / 2); x.lineTo(-fw / 2 + 30, 0); x.closePath(); x.fill();
    x.shadowColor = 'transparent';
    x.fillStyle = '#3A2312'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = '64px "Kaushan Script"'; x.fillText('Solte suas feras', 0, -6);
    x.restore();
    x.save(); x.fillStyle = '#F4E8CB'; x.textAlign = 'center'; x.shadowColor = 'rgba(0,0,0,.7)'; x.shadowBlur = 14;
    x.font = '700 30px Alegreya, Georgia, serif'; x.fillText('Jardim do Éder  ·  @spesso.rio', W / 2, H - 42);
    x.restore();
  } else {
    x.save(); x.fillStyle = 'rgba(244,232,203,.92)'; x.textAlign = 'right'; x.shadowColor = 'rgba(0,0,0,.6)'; x.shadowBlur = 10;
    x.font = '700 28px Alegreya, Georgia, serif'; x.fillText('Jardim do Éder · @spesso.rio', W - 34, H - 34);
    x.restore();
  }
}

/* aniversário (dia e mês): para convidar a fazer a festa dela aqui */
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
let anivPulou = false; try { anivPulou = !!sessionStorage.getItem('festa_aniv_pulou'); } catch {}
function anivHtml() {
  if (!D || D.vitrine || D.eu.tem_aniversario || anivPulou) return '';
  return `<div class="aniv" id="aniv"><div class="rot">Quando é o seu aniversário?</div>
    <p class="d" style="margin:0 0 10px">Só dia e mês. A gente adora fazer festa e quer te chamar para a sua.</p>
    <div class="sel"><select id="aniv-d" aria-label="dia"><option value="">dia</option>${Array.from({length:31},(_,i)=>`<option>${i+1}</option>`).join('')}</select>
    <select id="aniv-m" aria-label="mês"><option value="">mês</option>${MESES.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('')}</select></div>
    <div style="display:flex;gap:8px;margin-top:10px"><button class="bt ouro" id="aniv-ok">Salvar</button><button class="bt linha" id="aniv-nao">Agora não</button></div>
    <div id="aniv-msg"></div></div>`;
}
function ligarAniv() {
  if (!$('#aniv')) return;
  $('#aniv-nao').onclick = () => { anivPulou = true; try { sessionStorage.setItem('festa_aniv_pulou', '1'); } catch {} $('#aniv').remove(); };
  $('#aniv-ok').onclick = async () => {
    const d = +$('#aniv-d').value, m = +$('#aniv-m').value;
    if (!d || !m) { $('#aniv-msg').innerHTML = '<div class="aviso">Escolha o dia e o mês.</div>'; return; }
    try {
      await rpc('ev_cliente_aniversario', {p_token: token, p_dia: d, p_mes: m});
      D.eu.tem_aniversario = true;
      $('#aniv').innerHTML = `<p style="margin:0">Anotado: <b>${d} de ${MESES[m-1]}</b>. 🎉</p>`;
    } catch (e) {
      $('#aniv-msg').innerHTML = `<div class="aviso">${e.codigo === 'data_invalida' ? 'Essa data não existe. Confira o dia.' : 'Não consegui salvar. Tente de novo.'}</div>`;
    }
  };
}

function qrSvg(texto) {
  const q = qrcode(0, 'M'); q.addData(texto); q.make();
  return q.createSvgTag({cellSize: 6, margin: 2, scalable: true});
}
function abrirVoucher(p, novo) {
  if (!p) return;
  const titulo = p.bistro ? `O garçom leva até a bistrô ${p.bistro}`
               : p.retirar ? `Retire no ${nomeBar(p.retirar)}` : (p.tipo === 'bebida' ? 'Mostre no bar' : 'Mostre a um garçom');
  abrirFolha(`<div class="voucher">
    ${novo ? `<div class="aviso info" style="margin:0 0 6px">Pedido feito! ${p.bistro ? 'Já está sendo preparado.' : 'Mostre este voucher no balcão.'}</div>` : ''}
    <div class="onde">${esc(titulo)}</div>
    <div class="cod-g">${p.voucher}</div>
    <h3 style="margin-top:6px">${p.qtd}× ${esc(p.nome)}</h3>
    <div class="quem">Pulseira ${D.eu.pulseira} · ${esc(D.eu.nome)}</div>
    ${p.entregue ? '<div class="usado">Já entregue</div>' : `<div class="qr">${qrSvg(EQUIPE + 'V-' + p.voucher)}</div>`}
    <div style="display:grid;gap:10px;margin-top:14px">
      ${p.entregue ? '' : `<button class="bt creme" style="padding:14px;font-size:17px" id="recebi">✓ ${BOTAO_RECEBI(p)}</button>`}
      <button class="bt ouro" style="padding:14px" id="mais-um">Pedir mais alguma coisa</button>
      <button class="bt linha" style="padding:12px" id="ok">Fechar</button>
    </div>${novo ? anivHtml() : ''}</div>`);
  $('#ok').onclick = fecharFolha;
  const rb = $('#recebi'); if (rb) rb.onclick = () => confirmarRecebi(p);
  ligarAniv();
  $('#mais-um').onclick = () => { fecharFolha(); aba = 'cardapio'; desenhar(); };
}

async function pedirConta() {
  try {
    const r = await rpc('ev_pedir_conta', {p_token: token});
    D = await rpc('ev_cliente', {p_token: token});
    desenhar();
    const c = r.conta;
    abrirFolha(`<div class="voucher">
      <div class="onde">Mostre ao caixa</div>
      <div class="qr">${qrSvg(EQUIPE + 'C-' + r.conta_codigo)}</div>
      <div class="cod">${r.conta_codigo}</div>
      <h3 style="margin-top:10px">Total ${brl(c.total)}</h3>
      ${c.falta_minimo > 0 ? `<p class="d">Inclui o complemento da consumação mínima: ${brl(c.falta_minimo)}.</p>` : ''}
      <div class="quem">Pulseira ${D.eu.pulseira} · ${esc(D.eu.nome)}</div>
      <p class="d" style="margin-top:10px">Se pedir mais alguma coisa, a conta reabre sozinha.</p>
      <button class="bt linha" style="padding:12px;margin-top:16px;width:100%" id="ok">Fechar</button></div>`);
    $('#ok').onclick = fecharFolha;
  } catch (e) {
    abrirFolha(`<div class="aviso">Não consegui pedir a conta. Confira a internet e tente de novo.</div>
      <button class="bt linha" style="padding:12px;margin-top:16px;width:100%" onclick="fecharFolha()">Fechar</button>`);
  }
}

/* atualiza sozinho (status do voucher, conta) sem atrapalhar quem está escolhendo */
setInterval(() => {
  if (document.hidden || !token || !D || D.vitrine) return;
  if (!$('#folha').classList.contains('oculto')) return;
  const y = window.scrollY;
  rpc('ev_cliente', {p_token: token}).then(d => {
    const mudou = JSON.stringify(d) !== JSON.stringify(D);
    const virou = D && D.eu && (D.eu.pulseira !== d.eu.pulseira || D.eu.liberada !== d.eu.liberada);
    D = d;
    if (virou) { desenhar(); window.scrollTo(0, y); return; } $('#rede').classList.add('oculto');
    if (mudou && aba !== 'cardapio') { desenhar(); window.scrollTo(0, y); }
    else if (mudou) { desenharConsumo(); }
  }).catch(() => $('#rede').classList.remove('oculto'));
}, 10000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && D) carregar(); });
window.addEventListener('online', carregar);

carregar();
</script>
